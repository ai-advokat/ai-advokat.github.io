<style>
:root{--bg:#f4f7fa;--surface:#fff;--ink:#102033;--muted:#5b6979;--line:#dbe3ea;--navy:#0c2038;--blue:#173d66;--amber:#8a5a00;--red:#9b1c1c;--green:#1b6a45;--soft:#edf4fa;--gold:#b9985b;--shadow:0 12px 32px rgba(12,32,56,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.62 system-ui,-apple-system,Segoe UI,sans-serif}a{color:var(--blue)}button{font:inherit}
.wrap{max-width:1060px;margin:auto;padding:0 20px}header{background:var(--navy);color:#fff}.top{padding:17px 0;display:flex;justify-content:space-between;gap:16px;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:800}
main{padding:34px 0 64px}.crumb{font-size:.9rem;color:var(--muted);margin-bottom:14px}.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:.75rem;font-weight:850;background:var(--soft);color:var(--blue)}.pill.warn{background:#fff1d6;color:var(--amber)}.pill.archive{background:#fbe9e9;color:var(--red)}.pill.checked{background:#e7f4ed;color:var(--green)}.pill.lock{background:#f2ede3;color:#6f5320}
h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.06;letter-spacing:-.035em;margin:.3em 0}.lead{font-size:1.08rem;color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-top:24px}.panel{border:1px solid var(--line);border-radius:14px;padding:19px;background:#fff}.panel h2{font-size:1.1rem;margin-top:0}.kv{display:grid;grid-template-columns:165px 1fr;gap:7px 12px;font-size:.94rem}.kv dt{font-weight:800}.kv dd{margin:0;color:var(--muted);word-break:break-word}.notice-stack{display:grid;gap:10px;margin-top:20px}.legal-notice{border-left:4px solid var(--red);background:#fff3f1;padding:15px 17px;border-radius:9px}.legal-notice strong{display:block;margin-bottom:4px}.legal-notice small{display:block;color:var(--muted);margin-top:7px}.approval-note{border-left:4px solid var(--green);background:#eef8f2;padding:13px 16px;border-radius:9px;margin-top:14px}.guard{margin-top:20px;border-left:4px solid var(--amber);background:#fff8e7;padding:15px 17px;border-radius:9px}.flow{margin-top:20px;background:#0c2038;color:#fff;border-radius:14px;padding:18px}.flow code{color:#f5d89b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border-radius:10px;padding:11px 14px;text-decoration:none;font-weight:850;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.related{margin-top:30px}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.related a{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none}.related small{color:var(--muted);display:block;margin-top:6px}.error{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
footer{border-top:1px solid var(--line);background:#fff;padding:22px 0;color:var(--muted)}
@media(max-width:760px){.grid,.related-grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
@media print{header,.actions,.related,footer{display:none}body{background:#fff}.sheet{box-shadow:none;border:0;padding:0}}
</style>
</head>
<body data-catalog-build="guides-v2-1-v2-final-master-2026-10-04">
<header><div class="wrap top"><a href="/">AI Advokat</a><nav><a href="/guides/">← Практични водичи</a></nav></div></header>
<main><div class="wrap">
<div class="crumb"><a href="/guides/">Практични водичи</a> / детален јавен запис</div>
<div id="view"><div class="error">Се вчитува записот…</div></div>
<div id="related" class="related" hidden><h2>Сродни водичи</h2><div id="relatedGrid" class="related-grid"></div></div>
</div></main>
<footer><div class="wrap">AI Advokat · Правото, организирано. AI, под човечка контрола.</div></footer>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const verificationClass=s=>s==="archive"?"archive":(["sources_checked","specific_point_checked","specific_provision_checked","base_legal_reviewed"].includes(s)?"checked":"warn");
const sourceRoleLabel=s=>s==="version_history"?"Архивска верзија":s==="primary_full_word"?"Изворен DOCX водич":s==="special"?"Посебен изворен запис":"Изворен водич";
const qs=new URLSearchParams(location.search), slug=qs.get("g"), legacyId=qs.get("id");
function share(){
 const u=location.href;
 if(navigator.share){navigator.share({title:document.title,url:u}).catch(()=>{})}
 else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>alert("Линкот е копиран."))}
 else prompt("Копирај го линкот:",u);
}
function versionLink(target,all){
 if(!target) return "—";
 const x=all.find(r=>r.id===target);
 if(!x) return "—";
 const label=x.display_title||x.title;
 return x.catalog_public===true&&x.public_record_enabled===true
   ? '<a href="'+esc(x.public_record_url)+'">'+esc(label)+'</a>'
   : esc(label)+' <small>— контролирана верзија што не е јавно активирана во каталогот</small>';
}
fetch("/data/guides.json?v=20261004-v2-final-master",{cache:"no-store"}).then(r=>r.json()).then(d=>{
 const allRecords=d.records;
 const publicRecords=allRecords.filter(x=>x.catalog_public===true&&x.public_record_enabled===true);
 const x=publicRecords.find(r=>(slug&&r.public_slug===slug)||(!slug&&legacyId&&r.id===legacyId));
 if(!x){document.title="Записот не е јавно достапен · AI Advokat";document.querySelector("#view").innerHTML='<div class="error"><h1>Записот не е јавно достапен</h1><p>Овој запис не е дел од одобрениот јавен каталог од 39 записи.</p><p><a href="/guides/">← Назад кон каталогот</a></p></div>';return}
 const title=x.display_title||x.title;
 document.title=title+" · AI Advokat";
 const canon=document.createElement("link");canon.rel="canonical";canon.href=new URL(x.public_record_url,location.origin).href;document.head.appendChild(canon);
 const desc=document.querySelector('meta[name="description"]');desc.content=x.scope;
 const ogTitle=document.querySelector('meta[property="og:title"]');if(ogTitle) ogTitle.content=title+" · AI Advokat";
 const ogDesc=document.querySelector('meta[property="og:description"]');if(ogDesc) ogDesc.content=x.scope;
 const ogUrl=document.querySelector('meta[property="og:url"]');if(ogUrl) ogUrl.content=new URL(x.public_record_url,location.origin).href;
 const structured={"@context":"https://schema.org","@type":"CreativeWork","name":title,"dateModified":x.edition_date,"description":x.scope,"isPartOf":{"@type":"CollectionPage","name":"Моите права во секојдневниот живот","url":"https://ai-advokat.github.io/guides/"}};
 const ld=document.createElement("script");ld.type="application/ld+json";ld.textContent=JSON.stringify(structured);document.head.appendChild(ld);
 const editionDisplay=x.source_role==="primary_full_word"?"Изворно издание од "+x.edition_date:x.edition;
 const pagesRow=x.pages!=null?`<dt>Страници</dt><dd>${esc(x.pages)}</dd>`:"";
 const ar=x.attribution_roles||{};
 const roleRows=[
   ar.author?`<dt>Автор</dt><dd>${esc(ar.author)}</dd>`:"",
   ar.source_provider?`<dt>Доставил изворна верзија</dt><dd>${esc(ar.source_provider)}</dd>`:"",
   ar.editor_or_adaptor?`<dt>Редакција / адаптација</dt><dd>${esc(ar.editor_or_adaptor)}</dd>`:"",
   ar.authorial_review_target?`<dt>Авторска редакција</dt><dd>${esc(ar.authorial_review_target)}</dd>`:"",
   ar.ai_assisted_editorial_support?`<dt>AI-поддршка</dt><dd>${esc(ar.ai_assisted_editorial_support.label_mk)}<br><small>AI-поддршката не е правен авторитет.</small></dd>`:""
 ].join("");
 const legacyRows=(ar.legacy_branding||[]).length?`<dt>Историско/изворно брендирање</dt><dd>${esc(ar.legacy_branding.join(" · "))}${x.legacy_branding_note_mk?`<br><small>${esc(x.legacy_branding_note_mk)}</small>`:""}</dd>`:"";
 const reviewBindingRow=x.legal_review_binding?`<dt>Врзана правна проверка</dt><dd>${esc(x.legal_review_binding.check_date)} · точна датотека и SHA-256 потврдени со Human Gate<br><small>${esc(x.legal_review_binding.pack_id)}</small></dd>`:"";
 const masterRows=x.public_master_artifact?`<dt>Активен master артефакт</dt><dd><strong>${esc(x.public_master_artifact.artifact_version)}</strong><br><small>DOCX: ${esc(x.public_master_artifact.docx_file)}</small><br><code>${esc(x.public_master_artifact.docx_sha256)}</code><br><small>PDF: ${esc(x.public_master_artifact.pdf_file)}</small><br><code>${esc(x.public_master_artifact.pdf_sha256)}</code><br><small>Каталошки статус: активен · јавен download: не е одобрен</small></dd>`:"";
 const provenanceRows=x.provenance?`<dt>Референтна основа</dt><dd>${esc(x.provenance.adapted_from)}${x.provenance.reference_isbn?`<br><small>ISBN ${esc(x.provenance.reference_isbn)}</small>`:""}${x.provenance.original_authors?.length?`<br><small>Автори на референтната публикација: ${esc(x.provenance.original_authors.join(", "))}</small>`:""}${x.provenance.public_note_mk?`<br><small>${esc(x.provenance.public_note_mk)}</small>`:""}</dd>`:"";
 const legalNotices=(x.legal_notices||[]).length?`<div class="notice-stack">${x.legal_notices.map(n=>`<div class="legal-notice"><strong>${esc(n.title_mk)}</strong>${esc(n.text_mk)}${n.limitation_mk?`<small>${esc(n.limitation_mk)}</small>`:""}${n.official_source?.url?`<small>Официјален извор: <a href="${esc(n.official_source.url)}" target="_blank" rel="noopener">${esc(n.official_source.reference||n.official_source.institution)}</a></small>`:""}</div>`).join("")}</div>`:"";
 document.querySelector("#view").innerHTML=`<article class="sheet">
 <div class="badges"><span class="pill">${x.guide_no&&x.guide_no!=="—"?"Водич "+esc(x.guide_no):"Посебен водич"}</span><span class="pill">${esc(x.display_format||x.format)}</span><span class="pill ${verificationClass(x.verification_level)}">${esc(x.verification_label)}</span><span class="pill lock">Документ: не е јавно активиран</span></div>
 <h1>${esc(title)}</h1>
 <p class="lead">${esc(x.scope)}</p>
 ${legalNotices}
 <div class="grid">
   <section class="panel"><h2>Каталошки и редакциски податоци</h2><dl class="kv">
   <dt>Област</dt><dd>${esc(x.category_label)}</dd>
   <dt>Подобласт</dt><dd>${esc(x.subcategory_label)}</dd>
   <dt>Издание</dt><dd>${esc(editionDisplay)}</dd>
   <dt>Датум</dt><dd>${esc(x.edition_date)}</dd>
   ${pagesRow}
   <dt>Јавна атрибуција</dt><dd>${esc(x.attribution_public||x.attribution)}</dd>
   ${roleRows}
   ${legacyRows}
   ${reviewBindingRow}
   ${masterRows}
   <dt>Изворна атрибуција</dt><dd>${esc(x.attribution)}</dd>
   <dt>Изворна датотека</dt><dd>${esc(x.source_file)}</dd>
   </dl></section>
   <section class="panel"><h2>Потекло и контрола на верзијата</h2><dl class="kv">
   <dt>SHA-256</dt><dd><code>${esc(x.sha256)}</code></dd>
   <dt>Улога на изворот</dt><dd>${esc(sourceRoleLabel(x.source_role))}</dd>
   <dt>Ја заменува</dt><dd>${versionLink(x.supersedes,allRecords)}</dd>
   <dt>Заменет со</dt><dd>${versionLink(x.superseded_by,allRecords)}</dd>
   ${provenanceRows}
   </dl></section>
 </div>
 <div class="approval-note"><strong>Human Gate Pack 1–7:</strong> одобрен за каталошка, правна, provenance и атрибуциска имплементација на 4.10.2026. Ова одобрение не ги активира целосните датотеки ниту AI-базата.</div>
 <div class="guard"><strong>Човечка правна контрола.</strong> Ова е јавен каталошки запис, а не јавно објавен целосен документ. Водичот не е официјален законски извор. За професионална употреба се бара проверка на важечкиот официјален извор и човечка правна ревизија. Целосната датотека и внесувањето во AI-базата не се активирани со овој каталог.</div>
 <div class="flow"><strong>Контролирана употреба:</strong> <code>каталошки запис → официјален извор → проверка на верзија → човечка правна проверка → употреба</code></div>
 <div class="actions"><a class="btn primary" href="/guides/">← Назад кон каталогот</a><button class="btn" type="button" onclick="share()">Сподели / копирај линк</button><button class="btn" type="button" onclick="print()">Печати каталошки запис</button></div>
 </article>`;

 const explicit=(x.related_records||[]).map(rel=>publicRecords.find(r=>r.id===rel.target_id)).filter(Boolean);
 const fallback=publicRecords.filter(r=>r.category_code===x.category_code&&r.id!==x.id&&r.source_role!=="version_history");
 const seen=new Set(), related=[];
 for(const r of [...explicit,...fallback]){if(!seen.has(r.id)){seen.add(r.id);related.push(r)}if(related.length>=6)break}
 if(related.length){document.querySelector("#related").hidden=false;document.querySelector("#relatedGrid").innerHTML=related.map(r=>`<a href="${esc(r.public_record_url)}"><strong>${esc(r.display_title||r.title)}</strong><small>${esc(r.verification_label)} · ${esc(r.edition_date)}</small></a>`).join("")}
}).catch(()=>{document.querySelector("#view").innerHTML='<div class="error"><h1>Неуспешно вчитување</h1><p>Обидете се повторно или вратете се кон каталогот.</p></div>'});
</script>
</body></html>
