<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Детален запис · Практични правни водичи · AI Advokat</title>
<meta name="description" content="Детален јавен metadata-запис за практичен правен водич на AI Advokat.">
<meta property="og:type" content="article">
<meta property="og:site_name" content="AI Advokat">
<meta property="og:title" content="Практичен правен водич · AI Advokat">
<meta property="og:description" content="Контролиран јавен metadata-запис со provenance, fingerprint, version history и Human Gate.">
<meta property="og:url" content="https://ai-advokat.github.io/guides/record.html">
<meta name="twitter:card" content="summary">
<style>
:root{--bg:#f4f7fa;--surface:#fff;--ink:#102033;--muted:#5b6979;--line:#dbe3ea;--navy:#0c2038;--blue:#173d66;--amber:#8a5a00;--red:#9b1c1c;--green:#1b6a45;--soft:#edf4fa;--gold:#b9985b;--shadow:0 12px 32px rgba(12,32,56,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.62 system-ui,-apple-system,Segoe UI,sans-serif}a{color:var(--blue)}button{font:inherit}
.wrap{max-width:1060px;margin:auto;padding:0 20px}header{background:var(--navy);color:#fff}.top{padding:17px 0;display:flex;justify-content:space-between;gap:16px;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:800}
main{padding:34px 0 64px}.crumb{font-size:.9rem;color:var(--muted);margin-bottom:14px}.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:.75rem;font-weight:850;background:var(--soft);color:var(--blue)}.pill.warn{background:#fff1d6;color:var(--amber)}.pill.archive{background:#fbe9e9;color:var(--red)}.pill.checked{background:#e7f4ed;color:var(--green)}.pill.lock{background:#f2ede3;color:#6f5320}
h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.06;letter-spacing:-.035em;margin:.3em 0}.lead{font-size:1.08rem;color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-top:24px}.panel{border:1px solid var(--line);border-radius:14px;padding:19px;background:#fff}.panel h2{font-size:1.1rem;margin-top:0}.kv{display:grid;grid-template-columns:155px 1fr;gap:7px 12px;font-size:.94rem}.kv dt{font-weight:800}.kv dd{margin:0;color:var(--muted);word-break:break-word}.guard{margin-top:20px;border-left:4px solid var(--amber);background:#fff8e7;padding:15px 17px;border-radius:9px}.flow{margin-top:20px;background:#0c2038;color:#fff;border-radius:14px;padding:18px}.flow code{color:#f5d89b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border-radius:10px;padding:11px 14px;text-decoration:none;font-weight:850;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.related{margin-top:30px}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.related a{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none}.related small{color:var(--muted);display:block;margin-top:6px}.error{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
footer{border-top:1px solid var(--line);background:#fff;padding:22px 0;color:var(--muted)}
@media(max-width:760px){.grid,.related-grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
@media print{header,.actions,.related,footer{display:none}body{background:#fff}.sheet{box-shadow:none;border:0;padding:0}}
</style>
</head>
<body>
<header><div class="wrap top"><a href="/">AI Advokat</a><nav><a href="/guides/">← Практични водичи</a></nav></div></header>
<main><div class="wrap">
<div class="crumb"><a href="/guides/">Практични водичи</a> / детален јавен запис</div>
<div id="view"><div class="error">Се вчитува записот…</div></div>
<div id="related" class="related" hidden><h2>Сродни водичи од истата област</h2><div id="relatedGrid" class="related-grid"></div></div>
</div></main>
<footer><div class="wrap">AI Advokat · Правото, организирано. AI, под човечка контрола.</div></footer>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls=s=>s==="superseded_draft"?"archive":(s==="source_checked_review"||s==="author_version_checked")?"checked":"warn";
const qs=new URLSearchParams(location.search), id=qs.get("id");
function share(){
 const u=location.href;
 if(navigator.share){navigator.share({title:document.title,url:u}).catch(()=>{})}
 else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>alert("Линкот е копиран."))}
 else prompt("Копирај го линкот:",u);
}
function versionLink(target,all){
 if(!target) return "—";
 const x=all.find(r=>r.id===target&&r.catalog_public===true);
 return x?'<a href="'+esc(x.public_record_url)+'">'+esc(x.title)+'</a>':esc(target);
}
fetch("/data/guides.json").then(r=>r.json()).then(d=>{
 const publicRecords=d.records.filter(x=>x.catalog_public===true&&x.public_record_enabled===true);
 const x=publicRecords.find(r=>r.id===id);
 if(!x){document.title="Записот не е јавно достапен · AI Advokat";document.querySelector("#view").innerHTML='<div class="error"><h1>Записот не е јавно достапен</h1><p>Овој ID не е дел од одобрениот јавен каталог од 38 metadata записи.</p><p><a href="/guides/">← Назад кон каталогот</a></p></div>';return}
 document.title=x.title+" · AI Advokat";
 const canon=document.createElement("link");canon.rel="canonical";canon.href=new URL(x.public_record_url,location.origin).href;document.head.appendChild(canon);
 const desc=document.querySelector('meta[name="description"]');desc.content=x.scope;
 const ogTitle=document.querySelector('meta[property="og:title"]');if(ogTitle) ogTitle.content=x.title+" · AI Advokat";
 const ogDesc=document.querySelector('meta[property="og:description"]');if(ogDesc) ogDesc.content=x.scope;
 const ogUrl=document.querySelector('meta[property="og:url"]');if(ogUrl) ogUrl.content=new URL(x.public_record_url,location.origin).href;
 const structured={"@context":"https://schema.org","@type":"CreativeWork","name":x.title,"author":{"@type":"Person","name":"Зоран Стојанкиќ"},"dateModified":x.edition_date,"description":x.scope,"isPartOf":{"@type":"CollectionPage","name":"Моите права во секојдневниот живот","url":"https://ai-advokat.github.io/guides/"}};
 const ld=document.createElement("script");ld.type="application/ld+json";ld.textContent=JSON.stringify(structured);document.head.appendChild(ld);
 document.querySelector("#view").innerHTML=`<article class="sheet">
 <div class="badges"><span class="pill">${x.guide_no&&x.guide_no!=="—"?"Водич "+esc(x.guide_no):"Посебен водич"}</span><span class="pill">${esc(x.format)}</span><span class="pill ${cls(x.status)}">${esc(x.status_label)}</span><span class="pill lock">PDF/DOCX: Human Gate</span></div>
 <h1>${esc(x.title)}</h1>
 <p class="lead">${esc(x.scope)}</p>
 <div class="grid">
   <section class="panel"><h2>Библиографски и редакциски податоци</h2><dl class="kv">
   <dt>Област</dt><dd>${esc(x.category)}</dd>
   <dt>Издание</dt><dd>${esc(x.edition)}</dd>
   <dt>Датум</dt><dd>${esc(x.edition_date)}</dd>
   <dt>Страници</dt><dd>${esc(x.pages??"—")}</dd>
   <dt>Атрибуција</dt><dd>${esc(x.attribution)}</dd>
   <dt>Изворна датотека</dt><dd>${esc(x.source_file)}</dd>
   </dl></section>
   <section class="panel"><h2>Provenance и version control</h2><dl class="kv">
   <dt>Record ID</dt><dd><code>${esc(x.id)}</code></dd>
   <dt>SHA-256</dt><dd><code>${esc(x.sha256)}</code></dd>
   <dt>Source role</dt><dd>${esc(x.source_role)}</dd>
   <dt>Ја заменува</dt><dd>${versionLink(x.supersedes,publicRecords)}</dd>
   <dt>Заменет со</dt><dd>${versionLink(x.superseded_by,publicRecords)}</dd>
   ${x.provenance?`<dt>Reference</dt><dd>${esc(x.provenance.adapted_from)}<br><small>${esc(x.provenance.provenance_role)}</small></dd>`:""}
   </dl></section>
 </div>
 <div class="guard"><strong>Human Gate.</strong> Ова е јавен metadata-запис, не јавно објавен документ. Водичот не е официјален законски извор. За професионална употреба се бара проверка на важечкиот официјален извор и човечка правна ревизија. PDF/DOCX download, RAG eligibility и production corpus не се активирани.</div>
 <div class="flow"><strong>Контролирана употреба:</strong> <code>guide metadata → official-source check → version check → human legal review → use</code></div>
 <div class="actions"><a class="btn primary" href="/guides/">← Назад кон каталогот</a><button class="btn" type="button" onclick="share()">Сподели / копирај линк</button><button class="btn" type="button" onclick="print()">Печати metadata-запис</button></div>
 </article>`;
 const related=publicRecords.filter(r=>r.category===x.category&&r.id!==x.id).slice(0,6);
 if(related.length){document.querySelector("#related").hidden=false;document.querySelector("#relatedGrid").innerHTML=related.map(r=>`<a href="${esc(r.public_record_url)}"><strong>${esc(r.title)}</strong><small>${esc(r.edition)} · ${esc(r.edition_date)}</small></a>`).join("")}
}).catch(()=>{document.querySelector("#view").innerHTML='<div class="error"><h1>Неуспешно вчитување</h1><p>Обидете се повторно или вратете се кон каталогот.</p></div>'});
</script>
</body></html>
