name: Zoran professional access

on:
  push:
    branches: ["main"]
    paths:
      - ".github/activation/zoran-professional-test-access.json"

permissions:
  contents: read

concurrency:
  group: ai-advokat-zoran-professional-access
  cancel-in-progress: false

jobs:
  activate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify bounded owner-authorized professional access request
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync(".github/activation/zoran-professional-test-access.json","utf8"));
          if(d.activation_authorized!==true) throw new Error("Professional access not authorized");
          if(d.purpose!=="owner_professional_access") throw new Error("Unexpected purpose");
          if(d.access_mode!=="permanent_until_revoked") throw new Error("Unexpected access mode");
          if(d.plan_code!=="office" || d.status!=="active") throw new Error("Unexpected entitlement");
          if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email||"")) throw new Error("Invalid account email");
          if(!/^[a-f0-9]{64}$/.test(d.access_key_hash)) throw new Error("Invalid key hash");
          if(d.expires_at!==null) throw new Error("Permanent access must have null expiry");
          if(d.human_gate_required!==true) throw new Error("Human Gate required");
          if(d.autonomous_filing!==false || d.autonomous_signature!==false || d.autonomous_external_transmission!==false) throw new Error("Safety boundary changed");
          console.log("Bounded owner permanent access authorization: PASS");
          NODE

      - name: Verify membership schema exists
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
            SELECT name FROM sqlite_master
            WHERE type='table'
              AND name IN ('membership_accounts','membership_entitlements','membership_access_keys')
            ORDER BY name;
          " > /tmp/zoran-access-schema.txt
          grep -q "membership_accounts" /tmp/zoran-access-schema.txt
          grep -q "membership_entitlements" /tmp/zoran-access-schema.txt
          grep -q "membership_access_keys" /tmp/zoran-access-schema.txt

      - name: Activate bounded Zoran permanent membership
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/zoran-access.sql
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync(".github/activation/zoran-professional-test-access.json","utf8"));
          const q=v=>"'" + String(v).replaceAll("'","''") + "'";
          if(d.reset_usage===true) console.log("DELETE FROM membership_usage_monthly WHERE subject_key="+q("account:"+d.account_id)+";");
          console.log("DELETE FROM membership_access_keys WHERE account_id="+q(d.account_id)+";");
          console.log("DELETE FROM membership_entitlements WHERE account_id="+q(d.account_id)+";");
          console.log("INSERT INTO membership_accounts(id,display_name,email,status) VALUES ("+[q(d.account_id),q(d.display_name),q(d.email),q("active")].join(",")+") ON CONFLICT(id) DO UPDATE SET display_name=excluded.display_name,email=excluded.email,status='active',updated_at=CURRENT_TIMESTAMP;");
          console.log("INSERT INTO membership_entitlements(id,account_id,plan_code,status,billing_cycle,monthly_quota,seat_limit,price_mkd,expires_at) VALUES ("+[q(d.entitlement_id),q(d.account_id),q(d.plan_code),q(d.status),q("manual"),String(d.monthly_quota),String(d.seat_limit),"0","NULL"].join(",")+");");
          console.log("INSERT INTO membership_access_keys(id,account_id,key_hash,key_prefix,label,status,expires_at) VALUES ("+[q(d.key_id),q(d.account_id),q(d.access_key_hash),q(d.access_key_prefix),q("Owner-authorized permanent professional access"),q("active"),"NULL"].join(",")+");");
          NODE
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --file /tmp/zoran-access.sql > /tmp/zoran-access-apply.txt
          rm -f /tmp/zoran-access.sql

      - name: Verify active access without revealing credential
        shell: bash
        run: |
          set -euo pipefail
          SQL="$(node <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync(".github/activation/zoran-professional-test-access.json","utf8"));
          const q=v=>"'" + String(v).replaceAll("'","''") + "'";
          process.stdout.write("SELECT CASE WHEN COUNT(*)=1 THEN 'ZORAN_ACCESS_OK' ELSE 'ZORAN_ACCESS_FAIL' END AS result FROM membership_accounts a JOIN membership_entitlements e ON e.account_id=a.id JOIN membership_access_keys k ON k.account_id=a.id WHERE a.id="+q(d.account_id)+" AND a.email="+q(d.email)+" AND a.status='active' AND e.plan_code='office' AND e.status='active' AND k.status='active' AND k.key_hash="+q(d.access_key_hash)+" AND k.expires_at IS NULL AND e.expires_at IS NULL;");
          NODE
          )"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "$SQL" | tee /tmp/zoran-access-verify.txt
          grep -q "ZORAN_ACCESS_OK" /tmp/zoran-access-verify.txt
          echo "ZORAN PROFESSIONAL ACCESS: ACTIVE - NO EXPIRY"

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoran-professional-access-evidence
          retention-days: 14
          path: |
            /tmp/zoran-access-schema.txt
            /tmp/zoran-access-apply.txt
            /tmp/zoran-access-verify.txt
