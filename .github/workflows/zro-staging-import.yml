name: ZRO staging import

on:
  workflow_dispatch:
  push:
    branches:
      - slvesnik-public-corpus-collector-29sep2026
    paths:
      - ".github/workflows/zro-staging-import.yml"

permissions:
  contents: read

jobs:
  import-zro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tooling
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify staging target
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.preview-migrations.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(!d || d.binding!=="PREVIEW_DB" || d.database_name!=="ai-advokat-db-staging" || d.database_id!=="eb560e98-9fc0-408e-9c81-9b823ffde44d") {
            throw new Error("Unexpected staging target");
          }
          console.log("STAGING TARGET OK", d.database_name, d.database_id);
          NODE

      - name: Guard exact pending migration set
        shell: bash
        run: |
          npx wrangler d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc | tee /tmp/pending.txt
          found="$(grep -Eo '001[0-9]+_[A-Za-z0-9_.-]+\.sql' /tmp/pending.txt | sort -u)"
          test "$found" = "0016_article_version_candidates.sql"
          echo "Exact pending migration guard: PASS"

      - name: Guard ZRO baseline state
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT id,canonical_key,title,current_status,human_review_status FROM legal_instruments WHERE canonical_key='mk:zro';"             | tee /tmp/zro-baseline.txt
          grep -q '"canonical_key": "mk:zro"' /tmp/zro-baseline.txt
          grep -q '"current_status": "needs_version_review"' /tmp/zro-baseline.txt

          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT COUNT(*) AS article_count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro');"             | tee /tmp/zro-count-before.txt
          grep -q '"article_count": 0' /tmp/zro-count-before.txt
          echo "ZRO baseline state: PASS"

      - name: Apply migration 0016 only
        run: npx wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc

      - name: Verify migration 0016
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT version,description FROM schema_migrations WHERE version='16'; SELECT name FROM sqlite_master WHERE type='table' AND name='legal_article_version_candidates';"             | tee /tmp/v16-verify.txt
          grep -q '"version": "16"' /tmp/v16-verify.txt
          grep -q '"name": "legal_article_version_candidates"' /tmp/v16-verify.txt

      - name: Download and verify official ZRO PDF
        shell: bash
        run: |
          set -euo pipefail
          URL="https://portal.mdt.gov.mk/post-body-files/zakoni-met-file-LaRm.pdf"
          curl --fail --location --retry 3 --retry-delay 2             --connect-timeout 20 --max-time 120             --user-agent "AI-Advokat-Official-Source-Audit/1.0"             "$URL" -o /tmp/zro-2023.pdf
          test -s /tmp/zro-2023.pdf
          head -c 5 /tmp/zro-2023.pdf | grep -q "%PDF-"
          pdfinfo /tmp/zro-2023.pdf | tee /tmp/zro-2023-pdfinfo.txt
          grep -Eq "^Pages:[[:space:]]+108$" /tmp/zro-2023-pdfinfo.txt
          SHA="$(sha256sum /tmp/zro-2023.pdf | cut -d' ' -f1)"
          test "$SHA" = "f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655"
          echo "$SHA" > /tmp/zro-2023.sha256
          echo "Official PDF SHA: PASS"

      - name: Extract clean text
        run: |
          pdftotext -layout /tmp/zro-2023.pdf /tmp/zro-2023-raw.txt
          node scripts/clean-official-legal-pdf-text.mjs             /tmp/zro-2023-raw.txt             /tmp/zro-2023-clean.txt             /tmp/zro-2023-extraction-report.json

      - name: Parse 298 articles
        shell: bash
        run: |
          cat > /tmp/zro-2023-meta.json <<'EOF'
          {
            "instrument_key": "mk:zro",
            "instrument_title": "Закон за работните односи",
            "version_id": "official-consolidated-snapshot-2023-111",
            "source_url": "https://portal.mdt.gov.mk/post-body-files/zakoni-met-file-LaRm.pdf",
            "source_sha256": "f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655",
            "source_issue_number": "through-111/2023",
            "source_issue_date": "2023-05-30",
            "status": "historical",
            "extraction_method": "pdftotext_layout_plus_cleaner",
            "human_review_status": "pending"
          }
          EOF

          node scripts/parse-mk-legal-text.mjs             /tmp/zro-2023-clean.txt             /tmp/zro-2023-meta.json             /tmp/zro-2023.ndjson

          head -n 1 /tmp/zro-2023.ndjson > /tmp/zro-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("/tmp/zro-manifest.json").read_text())
          assert m["article_count"] == 298, m
          assert m["warning_count"] == 0, m
          assert m["source_sha256"] == "f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655", m
          print("Manifest gate: PASS")
          PY

      - name: Generate staging SQL
        run: |
          node scripts/legal-ndjson-to-sql.mjs /tmp/zro-2023.ndjson /tmp/zro-2023-staging.sql
          test -s /tmp/zro-2023-staging.sql

      - name: Import historical ZRO snapshot to staging only
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --file /tmp/zro-2023-staging.sql

      - name: Read-back verify 298 historical articles
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT COUNT(*) AS article_count, SUM(CASE WHEN status='historical' THEN 1 ELSE 0 END) AS historical_count, SUM(CASE WHEN status='current_consolidated' THEN 1 ELSE 0 END) AS current_count, SUM(CASE WHEN human_review_status='pending' THEN 1 ELSE 0 END) AS pending_review_count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro');"             | tee /tmp/zro-count-after.txt

          grep -q '"article_count": 298' /tmp/zro-count-after.txt
          grep -q '"historical_count": 298' /tmp/zro-count-after.txt
          grep -q '"current_count": 0' /tmp/zro-count-after.txt
          grep -q '"pending_review_count": 298' /tmp/zro-count-after.txt

          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT article_number,article_number_normalized,status,human_review_status FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') AND article_number_normalized IN ('1','25-а','298') ORDER BY id;"             | tee /tmp/zro-sample.txt

          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT run_key,article_count,warning_count,status FROM corpus_ingest_runs WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') ORDER BY id DESC LIMIT 1;"             | tee /tmp/zro-ingest-run.txt

          grep -q '"article_count": 298' /tmp/zro-ingest-run.txt
          grep -q '"warning_count": 0' /tmp/zro-ingest-run.txt
          grep -q '"status": "validated"' /tmp/zro-ingest-run.txt
          echo "ZRO staging import read-back: PASS"

      - name: Assert no production target
        run: |
          ! grep -R "12ece285-74bb-4f27-a025-2dbd1be6c59a" /tmp/zro-*.txt /tmp/v16-verify.txt /tmp/pending.txt
          echo "Production D1 id absent: PASS"

      - name: Upload staging evidence
        uses: actions/upload-artifact@v4
        with:
          name: zro-staging-import-evidence
          retention-days: 14
          path: |
            /tmp/zro-manifest.json
            /tmp/zro-count-before.txt
            /tmp/zro-count-after.txt
            /tmp/zro-sample.txt
            /tmp/zro-ingest-run.txt
            /tmp/v16-verify.txt
            /tmp/zro-2023-pdfinfo.txt
            /tmp/zro-2023.sha256
