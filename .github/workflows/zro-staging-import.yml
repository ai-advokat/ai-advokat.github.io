name: ZRO staging-only corpus import

on:
  push:
    branches:
      - slvesnik-public-corpus-collector-29sep2026
    paths:
      - ".github/workflows/zro-staging-import.yml"
      - "scripts/legal-ndjson-to-sql.mjs"
      - "scripts/parse-mk-legal-text.mjs"
      - "scripts/clean-official-legal-pdf-text.mjs"
      - "migrations/0014_stable_instrument_keys.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zro-staging-only-import
  cancel-in-progress: false

jobs:
  import-zro-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fail closed if Cloudflare secrets are missing
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify staging target only
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const prod=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const preview=JSON.parse(fs.readFileSync("wrangler.preview-migrations.jsonc","utf8"));
          const p=prod.d1_databases?.[0];
          const s=preview.d1_databases?.[0];

          if(!p || p.database_name!=="ai-advokat-db" || p.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") {
            throw new Error("Unexpected production D1 identity");
          }
          if(!s || s.binding!=="PREVIEW_DB" || s.database_name!=="ai-advokat-db-staging" || s.database_id!=="eb560e98-9fc0-408e-9c81-9b823ffde44d") {
            throw new Error("Unexpected staging D1 target");
          }
          if(p.database_id===s.database_id) throw new Error("Production and staging D1 IDs must differ");
          console.log("STAGING TARGET GUARD: PASS");
          NODE

      - name: Local corpus safety
        run: |
          npm run check:legal-parser
          npm run test:legal-parser
          npm run check:amendment-parser
          npm run test:amendment-parser

      - name: Apply schema migrations to staging only
        run: npm run db:migrate:staging

      - name: Verify migration 14 and stable ZRO identity
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT version, description FROM schema_migrations WHERE version IN ('10','11','12','13','14') ORDER BY CAST(version AS INTEGER);"
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT id, canonical_key, title, current_status, human_review_status FROM legal_instruments WHERE canonical_key='mk:zro';"

      - name: Download exact official ZRO snapshot
        shell: bash
        run: |
          set -euo pipefail
          URL="https://portal.mdt.gov.mk/post-body-files/zakoni-met-file-LaRm.pdf"
          curl --fail --location --retry 3 --retry-delay 2 "$URL" -o /tmp/zro-2023.pdf
          test -s /tmp/zro-2023.pdf
          pdfinfo /tmp/zro-2023.pdf > /tmp/zro-pdfinfo.txt
          grep -Eq "^Pages:[[:space:]]+108$" /tmp/zro-pdfinfo.txt
          SHA="$(sha256sum /tmp/zro-2023.pdf | cut -d' ' -f1)"
          test "$SHA" = "f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655"
          echo "$SHA" > /tmp/zro.sha256

      - name: Extract and parse exactly 298 historical articles
        shell: bash
        run: |
          pdftotext -layout /tmp/zro-2023.pdf /tmp/zro-raw.txt
          node scripts/clean-official-legal-pdf-text.mjs /tmp/zro-raw.txt /tmp/zro-clean.txt /tmp/zro-extraction.json

          cat > /tmp/zro-meta.json <<'EOF'
          {
            "instrument_key": "mk:zro",
            "instrument_title": "Закон за работните односи",
            "version_id": "official-consolidated-snapshot-2023-111",
            "source_url": "https://portal.mdt.gov.mk/post-body-files/zakoni-met-file-LaRm.pdf",
            "source_sha256": "f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655",
            "source_issue_number": "through-111/2023",
            "source_issue_date": "2023-05-30",
            "status": "historical",
            "extraction_method": "pdftotext_layout_plus_cleaner",
            "human_review_status": "pending"
          }
          EOF

          node scripts/parse-mk-legal-text.mjs /tmp/zro-clean.txt /tmp/zro-meta.json /tmp/zro.ndjson

          python3 - <<'PY'
          import json
          from pathlib import Path
          extraction=json.loads(Path("/tmp/zro-extraction.json").read_text())
          manifest=json.loads(Path("/tmp/zro.ndjson").read_text().splitlines()[0])

          assert extraction["appendix_truncated"] is True, extraction
          assert extraction["duplicate_article_headers"] == [], extraction
          assert manifest["instrument_key"] == "mk:zro", manifest
          assert manifest["article_count"] == 298, manifest
          assert manifest["warning_count"] == 0, manifest
          assert manifest["source_sha256"] == "f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655", manifest
          print("ZRO PARSE GATE: PASS")
          PY

      - name: Generate staging SQL
        run: node scripts/legal-ndjson-to-sql.mjs /tmp/zro.ndjson /tmp/zro-staging.sql

      - name: Import ZRO historical snapshot into staging D1 only
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --file /tmp/zro-staging.sql

      - name: Verify staging import
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT COUNT(*) AS article_count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro');"
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT status, COUNT(*) AS count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') GROUP BY status ORDER BY status;"
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT human_review_status, COUNT(*) AS count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') GROUP BY human_review_status ORDER BY human_review_status;"
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT COUNT(*) AS current_count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') AND status='current_consolidated';"
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT run_key, article_count, warning_count, status FROM corpus_ingest_runs WHERE run_key LIKE 'legal:mk:zro:%' ORDER BY id DESC LIMIT 1;"

      - name: Staging-only result
        run: |
          echo "ZRO HISTORICAL SNAPSHOT IMPORT: STAGING ONLY PASS"
          echo "298 article records expected."
          echo "All records remain historical / Human Gate pending."
          echo "Production D1 was not targeted."
