name: Zoran bot quality baseline UAT

on:
  push:
    branches: ["test/zoran-bot-quality-baseline"]
    paths:
      - ".github/workflows/zoran-bot-quality-baseline.yml"

permissions:
  contents: read

concurrency:
  group: zoran-bot-quality-baseline
  cancel-in-progress: false

jobs:
  live-baseline:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Provision ephemeral professional test membership
        shell: bash
        run: |
          set -euo pipefail
          UAT_ACCOUNT_ID="zoran-quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          UAT_ENTITLEMENT_ID="zoran-quality-ent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          UAT_KEY_ID="zoran-quality-key-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          UAT_KEY="uat_$(openssl rand -hex 24)"
          UAT_KEY_HASH="$(printf '%s' "$UAT_KEY" | sha256sum | awk '{print $1}')"
          UAT_KEY_PREFIX="${UAT_KEY:0:12}"
          echo "::add-mask::$UAT_KEY"
          echo "UAT_ACCOUNT_ID=$UAT_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "AI_ADVOCAT_UAT_KEY=$UAT_KEY" >> "$GITHUB_ENV"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
            INSERT INTO membership_accounts(id,display_name,status)
            VALUES ('$UAT_ACCOUNT_ID','Zoran Bot Quality Baseline','active');
            INSERT INTO membership_entitlements
              (id,account_id,plan_code,status,billing_cycle,monthly_quota,seat_limit,price_mkd,expires_at)
            VALUES
              ('$UAT_ENTITLEMENT_ID','$UAT_ACCOUNT_ID','office','active','manual',2,1,0,datetime('now','+1 hour'));
            INSERT INTO membership_access_keys
              (id,account_id,key_hash,key_prefix,label,status,expires_at)
            VALUES
              ('$UAT_KEY_ID','$UAT_ACCOUNT_ID','$UAT_KEY_HASH','$UAT_KEY_PREFIX','ephemeral bot quality baseline','active',datetime('now','+1 hour'));
          "

      - name: Ask the exact reported question once
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          cat > /tmp/question.json <<'JSON'
          {"q":"Направи ми тужба за враќање на работник на работа.","mode":"auto","history":[],"guideIds":[],"guideDocuments":[],"attachments":[]}
          JSON
          code="$(curl --silent --show-error --output /tmp/zoran-quality-response.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $AI_ADVOCAT_UAT_KEY" \
            -H 'content-type: application/json' \
            --data-binary @/tmp/question.json \
            "$BASE/api/bot")"
          echo "HTTP_STATUS=$code"
          test "$code" = "200"
          node <<'NODE' | tee /tmp/zoran-quality-summary.txt
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/zoran-quality-response.json','utf8'));
          const summary={
            ok:d.ok,
            model:d.model,
            provider:d.provider,
            sourceMode:d.sourceMode,
            webSearchUsed:d.webSearchUsed,
            reasoningEffort:d.reasoningEffort,
            maxOutputTokens:d.maxOutputTokens,
            corpusContextCount:d.corpusContextCount,
            articleCorpusContextCount:d.articleCorpusContextCount,
            articleCorpusState:d.articleCorpusState,
            caseLawState:d.caseLawState,
            missionProfile:d.legalGovernance?.missionProfile||null,
            postflightVerdict:d.legalGovernance?.postflightVerdict||null,
            verificationState:d.legalGovernance?.verificationState||null,
            sourceVerificationState:d.legalGovernance?.sourceVerificationState||null,
            temporalVerificationState:d.legalGovernance?.temporalVerificationState||null,
            releaseState:d.legalGovernance?.releaseState||null,
            providerCalls:d.performance?.providerCalls||null,
            answerLength:String(d.answer||'').length
          };
          console.log(JSON.stringify(summary,null,2));
          console.log('\n--- ANSWER ---\n');
          console.log(String(d.answer||''));
          NODE

      - name: Cleanup ephemeral membership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${UAT_ACCOUNT_ID:-}" ]; then
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
              DELETE FROM membership_usage_monthly WHERE subject_key='account:$UAT_ACCOUNT_ID';
              DELETE FROM security_rate_limit_windows WHERE subject_key='account:$UAT_ACCOUNT_ID';
              DELETE FROM membership_access_keys WHERE account_id='$UAT_ACCOUNT_ID';
              DELETE FROM membership_entitlements WHERE account_id='$UAT_ACCOUNT_ID';
              DELETE FROM membership_accounts WHERE id='$UAT_ACCOUNT_ID';
            "
          fi

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoran-bot-quality-baseline
          retention-days: 7
          path: |
            /tmp/zoran-quality-response.json
            /tmp/zoran-quality-summary.txt