name: Paragraf production preflight

on:
  push:
    branches:
      - paragraf-production-preflight-29sep2026
    paths:
      - ".github/workflows/paragraf-production-preflight.yml"

permissions:
  contents: read

concurrency:
  group: paragraf-production-preflight
  cancel-in-progress: false

jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fail closed if Cloudflare secrets are missing
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify exact production target
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(!d || d.binding!=="DB" || d.database_name!=="ai-advokat-db" || d.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") {
            throw new Error("Unexpected production D1 target");
          }
          NODE

      - name: Read-only production schema snapshot
        shell: bash
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name, type FROM sqlite_schema WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT version, applied_at, description FROM schema_migrations ORDER BY CAST(version AS INTEGER);"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS source_count FROM sources;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS publication_count FROM publications;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT title, venue, publication_status, doi, canonical_url, human_review_status FROM publications WHERE author_name='Zoran Stojankich' ORDER BY id;"

      - name: List pending migrations only
        shell: bash
        run: |
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc
          echo "READ-ONLY PREFLIGHT: PASS"
          echo "No migrations were applied."
          echo "No Worker deployment, bot activation, redirect, or data import occurred."
