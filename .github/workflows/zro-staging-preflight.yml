name: ZRO staging preflight

on:
  workflow_dispatch:
  push:
    branches:
      - slvesnik-public-corpus-collector-29sep2026
    paths:
      - ".github/workflows/zro-staging-preflight.yml"
      - "migrations/0010_macedonian_legal_source_registry.sql"
      - "migrations/0011_article_level_legal_corpus.sql"
      - "migrations/0012_case_law_authority.sql"
      - "migrations/0013_judicial_and_official_source_graph.sql"
      - "migrations/0014_stable_instrument_keys.sql"
      - "migrations/0015_amendment_event_provenance.sql"
      - "migrations/0016_article_version_candidates.sql"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify staging target
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.preview-migrations.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(!d || d.binding!=="PREVIEW_DB" || d.database_name!=="ai-advokat-db-staging" || d.database_id!=="eb560e98-9fc0-408e-9c81-9b823ffde44d") {
            throw new Error("Unexpected staging target");
          }
          console.log("Staging target verified:", d.database_name, d.database_id);
          NODE

      - name: List pending staging migrations
        run: npx wrangler d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc | tee pending.txt

      - name: Read current schema versions
        run: npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT version, description FROM schema_migrations ORDER BY CAST(version AS INTEGER);" | tee schema-versions.txt

      - name: Read corpus table state
        run: npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('legal_instruments','legal_article_versions','legal_article_version_candidates');" | tee corpus-tables.txt

      - name: Read ZRO seed state
        shell: bash
        run: |
          if grep -q "legal_instruments" corpus-tables.txt; then
            npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT id,title,current_status,human_review_status FROM legal_instruments WHERE title='Закон за работните односи';" | tee zro-state.txt
          else
            echo "legal_instruments table not yet available" | tee zro-state.txt
          fi

      - name: Assert production target is absent
        run: |
          ! grep -R "12ece285-74bb-4f27-a025-2dbd1be6c59a" pending.txt schema-versions.txt corpus-tables.txt zro-state.txt
          echo "Production D1 id absent from command outputs: PASS"

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: zro-staging-preflight
          retention-days: 14
          path: |
            pending.txt
            schema-versions.txt
            corpus-tables.txt
            zro-state.txt
