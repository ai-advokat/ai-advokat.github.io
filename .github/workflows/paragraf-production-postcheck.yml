name: Paragraf production post-failure check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only:
    environment: production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT version, description FROM schema_migrations ORDER BY CAST(version AS INTEGER);"
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS legacy_docs FROM legacy_documents;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS published_count FROM publications WHERE author_name='Zoran Stojankich' AND publication_status='published';"
