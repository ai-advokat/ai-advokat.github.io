name: AI Advokat Worker runtime live smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/worker-runtime-live-smoke.yml"
      - "bot/index.html"
      - "hybrid-legal-intelligence.html"
      - "public-legal-data-services.html"
      - "src/index.js"
      - "assets/standalone-bot.js"
      - "assets/standalone-bot-vnext.js"
      - "assets/standalone-bot-vnext.css"
      - "assets/standalone-bot-toolkit.js"
      - "assets/standalone-bot-toolkit.css"
      - "assets/chat-privacy-browser.js"
      - "src/chat-privacy.js"
      - ".assetsignore"
      - "_headers"
      - ".github/workflows/sync-pages-runtime.yml"

permissions:
  contents: read

concurrency:
  group: ai-advokat-worker-runtime-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify Worker serves exact R14 standalone frontend bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"

          expected_bot="$(sha256sum bot/index.html | awk '{print $1}')"
          expected_hybrid="$(sha256sum hybrid-legal-intelligence.html | awk '{print $1}')"
          expected_public_legal="$(sha256sum public-legal-data-services.html | awk '{print $1}')"
          expected_core="$(sha256sum assets/standalone-bot.js | awk '{print $1}')"
          expected_voice="$(sha256sum assets/ai-advokat-voice.mjs | awk '{print $1}')"
          expected_vnext="$(sha256sum assets/standalone-bot-vnext.js | awk '{print $1}')"
          expected_vnext_css="$(sha256sum assets/standalone-bot-vnext.css | awk '{print $1}')"
          expected_toolkit="$(sha256sum assets/standalone-bot-toolkit.js | awk '{print $1}')"
          expected_toolkit_css="$(sha256sum assets/standalone-bot-toolkit.css | awk '{print $1}')"
          expected_privacy_primary="$(sha256sum assets/chat-privacy-browser.js | awk '{print $1}')"
          expected_privacy_compat="$(sha256sum src/chat-privacy.js | awk '{print $1}')"

          deployed=0
          for attempt in $(seq 1 80); do
            nonce="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/bot/?release=core-r15&smoke=$nonce" -o /tmp/worker-bot.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/hybrid-legal-intelligence.html?smoke=$nonce" -o /tmp/worker-hybrid.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/public-legal-data-services.html?smoke=$nonce" -o /tmp/worker-public-legal.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/standalone-bot.js?v=20261106-core-r15-voice-r2&smoke=$nonce" -o /tmp/worker-core.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/ai-advokat-voice.mjs?v=20261106-voice-r2&smoke=$nonce" -o /tmp/worker-voice.mjs || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/standalone-bot-vnext.js?v=20261107-hybrid-r2-lawyer-view&smoke=$nonce" -o /tmp/worker-vnext.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/standalone-bot-vnext.css?v=20261106-ui-r6-toolkit-parity&smoke=$nonce" -o /tmp/worker-vnext.css || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/standalone-bot-toolkit.js?v=20261106-toolkit-r14&smoke=$nonce" -o /tmp/worker-toolkit.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/standalone-bot-toolkit.css?v=20261106-toolkit-r14&smoke=$nonce" -o /tmp/worker-toolkit.css || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/chat-privacy-browser.js?v=20261101-privacy-r12&smoke=$nonce" -o /tmp/worker-privacy-primary.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/src/chat-privacy.js?v=20261101-privacy-compat-r1&smoke=$nonce" -o /tmp/worker-privacy-compat.js || true

            live_bot="$(sha256sum /tmp/worker-bot.html 2>/dev/null | awk '{print $1}' || true)"
            live_hybrid="$(sha256sum /tmp/worker-hybrid.html 2>/dev/null | awk '{print $1}' || true)"
            live_public_legal="$(sha256sum /tmp/worker-public-legal.html 2>/dev/null | awk '{print $1}' || true)"
            live_core="$(sha256sum /tmp/worker-core.js 2>/dev/null | awk '{print $1}' || true)"
            live_voice="$(sha256sum /tmp/worker-voice.mjs 2>/dev/null | awk '{print $1}' || true)"
            live_vnext="$(sha256sum /tmp/worker-vnext.js 2>/dev/null | awk '{print $1}' || true)"
            live_vnext_css="$(sha256sum /tmp/worker-vnext.css 2>/dev/null | awk '{print $1}' || true)"
            live_toolkit="$(sha256sum /tmp/worker-toolkit.js 2>/dev/null | awk '{print $1}' || true)"
            live_toolkit_css="$(sha256sum /tmp/worker-toolkit.css 2>/dev/null | awk '{print $1}' || true)"
            live_privacy_primary="$(sha256sum /tmp/worker-privacy-primary.js 2>/dev/null | awk '{print $1}' || true)"
            live_privacy_compat="$(sha256sum /tmp/worker-privacy-compat.js 2>/dev/null | awk '{print $1}' || true)"

            if [ "$live_bot" = "$expected_bot" ] \
              && [ "$live_hybrid" = "$expected_hybrid" ] \
              && [ "$live_public_legal" = "$expected_public_legal" ] \
              && [ "$live_core" = "$expected_core" ] \
              && [ "$live_voice" = "$expected_voice" ] \
              && [ "$live_vnext" = "$expected_vnext" ] \
              && [ "$live_vnext_css" = "$expected_vnext_css" ] \
              && [ "$live_toolkit" = "$expected_toolkit" ] \
              && [ "$live_toolkit_css" = "$expected_toolkit_css" ] \
              && [ "$live_privacy_primary" = "$expected_privacy_primary" ] \
              && [ "$live_privacy_compat" = "$expected_privacy_compat" ]; then
              deployed=1
              echo "WORKER R14 BYTE PARITY: PASS on attempt $attempt"
              break
            fi
            echo "Worker deployment not yet at expected commit (attempt $attempt/80)."
            sleep 3
          done
          test "$deployed" = "1"

          grep -q 'name="ai-advokat-release" content="core-r15"' /tmp/worker-bot.html
          grep -q 'Hybrid Legal Intelligence R2' /tmp/worker-hybrid.html
          grep -q 'Lawyer View' /tmp/worker-hybrid.html
          grep -q 'Open Data Legal Evidence' /tmp/worker-hybrid.html
          grep -q 'Official e‑Service Navigator' /tmp/worker-hybrid.html
          grep -q 'eID + Human Handoff' /tmp/worker-hybrid.html
          grep -q 'Public Legal Data & e‑Services' /tmp/worker-public-legal.html
          grep -q 'standalone-bot.js?v=20261106-core-r15-voice-r2' /tmp/worker-bot.html
          grep -q 'AI_ADVOCAT_VOICE_R2' /tmp/worker-voice.mjs
          grep -q 'getUserMedia' /tmp/worker-voice.mjs
          grep -q 'microphonePermissionErrorMessage' /tmp/worker-voice.mjs
          grep -q 'standalone-bot-vnext.js?v=20261107-hybrid-r2-lawyer-view' /tmp/worker-bot.html
          grep -q 'standalone-bot-vnext.css?v=20261106-ui-r6-toolkit-parity' /tmp/worker-bot.html
          grep -q 'standalone-bot-toolkit.js?v=20261106-toolkit-r14' /tmp/worker-bot.html
          grep -q 'standalone-bot-toolkit.css?v=20261106-toolkit-r14' /tmp/worker-bot.html
          grep -q 'AI_ADVOCAT_STANDALONE_TOOLKIT_PARITY_R14' /tmp/worker-toolkit.js
          grep -q "import('./chat-privacy-browser.js?v=20261101-privacy-r12')" /tmp/worker-core.js
          grep -q "import('/src/chat-privacy.js?v=20261101-privacy-compat-r1')" /tmp/worker-core.js
          grep -q 'detectConfidentialCasePrompt' /tmp/worker-privacy-primary.js
          grep -q 'redactConfidentialCasePrompt' /tmp/worker-privacy-primary.js
          grep -q 'detectConfidentialCasePrompt' /tmp/worker-privacy-compat.js
          grep -q 'redactConfidentialCasePrompt' /tmp/worker-privacy-compat.js

          legacy_code="$(curl -sS --max-time 30 -o /dev/null -D /tmp/worker-legacy-release-headers.txt -w '%{http_code}' "$BASE/bot/?release=core-r10")"
          test "$legacy_code" = "302"
          grep -qi '^location: .*release=core-r15' /tmp/worker-legacy-release-headers.txt
          grep -qi '^clear-site-data: "cache"' /tmp/worker-legacy-release-headers.txt
          grep -qi '^x-ai-advokat-release: core-r15' /tmp/worker-legacy-release-headers.txt
          echo "LEGACY CORE-R10 SELF-HEAL REDIRECT: PASS"

          legacy_r12_code="$(curl -sS --max-time 30 -o /dev/null -D /tmp/worker-legacy-r12-release-headers.txt -w '%{http_code}' "$BASE/bot/?release=core-r12")"
          test "$legacy_r12_code" = "302"
          grep -qi '^location: .*release=core-r15' /tmp/worker-legacy-r12-release-headers.txt
          grep -qi '^clear-site-data: "cache"' /tmp/worker-legacy-r12-release-headers.txt
          grep -qi '^x-ai-advokat-release: core-r15' /tmp/worker-legacy-r12-release-headers.txt
          echo "LEGACY CORE-R12 SELF-HEAL REDIRECT: PASS"

      - name: Verify production health and orchestrator
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/api/health" -o /tmp/worker-health.json
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/api/orchestrator" -o /tmp/worker-orchestrator.json
          node <<'NODE'
          const h=require("/tmp/worker-health.json");
          const o=require("/tmp/worker-orchestrator.json");
          if(!h.ok || h.database?.reachable!==true || h.database?.schemaReady!==true) throw new Error("health/database not ready");
          if(!o.ok || o.runtime?.providerExecution!=="configured_for_api_chat_execution") throw new Error("provider not ready");
          if(o.runtime?.lioeRuntimeGovernance!=="enabled" || o.runtime?.lioePostflight!=="enabled" || o.runtime?.lioeSpecialistExecution!=="enabled") throw new Error("LIOE not ready");
          console.log("WORKER HEALTH + ORCHESTRATOR: PASS");
          NODE

      - name: Verify Hybrid Legal Intelligence R2 live APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/api/hybrid/capabilities" -o /tmp/worker-hybrid-capabilities.json
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/api/hybrid/instruments" -o /tmp/worker-hybrid-instruments.json
          node <<'NODE'
          const c=require("/tmp/worker-hybrid-capabilities.json");
          const i=require("/tmp/worker-hybrid-instruments.json");
          const expected=["article_time_machine","law_bylaw_graph","article_case_law_graph","legal_effective_date_calendar","visual_consolidation_diff","open_data_legal_evidence","official_e_service_navigator","eid_human_handoff"];
          if(!c.ok) throw new Error("hybrid capabilities not ok");
          for(const x of expected) if(!c.capabilities?.includes(x)) throw new Error("missing hybrid capability "+x);
          if(c.authorityBoundary?.autonomousCurrentLawPromotion!==false) throw new Error("hybrid authority boundary weakened");
          if(!i.ok || !Array.isArray(i.instruments)) throw new Error("hybrid instrument catalogue unavailable");
          console.log("HYBRID R2 WORKBENCH + DISCOVERY APIS: PASS");
          NODE

      - name: Verify Public Legal Data and e-Services live APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/api/public-legal/capabilities" -o /tmp/worker-public-legal-capabilities.json
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/api/public-legal/services" -o /tmp/worker-public-legal-services.json
          open_code="$(curl -sS --retry 3 --retry-delay 2 --max-time 30 -o /tmp/worker-public-legal-open-data.json -w '%{http_code}' "$BASE/api/public-legal/open-data?q=регистар&limit=1")"
          node - "$open_code" <<'NODE'
          const fs=require("fs");
          const status=Number(process.argv[2]||0);
          const c=require("/tmp/worker-public-legal-capabilities.json");
          const s=require("/tmp/worker-public-legal-services.json");
          if(!c.ok) throw new Error("public legal capabilities not ok");
          for(const x of ["open_data_legal_finder","dataset_evidence_card","legal_dataset_lens","e_service_legal_navigator","eid_readiness_human_handoff"]){
            if(!c.capabilities?.includes(x)) throw new Error("missing public legal capability "+x);
          }
          if(c.authorityBoundary?.openDataIsNotAutomaticLegalAuthority!==true) throw new Error("open-data authority boundary weakened");
          if(c.authorityBoundary?.autonomousApplicationSubmission!==false) throw new Error("autonomous submission boundary weakened");
          if(!s.ok || !Array.isArray(s.services)) throw new Error("official e-service registry unavailable");
          const raw=fs.readFileSync("/tmp/worker-public-legal-open-data.json","utf8");
          let o={}; try{o=JSON.parse(raw);}catch{throw new Error("open-data endpoint returned invalid json");}
          if(status===200){
            if(!o.ok || o.source!=="data.gov.mk" || !Array.isArray(o.results)) throw new Error("open-data endpoint malformed success");
          }else if(status===502){
            if(o.error!=="official_open_data_unavailable") throw new Error("open-data endpoint did not fail closed");
          }else{
            throw new Error("unexpected open-data endpoint http "+status);
          }
          console.log("PUBLIC LEGAL DATA + E-SERVICES: PASS");
          NODE

      - name: Verify browser CORS and main AI Advokat live chat
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl -sS --fail -D /tmp/worker-cors.txt -o /dev/null             -X OPTIONS             -H 'Origin: https://ai-advokat.github.io'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: content-type'             "$BASE/api/chat"
          grep -qi '^access-control-allow-origin: https://ai-advokat.github.io' /tmp/worker-cors.txt
          chat_code="$(curl -sS --max-time 120 -o /tmp/worker-chat.json -w '%{http_code}'             -H 'content-type: application/json'             -H 'Origin: https://ai-advokat.github.io'             -d '{"q":"Одговори кратко и вклучи ја ознаката WORKER_SMOKE_OK.","mode":"auto","webSearch":false,"history":[],"guideIds":[],"guideDocuments":[],"attachments":[]}'             "$BASE/api/chat")"
          echo "MAIN CHAT HTTP: $chat_code"
          node - "$chat_code" <<'NODE'
          const fs=require("fs");
          const status=Number(process.argv[2]||0);
          const raw=fs.readFileSync("/tmp/worker-chat.json","utf8");
          let d={};try{d=JSON.parse(raw);}catch{throw new Error("chat invalid json http "+status+": "+raw.slice(0,500));}
          if(status!==200){
            const capacity=d?.providerCapacity?.state==="exhausted"
              || d?.error==="workers_ai_daily_capacity_exhausted"
              || d?.providerRecovery?.direction==="workers_ai_to_openai";
            console.error("MAIN CHAT NON-200",JSON.stringify({
              status,error:d?.error||null,providerCapacity:d?.providerCapacity||null,
              providerRecovery:d?.providerRecovery||null,fallbackProviderFailure:d?.fallbackProviderFailure||null
            }));
            if(capacity) throw new Error("chat provider capacity blocked");
            throw new Error("chat http "+status+":"+(d?.error||"unknown"));
          }
          if(!d.ok) throw new Error("chat not ok");
          if(!String(d.answer||"").trim()) throw new Error("empty chat answer");
          if(!String(d.answer||"").includes("WORKER_SMOKE_OK")) throw new Error("marker missing");
          console.log("MAIN AI ADVOKAT LIVE CHAT: PASS");
          NODE

      - name: Verify Professional bot route is live and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          code="$(curl -sS --max-time 30 -o /tmp/worker-bot-unauth.json -w '%{http_code}'             -H 'content-type: application/json'             -H 'Origin: https://ai-advokat.github.io'             -d '{"q":"Здраво"}'             "$BASE/api/bot")"
          test "$code" = "401"
          grep -q 'bot_membership_required' /tmp/worker-bot-unauth.json
          echo "PROFESSIONAL /api/bot LIVE + FAIL-CLOSED: PASS"

      - name: Upload non-secret Worker smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-advokat-worker-runtime-live-smoke
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/worker-home.html
            /tmp/worker-bot.html
            /tmp/worker-hybrid.html
            /tmp/worker-legacy-release-headers.txt
            /tmp/worker-core.js
            /tmp/worker-voice.mjs
            /tmp/worker-vnext.js
            /tmp/worker-vnext.css
            /tmp/worker-toolkit.js
            /tmp/worker-toolkit.css
            /tmp/worker-privacy-primary.js
            /tmp/worker-privacy-compat.js
            /tmp/worker-health.json
            /tmp/worker-orchestrator.json
            /tmp/worker-hybrid-capabilities.json
            /tmp/worker-hybrid-instruments.json
            /tmp/worker-cors.txt
            /tmp/worker-chat.json
            /tmp/worker-bot-unauth.json
