name: AI Advokat weighted-credit telemetry migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_LIOE_CREDIT_0029"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-advokat-lioe-credit-migration
  cancel-in-progress: false

jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify explicit human authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_LIOE_CREDIT_0029"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Inspect pending migration
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/pending.txt
          if ! grep -q '0029_lioe_weighted_credit_telemetry.sql' /tmp/pending.txt; then
            echo "0029 is not pending; verifying schema instead."
          fi
      - name: Apply migration 0029 when pending
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '0029_lioe_weighted_credit_telemetry.sql' /tmp/pending.txt; then
            npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
          fi
      - name: Verify weighted-credit schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT version,description FROM schema_migrations WHERE version='29'; PRAGMA table_info(lioe_runtime_runs);"             | tee /tmp/schema.txt
          grep -q '"version": "29"' /tmp/schema.txt
          grep -q '"name": "estimated_credit_units"' /tmp/schema.txt
          echo "LIOE WEIGHTED CREDIT TELEMETRY: PASS"
      - name: Upload non-secret migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: lioe-weighted-credit-0029
          retention-days: 30
          path: |
            /tmp/pending.txt
            /tmp/schema.txt
