name: AI Advokat LIOE governance

on:
  pull_request:
    paths:
      - "src/agent-orchestrator.js"
      - "src/legal-intelligence-engine.js"
      - "test/agent-orchestrator.test.mjs"
      - "test/legal-intelligence-engine.test.mjs"
      - "data/legal-operating-protocol-v1.json"
      - "data/legal-intelligence-engine-v1.json"
      - "data/legal-intelligence-excellence-v1.json"
      - "data/legal-intelligence-evaluation-suite.json"
      - "data/legal-intelligence-metrics-baseline.json"
      - "data/legal-runs/**"
      - "data/human-gate-decision-ledger.json"
      - "scripts/evaluate-legal-intelligence-engine.mjs"
      - "scripts/validate-legal-run-records.mjs"
      - "architecture/AI_ADVOKAT_LEGAL_OPERATING_PROTOCOL.md"
      - "architecture/AI_ADVOKAT_LEGAL_INTELLIGENCE_ENGINE.md"
      - "docs/standards/AI_ADVOKAT_LEGAL_RUN_RECORD_PROTOCOL_v1.md"
      - ".github/workflows/legal-intelligence-governance.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "src/legal-intelligence-engine.js"
      - "data/legal-intelligence-engine-v1.json"
      - "data/legal-runs/**"
      - "data/legal-intelligence-metrics-baseline.json"
      - "scripts/evaluate-legal-intelligence-engine.mjs"
      - "scripts/validate-legal-run-records.mjs"
      - ".github/workflows/legal-intelligence-governance.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check src/legal-intelligence-engine.js
          node --check src/agent-orchestrator.js
          node --check scripts/evaluate-legal-intelligence-engine.mjs
          node --check scripts/validate-legal-run-records.mjs
      - name: JSON governance
        run: |
          node -e "const fs=require('fs');for(const f of ['data/legal-operating-protocol-v1.json','data/legal-intelligence-engine-v1.json','data/legal-intelligence-excellence-v1.json','data/legal-intelligence-evaluation-suite.json','data/legal-intelligence-metrics-baseline.json','data/legal-runs/legal-run-record.schema.json','data/legal-runs/index.json','data/human-gate-decision-ledger.json'])JSON.parse(fs.readFileSync(f,'utf8'));"
      - name: LIOE unit tests
        run: npm run test:legal-intelligence-engine
      - name: Chief orchestrator integration
        run: npm run test:agent-orchestrator
      - name: Canonical legal evaluation
        run: npm run eval:legal-intelligence-engine
      - name: Real Legal Run Records
        run: npm run validate:legal-runs
      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
