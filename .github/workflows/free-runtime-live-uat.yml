name: FREE runtime live UAT

on:
  pull_request:
    paths:
      - ".github/workflows/free-runtime-live-uat.yml"
      - "src/index.js"
      - "src/ai-advokat-central-prompt.js"
      - "src/macedonian-language-guard.js"
      - "src/response-quality.js"
      - "src/workers-ai-provider.js"
      - "wrangler.jsonc"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/free-runtime-live-uat.yml"
      - "src/index.js"
      - "src/ai-advokat-central-prompt.js"
      - "src/macedonian-language-guard.js"
      - "src/response-quality.js"
      - "src/workers-ai-provider.js"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: free-runtime-live-uat
  cancel-in-progress: true

jobs:
  live-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build synthetic DOCX fixture
        shell: bash
        run: |
          python3 <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/ai-advokat-live-uat.docx','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('[Content_Types].xml','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>''')
              z.writestr('_rels/.rels','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>''')
              z.writestr('word/_rels/document.xml.rels','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>''')
              z.writestr('word/styles.xml','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>''')
              z.writestr('word/document.xml','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>KORENSKIUAT2026</w:t></w:r></w:p><w:sectPr/></w:body></w:document>''')
          PY

      - name: Verify central prompt, Macedonian language and final-response contracts locally
        run: node --no-warnings --test test/ai-advokat-central-prompt.test.mjs test/macedonian-language-guard.test.mjs test/response-quality.test.mjs

      - name: Live Macedonian FREE chat and DOCX UAT
        if: github.event_name == 'push'
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
          const fs=require("fs");
          const BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev";
          const EXPECTED_FREE_MODEL="@cf/qwen/qwen3-30b-a3b-fp8";
          const EXPECTED_PAID_MODEL="gpt-6.1-sol";
          const EXPECTED_PROMPT="AI_ADVOCAT_CENTRAL_OPERATING_PROMPT_v7";
          const EXPECTED_LANGUAGE="MK_ORTHOGRAPHY_2017_RUNTIME_V6";
          const EXPECTED_QUALITY="formal_draft_export_cleanup_and_ungrounded_article_filter_v1";
          const EXPECTED_FREE_POLICY="FREE_MK_FAST_RELEASE_V2";

          async function waitForExpectedRuntime(){
            let last=null;
            for(let attempt=1;attempt<=60;attempt++){
              try{
                const response=await fetch(BASE+"/api/capabilities",{headers:{"accept":"application/json","cache-control":"no-cache"}});
                const raw=await response.text();
                const data=JSON.parse(raw);
                last=data;
                const caps=data?.capabilities||{};
                if(response.ok
                  && data?.ok===true
                  && caps.centralOperatingPrompt===EXPECTED_PROMPT
                  && caps.macedonianLanguageGuard===EXPECTED_LANGUAGE
                  && caps.finalResponseQualityGate===EXPECTED_QUALITY
                  && caps.freeChatModel===EXPECTED_FREE_MODEL
                  && caps.freeRuntimePolicy===EXPECTED_FREE_POLICY){
                  console.log("runtime contract: PASS · "+caps.centralOperatingPrompt+" · "+caps.macedonianLanguageGuard+" · "+caps.finalResponseQualityGate+" · "+caps.freeChatModel+" · "+caps.freeRuntimePolicy);
                  return;
                }
              }catch(error){
                last={error:String(error?.message||error)};
              }
              await new Promise(resolve=>setTimeout(resolve,3000));
            }
            throw new Error("expected runtime contract was not deployed before UAT: "+JSON.stringify(last).slice(0,1800));
          }

          await waitForExpectedRuntime();

          async function chat(payload,label){
            const response=await fetch(BASE+"/api/chat",{
              method:"POST",
              headers:{"content-type":"application/json","accept":"application/json"},
              body:JSON.stringify({
                mode:"auto",
                webSearch:false,
                history:[],
                guideIds:[],
                attachments:[],
                ...payload
              })
            });
            const raw=await response.text();
            let data=null;
            try{data=JSON.parse(raw);}catch{}
            if(!response.ok || !data?.ok){
              throw new Error(label+" HTTP "+response.status+" "+raw.slice(0,1500));
            }
            if(data.provider==="openai"){
              if(data.model!==EXPECTED_PAID_MODEL){
                throw new Error(label+" unexpected OpenAI model "+String(data.model));
              }
              if(data.providerFallback!==null && data.providerFallback!==undefined){
                throw new Error(label+" OpenAI primary response must not claim fallback "+JSON.stringify(data.providerFallback));
              }
            }else if(data.provider==="workers_ai_free"){
              if(data.model!==EXPECTED_FREE_MODEL){
                throw new Error(label+" unexpected Workers AI model "+String(data.model));
              }
              if(data.providerFallback && data.providerFallback.from!=="openai"){
                throw new Error(label+" invalid fallback provenance "+JSON.stringify(data.providerFallback));
              }
            }else{
              throw new Error(label+" unexpected provider "+String(data.provider));
            }
            const answer=String(data.answer||"").trim();
            if(answer.length<12){
              throw new Error(label+" empty/too-short final answer "+JSON.stringify(data));
            }
            if(data.provider==="workers_ai_free" && data.webSearchUsed!==false){
              throw new Error(label+" Workers AI incorrectly claimed web search");
            }
            if(data.provider==="openai" && data.webSearchUsed===true){
              if(!Array.isArray(data.sources) || data.sources.length===0){
                throw new Error(label+" OpenAI claimed web search without source provenance");
              }
              if(!data.sourcePolicy || typeof data.sourcePolicy!=="object"){
                throw new Error(label+" OpenAI web research omitted source policy metadata");
              }
            }
            if(data.provider==="workers_ai_free"){
              const calls=Number(data?.performance?.providerCalls||0);
              if(calls<1 || calls>2){
                throw new Error(label+" FREE provider call budget violated: "+JSON.stringify(data.performance));
              }
              const latency=Number(data?.performance?.serverLatencyMs||0);
              if(!Number.isFinite(latency) || latency<=0){
                throw new Error(label+" FREE server latency telemetry missing: "+JSON.stringify(data.performance));
              }
              const scenarioBudget={basic:15000,"employment-definition":15000,reminder:25000,draft:30000,"valid-mk-legal":15000,"wrong-language-correction":20000}[label]||45000;
              if(latency>scenarioBudget){
                throw new Error(label+" FREE server latency budget exceeded: "+latency+"ms > "+scenarioBudget+"ms");
              }
              console.log(label+" performance: "+latency+"ms · providerCalls="+calls+" · repairCalls="+Number(data?.performance?.languageRepairProviderCalls||0)+" · fastPrompt="+String(data?.performance?.fastPromptUsed===true));
            }
            return {answer,data};
          }

          const searchResponse=await fetch(BASE+"/api/search?q="+encodeURIComponent("притвор")+"&type=all&status=all&limit=20",{
            headers:{"accept":"application/json"}
          });
          const searchRaw=await searchResponse.text();
          let searchData=null;
          try{searchData=JSON.parse(searchRaw);}catch{}
          if(!searchResponse.ok || !searchData?.ok || !Array.isArray(searchData.results)){
            throw new Error("search detention HTTP "+searchResponse.status+" "+searchRaw.slice(0,1500));
          }
          const detention=searchData.results.find(item=>
            item?.entityType==="guide"
            && /притвор/i.test(String(item?.title||"")+" "+String(item?.snippet||""))
          );
          if(!detention){
            throw new Error("audit search regression: 'притвор' returned no relevant guide: "+JSON.stringify(searchData.results.slice(0,8)));
          }
          console.log("search притвор: PASS · "+String(detention.title||"").slice(0,140));

          const scenarios=[
            ["basic","Одговори на македонски со една кратка реченица дека AI Advokat работи."],
            ["employment-definition","Што е договор за вработување?"],
            ["reminder","Направи ми потсетник за лице што треба да оди во притов."],
            ["draft","Изработи тужба за надомест на штета, со измислени податоци."],
            ["valid-mk-legal","Судот е должен да ги земе предвид сите релевантни информации, а странката е должна да ги достави доказите."]
          ];

          for(const [name,q] of scenarios){
            const {answer,data}=await chat({q},name);
            if(!/[\u0400-\u04FF]/u.test(answer)){
              throw new Error(name+" final answer is not Macedonian/Cyrillic: "+answer.slice(0,500));
            }
            if(/[ЂђЋћЪъЫыЭэЁёЮюЯяЙйЬьЩщ]/u.test(answer)){
              throw new Error(name+" contains non-Macedonian Cyrillic letters: "+answer.slice(0,500));
            }
            const foreignTokens=["поступак","поступакот","подносилац","тужилац","захтев","решење","подаци","документы","сведения","следует","является","становище","всего","наименование","помеѓуз","обврзки","непостојно","саответен","правопризнателството","точнаја","године","власни","банок","биоки","свраним","ево"];
            const lower=answer.toLocaleLowerCase("mk");
            if(foreignTokens.some(token=>new RegExp("(^|[^\\p{L}])"+token+"(?=$|[^\\p{L}])","u").test(lower))){
              throw new Error(name+" contains Serbian/Bulgarian/Russian lexical contamination: "+answer.slice(0,500));
            }
            if(/^\s*(need answer|user wants|the user|we need|provide|must answer)\b/i.test(answer)){
              throw new Error(name+" leaked internal planning text: "+answer.slice(0,500));
            }
            if(name==="employment-definition"){
              if(data.provider==="workers_ai_free" && data?.performance?.fastPromptUsed!==true){
                throw new Error("employment-definition did not use compact FREE L0 prompt: "+JSON.stringify(data.performance));
              }
              if(/[|]/u.test(answer) || answer.split("\n").length>14){
                throw new Error("employment-definition should stay concise and avoid pseudo-tables: "+answer.slice(0,1200));
              }
              if(!/договор/iu.test(answer) || !/работн/iu.test(answer)){
                throw new Error("employment-definition did not answer the requested concept: "+answer.slice(0,1200));
              }
            }
            if(name==="draft"){
              const badLegal=["съд","ищец","ответник","искова","обезщетение","съгласно","обжалване","възражение","разноски","случайни","поступак","тужилац","захтев","решење","трошкови"];
              if(badLegal.some(token=>new RegExp("(^|[^\\p{L}])"+token+"(?=$|[^\\p{L}])","u").test(lower))){
                throw new Error("draft contains neighbouring-language legal contamination: "+answer.slice(0,1200));
              }
              if(/(^|\n)\s*(#{1,6}\s|\*\*|---\s*$|\|[^\n]+\|)/m.test(answer)){
                throw new Error("draft contains raw Markdown decoration unsuitable for direct DOCX/PDF export: "+answer.slice(0,1200));
              }
              if(/\bчлен\s+\d+[а-яА-Я-]*/u.test(answer)){
                throw new Error("draft invented/unverified article numbers despite no governed legal source context: "+answer.slice(0,1200));
              }
              if(!/тужб/iu.test(answer)){
                throw new Error("draft did not produce the requested lawsuit text: "+answer.slice(0,1200));
              }
            }
            console.log(name+": PASS · "+answer.replace(/\s+/g," ").slice(0,120));
          }

          {
            const response=await fetch(BASE+"/api/chat",{
              method:"POST",
              headers:{"content-type":"application/json","accept":"application/json"},
              body:JSON.stringify({
                q:"Анализирај го приложениот измислен документ.",
                mode:"auto",
                webSearch:false,
                history:[],
                guideIds:[],
                attachments:[{
                  kind:"text",
                  name:"synthetic-inheritance.txt",
                  mime:"text/plain",
                  text:"СИНТЕТИЧКИ ТЕСТ. Оставител: Илија Тестовски."
                }]
              })
            });
            const raw=await response.text();
            let data=null;
            try{data=JSON.parse(raw);}catch{}
            if(response.status!==422 || data?.error!=="public_attachment_secure_workspace_required"){
              throw new Error("public-attachment privacy gate regression HTTP "+response.status+" "+raw.slice(0,1800));
            }
            if(data?.privacy?.providerCalled!==false || data?.privacy?.quotaConsumed!==false){
              throw new Error("public-attachment privacy gate consumed provider/quota: "+raw.slice(0,1800));
            }
            console.log("public-attachment-secure-workspace-gate: PASS");
          }

          {
            const {answer}=await chat({
              q:"Претходниот одговор беше на бугарски. Исправи го целосно и одговори само на стандарден македонски јазик.",
              history:[{
                role:"assistant",
                text:"Това е становище. Ищецът подава искова молба и трябва да се провери съдът."
              }]
            },"wrong-language-correction");
            const lower=answer.toLocaleLowerCase("mk");
            const forbidden=["това","становище","ищец","искова","трябва","съдът","съд","обжалване","разноски"];
            if(forbidden.some(token=>lower.includes(token))){
              throw new Error("wrong-language-correction retained Bulgarian contamination: "+answer.slice(0,1200));
            }
            console.log("wrong-language-correction: PASS · "+answer.replace(/\s+/g," ").slice(0,160));
          }

          {
            const b64=fs.readFileSync("/tmp/ai-advokat-live-uat.docx").toString("base64");
            const response=await fetch(BASE+"/api/chat",{
              method:"POST",
              headers:{"content-type":"application/json","accept":"application/json"},
              body:JSON.stringify({
                q:"Прочитај го DOCX прилогот.",
                mode:"auto",
                webSearch:false,
                history:[],
                guideIds:[],
                attachments:[{
                  kind:"file",
                  name:"ai-advokat-live-uat.docx",
                  mime:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                  base64:b64
                }]
              })
            });
            const raw=await response.text();
            const data=JSON.parse(raw);
            if(response.status!==422 || data?.error!=="public_attachment_secure_workspace_required"){
              throw new Error("DOCX public privacy gate regression HTTP "+response.status+" "+raw.slice(0,1500));
            }
            if(data?.privacy?.providerCalled!==false || data?.privacy?.quotaConsumed!==false){
              throw new Error("DOCX privacy gate consumed provider/quota");
            }
            console.log("docx-secure-workspace-gate: PASS");
          }
          console.log("FREE LIVE RUNTIME UAT: PASS");
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
