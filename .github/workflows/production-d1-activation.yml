name: AI Advokat production D1 activation

on:
  push:
    branches:
      - activate-public-search-v1.3.3-clean
    paths:
      - ".github/workflows/production-d1-activation.yml"

permissions:
  contents: read

concurrency:
  group: ai-advokat-production-d1-activation
  cancel-in-progress: false

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fail closed if Cloudflare secrets are missing
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify repository safety invariants
        run: |
          node --check src/index.js
          npm run verify

      - name: Verify exact production target
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const cfg = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const prod = cfg.d1_databases?.[0];
          const preview = cfg.previews?.d1_databases?.[0];
          if (!prod) throw new Error("Missing production D1 config.");
          if (prod.binding !== "DB") throw new Error("Unexpected production binding.");
          if (prod.database_name !== "ai-advokat-db") throw new Error("Unexpected production DB name.");
          if (prod.database_id !== "12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production DB ID.");
          if (preview?.database_id === prod.database_id) throw new Error("Production and staging DB IDs must differ.");
          console.log("Production target guard: PASS");
          NODE

      - name: Pre-migration production snapshot
        shell: bash
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS source_count FROM sources;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS publication_count FROM publications;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT version, applied_at, description FROM schema_migrations ORDER BY applied_at DESC;"

      - name: Confirm only expected migrations are pending
        shell: bash
        run: |
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc > pending.txt
          cat pending.txt
          grep -q "0001_initial_schema.sql" pending.txt
          grep -q "0002_public_source_seed.sql" pending.txt
          if grep -Eo '000[0-9]+_[A-Za-z0-9_.-]+\.sql' pending.txt | grep -vE '^(0001_initial_schema\.sql|0002_public_source_seed\.sql)$' ; then
            echo "Unexpected migration detected."
            exit 1
          fi
          echo "Expected migration set only: PASS"

      - name: Apply idempotent migrations to production D1
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Verify production migration ledger
        shell: bash
        run: |
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT version, applied_at, description FROM schema_migrations ORDER BY applied_at DESC;"

      - name: Verify production public seed
        shell: bash
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS source_count FROM sources;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS publication_count FROM publications;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS private_draft_urls FROM publications WHERE canonical_url LIKE '%zenodo.org/uploads/%';"

      - name: Production D1 activation result
        run: |
          echo "PRODUCTION D1 MIGRATION: PASS"
          echo "Only the configured production D1 was migrated."
          echo "No Worker deployment or GitHub merge was performed by this workflow."
