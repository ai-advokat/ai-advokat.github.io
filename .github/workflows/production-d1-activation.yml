name: AI Advokat production D1 activation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/production-d1-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-advokat-production-d1-activation
  cancel-in-progress: false

jobs:
  production-gate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 18

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fail closed if Cloudflare secrets are missing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify repository and CasePilot safety stack
        run: |
          node --check src/index.js
          node --check src/casepilot-case-law-bridge.js
          npm run verify
          npm run test:corpus-safety
          npm run test:casepilot-professional-stack

      - name: Verify exact production target
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const cfg=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const prod=cfg.d1_databases?.[0];
          const preview=cfg.previews?.d1_databases?.[0];
          if(cfg.name!=="ai-advokat-github-io") throw new Error("Unexpected Worker name");
          if(!prod || prod.binding!=="DB") throw new Error("Unexpected production binding");
          if(prod.database_name!=="ai-advokat-db") throw new Error("Unexpected production DB name");
          if(prod.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production DB ID");
          if(preview?.database_id===prod.database_id) throw new Error("Production/staging collision");
          if(cfg.r2_buckets) throw new Error("Private CASE_FILES storage must remain unbound");
          console.log("Exact production target: PASS");
          NODE

      - name: Snapshot and guard exact production prestate
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT version,applied_at,description FROM schema_migrations WHERE CAST(version AS INTEGER)>=29 ORDER BY CAST(version AS INTEGER); PRAGMA table_info(court_registry); SELECT name FROM sqlite_master WHERE type='table' AND name IN ('case_law_external_ids','case_law_provenance','casepilot_authority_classifications') ORDER BY name;"             | tee /tmp/casepilot-prestate.txt

          grep -q '"version": "29"' /tmp/casepilot-prestate.txt
          if grep -Eq '"version": "(30|31|32|33|34)"' /tmp/casepilot-prestate.txt; then
            echo "Production D1 is not at the expected version-29 prestate."
            exit 1
          fi
          if grep -Eq '"name": "(jurisdiction|authority_scope|source_identifier_scheme)"' /tmp/casepilot-prestate.txt; then
            echo "0030 court_registry columns already exist without migration-ledger convergence."
            exit 1
          fi

      - name: Confirm exact pending migration set 0030-0034
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/casepilot-pending.txt
          found="$(grep -Eo '003[0-4]_[A-Za-z0-9_.-]+\.sql' /tmp/casepilot-pending.txt | sort -u)"
          expected="$(printf '%s\n'             0030_case_law_source_graph_v2.sql             0031_case_law_identifiers_and_provenance.sql             0032_casepilot_authority_classifications.sql             0033_casepilot_audit_event_schema.sql             0034_casepilot_authority_classification_unique_issue.sql)"
          test "$found" = "$expected"
          unexpected="$(grep -Eo '00[0-9]{2}_[A-Za-z0-9_.-]+\.sql' /tmp/casepilot-pending.txt | grep -vE '^(0030_case_law_source_graph_v2\.sql|0031_case_law_identifiers_and_provenance\.sql|0032_casepilot_authority_classifications\.sql|0033_casepilot_audit_event_schema\.sql|0034_casepilot_authority_classification_unique_issue\.sql)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected pending migrations:"
            echo "$unexpected"
            exit 1
          fi
          echo "Exact pending migration set: PASS"

      - name: Apply CasePilot migrations 0030 through 0034
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Verify converged production schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT version,description FROM schema_migrations WHERE CAST(version AS INTEGER) BETWEEN 30 AND 34 ORDER BY CAST(version AS INTEGER); SELECT name,sql FROM sqlite_master WHERE type='table' AND name IN ('case_law_external_ids','case_law_provenance','casepilot_authority_classifications','case_audit_events') ORDER BY name; SELECT name,sql FROM sqlite_master WHERE type='index' AND name='idx_casepilot_authority_active_unique_v2'; PRAGMA table_info(court_registry);"             | tee /tmp/casepilot-schema.txt

          for v in 30 31 32 33 34; do grep -q "\"version\": \"$v\"" /tmp/casepilot-schema.txt; done
          for t in case_law_external_ids case_law_provenance casepilot_authority_classifications case_audit_events; do grep -q "\"name\": \"$t\"" /tmp/casepilot-schema.txt; done
          for col in jurisdiction authority_scope source_identifier_scheme; do grep -q "\"name\": \"$col\"" /tmp/casepilot-schema.txt; done
          grep -q 'case_law_classified' /tmp/casepilot-schema.txt
          grep -q 'idx_casepilot_authority_active_unique_v2' /tmp/casepilot-schema.txt
          grep -q "COALESCE(issue_key,'')" /tmp/casepilot-schema.txt
          echo "Production CasePilot schema: PASS"

      - name: Redeploy current Worker runtime
        run: npx wrangler deploy --config wrangler.jsonc | tee /tmp/casepilot-deploy.txt

      - name: Live production smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$BASE/api/health" -o /tmp/casepilot-health.json; then
              if grep -q '"ok": true' /tmp/casepilot-health.json; then
                ready=1
                break
              fi
            fi
            sleep 3
          done
          test "$ready" = "1"

          code="$(curl --silent --show-error --output /tmp/casepilot-unauth.json --write-out '%{http_code}' "$BASE/api/cases")"
          test "$code" = "401"
          grep -q 'case_workspace_membership_required' /tmp/casepilot-unauth.json

          query_code="$(curl --silent --show-error --output /tmp/casepilot-case-law.json --write-out '%{http_code}'             -H 'content-type: application/json'             -d '{"query":"притвор нужност поблага мерка"}'             "$BASE/api/casepilot/case-law")"
          test "$query_code" = "200"
          grep -q '"reviewed_official_case_law_only"' /tmp/casepilot-case-law.json
          echo "LIVE CASEPILOT SCHEMA/RUNTIME SMOKE: PASS"

      - name: Upload non-secret convergence evidence
        uses: actions/upload-artifact@v4
        with:
          name: casepilot-production-schema-convergence
          retention-days: 30
          path: |
            /tmp/casepilot-prestate.txt
            /tmp/casepilot-pending.txt
            /tmp/casepilot-schema.txt
            /tmp/casepilot-deploy.txt
            /tmp/casepilot-health.json
            /tmp/casepilot-unauth.json
            /tmp/casepilot-case-law.json

      - name: Production D1 activation result
        run: |
          echo "PRODUCTION D1 CASEPILOT MIGRATIONS 0030-0034: PASS"
          echo "Current Worker runtime redeployed and live-smoked."
          echo "Private CASE_FILES/R2 remains unbound."
