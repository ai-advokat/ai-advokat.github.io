name: AI Advokat GPT production activation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ACTIVATE_GPT_6_1_SOL"
        required: true
        type: string
  push:
    branches: ["main"]
    paths:
      - ".github/activation/gpt-production-request.json"

permissions:
  contents: read

concurrency:
  group: ai-advokat-gpt-production-activation
  cancel-in-progress: true

jobs:
  activate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fail closed on activation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "ACTIVATE_GPT_6_1_SOL"
          else
            node <<'NODE'
          const fs=require("fs");
          const p=".github/activation/gpt-production-request.json";
          const d=JSON.parse(fs.readFileSync(p,"utf8"));
          if(d.activation_authorized!==true) throw new Error("Activation request is not authorized");
          if(d.model!=="gpt-6.1-sol") throw new Error("Unexpected requested model");
          if(d.decision_id!=="AI_ADVOKAT_GPT_PRODUCTION_ACTIVATION_2026-10-04") throw new Error("Unexpected activation decision");
          console.log("Repository activation authorization: PASS");
          NODE
          fi
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          FREE_PROVIDER="$(node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8")); process.stdout.write(c.vars?.FREE_CHAT_PROVIDER==="workers_ai"?"true":"false")')"
          echo "FREE_PROVIDER=$FREE_PROVIDER" >> "$GITHUB_ENV"
          if [ "$FREE_PROVIDER" != "true" ]; then
            test -n "$OPENAI_API_KEY"
            test "${#OPENAI_API_KEY}" -gt 20
          fi
          echo "Activation prerequisites: PASS · FREE_PROVIDER=$FREE_PROVIDER"

      - name: Verify exact governed GPT production configuration
        shell: bash
        run: |
          node --check src/index.js
          node --check src/agent-orchestrator.js
          node --check assets/guide-vault.js
          node --check assets/ai-advokat-chat.js
          node --check scripts/run-live-legal-uat.mjs
          npm run verify
          npm run test:agent-orchestrator
          npm run test:guide-vault
          npm run test:chat-shell
          npm run test:macedonian-language
          npm run test:legal-uat
          node <<'NODE'
          const fs=require("fs");
          const suite=JSON.parse(fs.readFileSync("data/uat/legal-scenarios-v2-20.json","utf8"));
          if(suite.synthetic_data_only!==true) throw new Error("Extended UAT must be synthetic-only");
          if(suite.suite_id!=="AI_ADVOKAT_PRODUCTION_LEGAL_UAT_v2_20") throw new Error("Unexpected extended UAT suite");
          if(suite.scenarios?.length!==20) throw new Error("Extended production UAT must contain exactly 20 scenarios");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          if(c.name!=="ai-advokat-github-io") throw new Error("Unexpected Worker name");
          if(c.vars?.OPENAI_MODEL!=="gpt-6.1-sol") throw new Error("Unexpected OpenAI model");
          if(c.vars?.OPENAI_REASONING_EFFORT!=="medium") throw new Error("Unexpected reasoning effort");
          if(c.vars?.OPENAI_ORCHESTRATOR_ENABLED!=="true") throw new Error("GPT orchestrator gate not armed");
          if(c.vars?.OPENAI_EXTERNAL_RESEARCH_TOOLS_ENABLED!=="true") throw new Error("Web search gate not armed");
          if(c.vars?.OPENAI_FILE_INPUT_ENABLED!=="true") throw new Error("Attachment input gate not armed");
          if(c.vars?.FREE_CHAT_PROVIDER==="workers_ai"){
            if(c.ai?.binding!=="AI") throw new Error("FREE Workers AI binding missing");
            if(c.vars?.WORKERS_AI_MARKDOWN_ENABLED!=="true") throw new Error("Workers AI Markdown conversion not armed");
            if(c.vars?.WORKERS_AI_CHAT_MODEL!=="@cf/openai/gpt-oss-20b") throw new Error("Unexpected FREE Workers AI model");
          }
          const source=fs.readFileSync("src/agent-orchestrator.js","utf8");
          if(source.includes("/v1/conversations")) throw new Error("Durable Conversations API must not be used");
          if(!source.includes("store:false")) throw new Error("Responses store:false missing");
          const all=fs.readFileSync("wrangler.jsonc","utf8")+source+fs.readFileSync("assets/ai-advokat-chat.js","utf8");
          if(/sk-[A-Za-z0-9_-]{20,}/.test(all)) throw new Error("API key pattern found in repository source");
          console.log("Governed provider config: PASS");
          NODE

      - name: Verify GPT-6.1 Sol access with OpenAI
        if: env.FREE_PROVIDER != 'true'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/openai-model.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            https://api.openai.com/v1/models/gpt-6.1-sol)"
          test "$code" = "200"
          node -e 'const d=require("/tmp/openai-model.json"); if(d.id!=="gpt-6.1-sol") process.exit(1); console.log("OpenAI model access: PASS")'

      - name: Verify paid quota with a minimal Responses API preflight
        if: env.FREE_PROVIDER != 'true'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/openai-preflight.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'content-type: application/json' \
            -d '{"model":"gpt-6.1-sol","input":"Reply with only: PREFLIGHT_OK","reasoning":{"effort":"low"},"max_output_tokens":16,"store":false}' \
            https://api.openai.com/v1/responses)"
          test "$code" = "200"
          node <<'NODE'
          const d=require("/tmp/openai-preflight.json");
          const text=(d.output||[]).flatMap(x=>x.content||[]).filter(x=>x.type==="output_text").map(x=>x.text||"").join("\n");
          if(!text.includes("PREFLIGHT_OK")) throw new Error("OpenAI paid-quota preflight did not complete");
          console.log("OpenAI billing/quota preflight: PASS");
          NODE

      - name: Install OpenAI API key as Cloudflare Worker secret
        if: env.FREE_PROVIDER != 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY --config wrangler.jsonc >/tmp/secret-put.log
          grep -Eq 'secret|Success|success|Uploaded' /tmp/secret-put.log || true
          echo "Cloudflare OpenAI secret installation completed."

      - name: Preserve authorized CasePilot private-storage Human Gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const config=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const request=JSON.parse(fs.readFileSync(".github/activation/case-intelligence-e2e-production-request.json","utf8"));
          const r2=config.r2_buckets?.find(x=>x.binding==="CASE_FILES");
          const r2Ready=Boolean(r2 && r2.bucket_name==="ai-advokat-case-files" && r2.preview_bucket_name==="ai-advokat-case-files-staging");
          const d1FallbackReady=config.vars?.CASE_D1_FALLBACK_ENABLED==="true"
            && Array.isArray(config.d1_databases)
            && config.d1_databases.some(x=>x.binding==="DB");
          if(!r2Ready && !d1FallbackReady) {
            throw new Error("Neither governed CASE_FILES R2 nor bounded D1 fallback storage is configured");
          }
          if(request.activation_authorized!==true) throw new Error("Case Intelligence E2E activation is not authorized");
          if(request.private_object_storage_activation_authorized!==true) throw new Error("Private object storage authorization missing");
          if(request.private_document_upload_authorized!==true) throw new Error("Private document upload authorization missing");
          if(request.private_case_ai_execution_authorized!==true) throw new Error("Private case AI authorization missing");
          if(request.autonomous_filing_authorized!==false || request.human_gate_required!==true) {
            throw new Error("CasePilot Human Gate boundaries changed");
          }
          console.log("CasePilot storage and private AI gates: AUTHORIZED · backend="+(r2Ready?"r2":"d1_fallback")+" · autonomous filing remains forbidden.");
          NODE

      - name: Deploy production Worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify provider readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl --fail --retry 6 --retry-delay 3 "$BASE/api/orchestrator" -o /tmp/orchestrator.json
          node <<'NODE'
          const d=require("/tmp/orchestrator.json");
          if(!d.ok) throw new Error("orchestrator endpoint not ready");
          const state=d.runtime?.providerExecution;
          if(process.env.FREE_PROVIDER==="true"){
            if(state!=="configured_for_free_workers_ai_chat_execution") {
              throw new Error("FREE Workers AI provider not configured after deploy: "+JSON.stringify(d.runtime));
            }
            if(d.runtime?.fileInputs!=="configured_workers_ai_markdown_conversion") {
              throw new Error("FREE document conversion not configured: "+JSON.stringify(d.runtime));
            }
          }else{
            if(state!=="configured_for_api_chat_execution") throw new Error("GPT provider not configured after deploy: "+JSON.stringify(d.runtime));
            if(d.runtime?.externalResearchTools!=="configured") throw new Error("Web search runtime not configured");
            if(d.runtime?.fileInputs!=="configured") throw new Error("Attachment input runtime not configured");
          }
          console.log("Provider readiness: PASS · "+state);
          NODE

      - name: Live FREE Workers AI multi-scenario runtime UAT + DOCX smoke
        if: env.FREE_PROVIDER == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          node <<'NODE'
          const base="https://ai-advokat-github-io.aiadvokat16.workers.dev";
          const scenarios=[
            "Одговори на македонски со една кратка реченица дека AI Advokat работи.",
            "Направи ми краток потсетник за лице што треба да оди во притов.",
            "Напиши љубезен краток потсетник со измислено име и датум."
          ];
          for(let round=1;round<=2;round++){
            for(const q of scenarios){
              const response=await fetch(base+"/api/chat",{
                method:"POST",
                headers:{"content-type":"application/json"},
                body:JSON.stringify({q,mode:"auto",webSearch:false,history:[],guideIds:[],attachments:[]})
              });
              const d=await response.json().catch(()=>null);
              if(!response.ok || !d?.ok) throw new Error("FREE runtime scenario failed: "+response.status+" "+JSON.stringify(d));
              if(d.provider!=="workers_ai_free") throw new Error("Unexpected FREE provider: "+d.provider);
              if(d.model!=="@cf/openai/gpt-oss-20b") throw new Error("Unexpected FREE model: "+d.model);
              if(String(d.answer||"").trim().length<12) throw new Error("FREE runtime returned empty/too-short answer: "+JSON.stringify(d));
              if(d.webSearchUsed!==false) throw new Error("FREE runtime must not claim Web search");
            }
          }
          console.log("LIVE FREE WORKERS AI MULTI-SCENARIO UAT: PASS");
          NODE
          python3 <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/free-smoke.docx','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('[Content_Types].xml','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>''')
              z.writestr('_rels/.rels','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>''')
              z.writestr('docProps/core.xml','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>AI Advokat FREE DOCX smoke</dc:title></cp:coreProperties>''')
              z.writestr('docProps/app.xml','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>AI Advokat CI</Application></Properties>''')
              z.writestr('word/_rels/document.xml.rels','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>''')
              z.writestr('word/styles.xml','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>''')
              z.writestr('word/document.xml','''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>PRAVDAFREE777</w:t></w:r></w:p><w:sectPr/></w:body></w:document>''')
          PY
          node <<'NODE' >/tmp/free-smoke-payload.json
          const fs=require("fs");
          const b64=fs.readFileSync("/tmp/free-smoke.docx").toString("base64");
          process.stdout.write(JSON.stringify({
            q:"Прочитај го DOCX прилогот. Врати ја точно, без промена, алфанумеричката низа што се наоѓа во телото на документот.",
            mode:"auto",webSearch:false,history:[],guideIds:[],
            attachments:[{kind:"file",name:"free-smoke.docx",mime:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",base64:b64}]
          }));
          NODE
          curl --fail --retry 3 --retry-delay 2 \
            -H 'content-type: application/json' \
            --data-binary @/tmp/free-smoke-payload.json \
            "$BASE/api/chat" -o /tmp/free-workers-ai-smoke.json
          node <<'NODE'
          const d=require("/tmp/free-workers-ai-smoke.json");
          if(!d.ok) throw new Error("FREE Workers AI smoke failed: "+JSON.stringify(d));
          if(d.provider!=="workers_ai_free") throw new Error("Unexpected FREE provider: "+d.provider);
          if(d.attachmentsUsed!==1 || d.convertedDocuments!==1) throw new Error("DOCX was not converted/processed");
          if(!String(d.answer||"").toUpperCase().includes("PRAVDAFREE777")) throw new Error("DOCX content missing from answer");
          if(d.webSearchUsed!==false) throw new Error("FREE provider must not claim Web search");
          console.log("LIVE FREE WORKERS AI + DOCX: PASS");
          NODE

      - name: Live GPT + Web + attachment smoke test
        if: env.FREE_PROVIDER != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl --fail --retry 3 --retry-delay 2 \
            -H 'content-type: application/json' \
            -d '{"q":"Прочитај го прилогот и со Web search најди ја официјалната веб-страница на OpenAI. Во одговорот вклучи го зборот од прилогот.","mode":"web","webSearch":true,"history":[],"guideIds":[],"attachments":[{"kind":"text","name":"smoke.txt","mime":"text/plain","text":"PRAVDA"}]}' \
            "$BASE/api/chat" -o /tmp/gpt-combined-smoke.json
          node <<'NODE'
          const d=require("/tmp/gpt-combined-smoke.json");
          if(!d.ok) throw new Error("GPT smoke failed: "+JSON.stringify(d));
          if(d.model!=="gpt-6.1-sol") throw new Error("Unexpected model: "+d.model);
          if(d.webSearch!=="enabled" || d.webSearchUsed!==true) throw new Error("Web search did not execute");
          if(d.attachmentsUsed!==1) throw new Error("Attachment was not processed");
          if(!String(d.answer||"").toUpperCase().includes("PRAVDA")) throw new Error("Attachment content missing from answer");
          if(!Array.isArray(d.sources) || !d.sources.length) throw new Error("Clickable web citations missing");
          if(d.conversationPersistence!=="browser_session_only_store_false") throw new Error("Unexpected conversation persistence");
          console.log("LIVE GPT-6.1 SOL + WEB + ATTACHMENT: PASS");
          NODE

      - name: Provision ephemeral synthetic UAT membership
        if: env.FREE_PROVIDER != 'true'
        shell: bash
        run: |
          set -euo pipefail
          UAT_ACCOUNT_ID="uat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          UAT_ENTITLEMENT_ID="uat-ent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          UAT_KEY_ID="uat-key-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          UAT_KEY="uat_$(openssl rand -hex 24)"
          UAT_KEY_HASH="$(printf '%s' "$UAT_KEY" | sha256sum | awk '{print $1}')"
          UAT_KEY_PREFIX="${UAT_KEY:0:12}"
          echo "::add-mask::$UAT_KEY"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
            DELETE FROM membership_usage_monthly WHERE subject_key='account:$UAT_ACCOUNT_ID';
            DELETE FROM security_rate_limit_windows WHERE subject_key='account:$UAT_ACCOUNT_ID';
            DELETE FROM membership_access_keys WHERE account_id='$UAT_ACCOUNT_ID';
            DELETE FROM membership_entitlements WHERE account_id='$UAT_ACCOUNT_ID';
            DELETE FROM membership_accounts WHERE id='$UAT_ACCOUNT_ID';
            INSERT INTO membership_accounts(id,display_name,status)
            VALUES ('$UAT_ACCOUNT_ID','AI Advokat Synthetic UAT','active');
            INSERT INTO membership_entitlements
              (id,account_id,plan_code,status,billing_cycle,monthly_quota,seat_limit,price_mkd,expires_at)
            VALUES
              ('$UAT_ENTITLEMENT_ID','$UAT_ACCOUNT_ID','office','active','manual',50,1,0,datetime('now','+2 hours'));
            INSERT INTO membership_access_keys
              (id,account_id,key_hash,key_prefix,label,status,expires_at)
            VALUES
              ('$UAT_KEY_ID','$UAT_ACCOUNT_ID','$UAT_KEY_HASH','$UAT_KEY_PREFIX','ephemeral production legal UAT','active',datetime('now','+2 hours'));
          "
          echo "UAT_ACCOUNT_ID=$UAT_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "AI_ADVOCAT_UAT_MEMBERSHIP_KEY=$UAT_KEY" >> "$GITHUB_ENV"

      - name: Live governed legal UAT scenarios — 20-domain suite
        if: env.FREE_PROVIDER != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AI_ADVOCAT_UAT_MEMBERSHIP_KEY:-}"
          UAT_OUTPUT=/tmp/legal-uat-results.json node scripts/run-live-legal-uat.mjs data/uat/legal-scenarios-v2-20.json

      - name: Cleanup ephemeral synthetic UAT membership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${UAT_ACCOUNT_ID:-}" ]; then
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
              DELETE FROM membership_usage_monthly WHERE subject_key='account:$UAT_ACCOUNT_ID';
              DELETE FROM security_rate_limit_windows WHERE subject_key='account:$UAT_ACCOUNT_ID';
              DELETE FROM membership_access_keys WHERE account_id='$UAT_ACCOUNT_ID';
              DELETE FROM membership_entitlements WHERE account_id='$UAT_ACCOUNT_ID';
              DELETE FROM membership_accounts WHERE id='$UAT_ACCOUNT_ID';
            "
          else
            echo "No ephemeral UAT membership to clean."
          fi

      - name: Upload non-secret activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-advokat-gpt-production-activation
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/openai-model.json
            /tmp/openai-preflight.json
            /tmp/orchestrator.json
            /tmp/gpt-combined-smoke.json
            /tmp/free-workers-ai-smoke.json
            /tmp/legal-uat-results.json
