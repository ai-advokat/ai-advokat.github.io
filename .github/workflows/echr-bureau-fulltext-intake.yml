name: ECHR Bureau MK full-text intake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/bureau-echr-fulltext-intake.mjs"
      - "corpus/echr/north-macedonia-bureau-index-*.ndjson"
      - ".github/workflows/echr-bureau-fulltext-intake.yml"
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Build official Macedonian ECHR full-text corpus
        run: node scripts/bureau-echr-fulltext-intake.mjs /tmp/bureau-mk-fulltext.ndjson
      - name: Validate corpus output and coverage manifest
        run: |
          test -s /tmp/bureau-mk-fulltext.ndjson
          test -s /tmp/bureau-mk-fulltext.manifest.json
          grep -q '"full_case_text_ingested":true' /tmp/bureau-mk-fulltext.ndjson
          grep -q '"hudoc_binding_required":true' /tmp/bureau-mk-fulltext.ndjson
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("/tmp/bureau-mk-fulltext.manifest.json","utf8")); if(m.index_records!==301) process.exit(2); if(m.processed_pdf_links<300) process.exit(3); if(m.governance.human_review_status!=="pending") process.exit(4); console.log(JSON.stringify({index_records:m.index_records,processed_pdf_links:m.processed_pdf_links,matched_index_records:m.matched_index_records,unmatched_index_records:m.unmatched_index_records.length,failed_pdf_links:m.failed_pdf_links,fulltext_chunks:m.fulltext_chunks}));'
      - name: Upload governed intake artifact
        uses: actions/upload-artifact@v4
        with:
          name: bureau-echr-mk-fulltext
          path: |
            /tmp/bureau-mk-fulltext.ndjson
            /tmp/bureau-mk-fulltext.manifest.json
          retention-days: 30
