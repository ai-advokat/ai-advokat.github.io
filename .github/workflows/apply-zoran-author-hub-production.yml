name: Apply Zoran author hub production patch

on:
  push:
    branches:
      - fix/zoran-author-hub-production

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[zoran-hub-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/zoran-author-hub-production
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic patch
        run: node scripts/apply-zoran-author-hub-production.mjs

      - name: Validate generated files
        run: |
          node --check scripts/apply-zoran-author-hub-production.mjs
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/zoran-stojankic-publications.json','utf8')); if(!Array.isArray(d.records)||d.records.length!==8) throw new Error('Expected 8 publication records');"
          grep -q 'Трудови на Зоран Стојанкиќ' authors/zoran-stojankic/index.html
          grep -q 'ZORAN_AUTHOR_HUB_CARD_START' professional-library/index.html
          grep -q 'ZORAN_ACADEMY_BRIDGE_START' academy/index.html
          grep -q 'ZORAN_GAZETTE_ALERT_START' sluzben-vesnik/index.html
          grep -q 'authors/zoran-stojankic' sitemap.xml
          grep -q 'authors/zoran-stojankic' sitemap.txt

      - name: Repository verification
        run: npm run verify

      - name: Targeted governance tests
        run: |
          npm run test:professional-library
          npm run test:scholarly-literature
          npm run test:gazette-guides-product

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "ai-advokat"
          git config user.email "aiadvokat16@gmail.com"
          git add professional-library/index.html academy/index.html sluzben-vesnik/index.html sitemap.xml sitemap.txt
          git commit -m "Apply Zoran author hub across portal [zoran-hub-applied]"
          git push origin HEAD:fix/zoran-author-hub-production
