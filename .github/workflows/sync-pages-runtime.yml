name: Sync AI Advokat frontend runtime to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "case-law-curation.html"
      - "consolidator/index.html"
      - "hybrid-legal-intelligence.html"
      - "public-legal-data-services.html"
      - "bot/index.html"
      - "assets/ai-advokat-chat.js"
      - "assets/case-law-static-fallback.js"
      - "assets/ai-advokat-chat.css"
      - "assets/ai-advokat-voice.mjs"
      - "assets/frontend-runtime-guard.js"
      - "assets/standalone-bot.js"
      - "assets/chat-privacy-browser.js"
      - "src/chat-privacy.js"
      - "_headers"
      - "src/official-source-binder.js"
      - "src/international-legal-classifier.js"
      - "src/document-ingest-router.js"
      - "src/echr-findings.js"
      - "src/case-law-metadata-processor.js"
      - "src/legal-analyzer.js"
      - "src/case-export.js"
      - "assets/standalone-bot.css"
      - "assets/standalone-bot-vnext.js"
      - "assets/standalone-bot-vnext.css"
      - "assets/standalone-bot-toolkit.js"
      - "assets/standalone-bot-toolkit.css"
      - "assets/standalone-bot-reliability.js"
      - "assets/guide-router.js"
      - "assets/guide-vault.js"
      - "service-worker.js"
      - ".github/workflows/sync-pages-runtime.yml"

permissions:
  contents: write

concurrency:
  group: ai-advokat-pages-runtime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          node --check assets/ai-advokat-chat.js
          node --check assets/ai-advokat-voice.mjs
          node --check assets/case-law-static-fallback.js
          node --check assets/frontend-runtime-guard.js
          node --check assets/standalone-bot.js
          node --check assets/chat-privacy-browser.js
          node --check src/chat-privacy.js
          node --check src/official-source-binder.js
          node --check src/international-legal-classifier.js
          node --check src/document-ingest-router.js
          node --check src/echr-findings.js
          node --check src/case-law-metadata-processor.js
          node --check src/legal-analyzer.js
          node --check src/case-export.js
          node --check src/legal-news-aggregator.js
          node --check assets/standalone-bot-vnext.js
          node --check assets/standalone-bot-toolkit.js
          node --check assets/standalone-bot-reliability.js
          test -f case-law-curation.html
          test -f consolidator/index.html
          test -f hybrid-legal-intelligence.html
          test -f public-legal-data-services.html
          grep -q 'Current-Law Watch' consolidator/index.html
          grep -q 'Hybrid Legal Intelligence R2' hybrid-legal-intelligence.html
          grep -q '/api/hybrid/instruments' hybrid-legal-intelligence.html
          grep -q '/api/hybrid/consolidations' hybrid-legal-intelligence.html
          grep -q 'Open Data Legal Evidence' hybrid-legal-intelligence.html
          grep -q 'Official e‑Service Navigator' hybrid-legal-intelligence.html
          grep -q 'eID + Human Handoff' hybrid-legal-intelligence.html
          grep -q 'Public Legal Data & e‑Services' public-legal-data-services.html
          grep -q '/data/mk-current-law-watch-latest.json' consolidator/index.html
          grep -q 'Case-Law Corpus Radar' case-law-curation.html
          grep -q '/api/case-law/curation-plan' case-law-curation.html
          grep -q 'ai-advokat-chat.js?v=20261106-root-r15-voice-r2-runtime' index.html
          grep -q 'ai-advokat-chat.css?v=20261106-root-r15-voice' index.html
          grep -q 'AI_ADVOCAT_VOICE_R2' assets/ai-advokat-voice.mjs
          grep -q 'bindMicrophone' assets/ai-advokat-voice.mjs
          grep -q 'bindSpeakButton' assets/ai-advokat-voice.mjs
          grep -q 'standalone-bot.js?v=20261106-core-r15-voice-r2' bot/index.html
          grep -q 'standalone-bot.css?v=20261106-access-r15-voice' bot/index.html
          grep -q 'standalone-bot-vnext.js?v=20261107-hybrid-r2-lawyer-view' bot/index.html
          grep -q 'standalone-bot-toolkit.js?v=20261106-toolkit-r14' bot/index.html
          grep -q 'standalone-bot-toolkit.css?v=20261106-toolkit-r14' bot/index.html
          grep -q "import('./chat-privacy-browser.js?v=20261101-privacy-r12')" assets/standalone-bot.js
          grep -q "import('/src/chat-privacy.js?v=20261101-privacy-compat-r1')" assets/standalone-bot.js
          grep -q '!src/chat-privacy.js' .assetsignore
          grep -q "location.hostname === 'ai-advokat.github.io'" bot/index.html
          echo "PAGES SYNC SOURCE CONTRACT: PASS"

      - name: Sync curated runtime files to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          rm -rf /tmp/ai-advokat-gh-pages
          git worktree add --detach /tmp/ai-advokat-gh-pages origin/gh-pages
          files=(
            index.html
            case-law-curation.html
            consolidator/index.html
            hybrid-legal-intelligence.html
            public-legal-data-services.html
            bot/index.html
            assets/ai-advokat-chat.js
            assets/case-law-static-fallback.js
            assets/ai-advokat-chat.css
            assets/ai-advokat-voice.mjs
            assets/frontend-runtime-guard.js
            assets/standalone-bot.js
            assets/chat-privacy-browser.js
            src/chat-privacy.js
            src/official-source-binder.js
            src/international-legal-classifier.js
            src/document-ingest-router.js
            src/echr-findings.js
            src/case-law-metadata-processor.js
            src/legal-analyzer.js
            src/case-export.js
            _headers
            assets/standalone-bot.css
            assets/standalone-bot-vnext.js
            assets/standalone-bot-vnext.css
            assets/standalone-bot-toolkit.js
            assets/standalone-bot-toolkit.css
            assets/standalone-bot-reliability.js
            assets/guide-router.js
            assets/guide-vault.js
            service-worker.js
          )
          for f in "${files[@]}"; do
            mkdir -p "/tmp/ai-advokat-gh-pages/$(dirname "$f")"
            cp "$f" "/tmp/ai-advokat-gh-pages/$f"
          done
          printf 'source_main_sha=%s\n' "$GITHUB_SHA" > /tmp/ai-advokat-gh-pages/pages-release.txt
          cd /tmp/ai-advokat-gh-pages
          git config user.name "ai-advokat-pages-sync"
          git config user.email "aiadvokat16@gmail.com"
          git add -- "${files[@]}" pages-release.txt
          if git diff --cached --quiet; then
            echo "gh-pages already matches main runtime."
            exit 0
          fi
          git commit -m "release(pages): sync runtime from main $GITHUB_SHA"
          git push origin HEAD:gh-pages
          echo "GH-PAGES RUNTIME SYNC: PASS"

      - name: Verify branch parity through Git object identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          for f in index.html case-law-curation.html consolidator/index.html hybrid-legal-intelligence.html public-legal-data-services.html bot/index.html assets/ai-advokat-chat.js assets/ai-advokat-chat.css assets/ai-advokat-voice.mjs assets/case-law-static-fallback.js assets/frontend-runtime-guard.js assets/standalone-bot.js assets/standalone-bot.css assets/chat-privacy-browser.js src/chat-privacy.js src/case-export.js src/legal-analyzer.js src/case-law-metadata-processor.js src/echr-findings.js src/document-ingest-router.js src/international-legal-classifier.js src/official-source-binder.js assets/standalone-bot-vnext.js assets/standalone-bot-vnext.css assets/standalone-bot-toolkit.js assets/standalone-bot-toolkit.css; do
            main_blob="$(git rev-parse "$GITHUB_SHA:$f")"
            pages_blob="$(git rev-parse "origin/gh-pages:$f")"
            test "$main_blob" = "$pages_blob"
            echo "$f: $main_blob"
          done
          pages_release="$(git show origin/gh-pages:pages-release.txt | sed -n 's/^source_main_sha=//p' | head -n1)"
          test "$pages_release" = "$GITHUB_SHA"
          echo "PAGES RELEASE SHA: $pages_release"
          echo "MAIN/GH-PAGES RUNTIME PARITY: PASS"
