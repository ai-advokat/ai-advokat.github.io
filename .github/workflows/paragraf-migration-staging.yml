name: Paragraf migration staging safety validation

on:
  pull_request:
    paths:
      - "migrations/**"
      - "scripts/validate-paragraf-import.mjs"
      - "scripts/staging-safety-preflight.mjs"
      - "scripts/block-remote-staging-migration.mjs"
      - "migration/paragraf/**"
      - "wrangler.staging.jsonc"
      - "wrangler.preview-migrations.jsonc"
      - "package.json"
      - ".github/workflows/paragraf-migration-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paragraf-migration-staging-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-staging-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify repository safety invariants
        run: |
          npm run test:staging-safety
          node --check scripts/validate-paragraf-import.mjs
          node scripts/validate-paragraf-import.mjs migration/paragraf/public-manifest.sample.jsonl
          npm run verify

      - name: Local-only D1 migration dry-run
        run: npm run db:migrate:staging:local

      - name: Verify local migration ledger and schema
        run: |
          npx wrangler d1 execute PREVIEW_DB --local --config wrangler.preview-migrations.jsonc --persist-to .wrangler/state/hg2-b5 --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('schema_migrations','d1_migrations') ORDER BY name;"
          npx wrangler d1 execute PREVIEW_DB --local --config wrangler.preview-migrations.jsonc --persist-to .wrangler/state/hg2-b5 --command "SELECT version, description FROM schema_migrations WHERE version IN ('33','34','35') ORDER BY CAST(version AS INTEGER);"
          npx wrangler d1 execute PREVIEW_DB --local --config wrangler.preview-migrations.jsonc --persist-to .wrangler/state/hg2-b5 --command "PRAGMA table_info(case_audit_events);"
          npx wrangler d1 execute PREVIEW_DB --local --config wrangler.preview-migrations.jsonc --persist-to .wrangler/state/hg2-b5 --command "SELECT COUNT(*) AS authority_rows FROM casepilot_authority_classifications;"

      - name: Result
        run: |
          echo "HG2-B5 LOCAL STAGING MIGRATION SAFETY: PASS"
          echo "No Cloudflare credentials were loaded."
          echo "No remote D1 database was targeted."
          echo "No Worker deployment, route, domain, or binding was activated."
