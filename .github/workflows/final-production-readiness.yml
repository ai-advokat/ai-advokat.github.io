name: AI Advokat final production readiness

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CHECK_AI_ADVOKAT_PRODUCTION_READINESS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-advokat-final-production-readiness
  cancel-in-progress: false

jobs:
  readiness:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify read-only Human Gate and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "CHECK_AI_ADVOKAT_PRODUCTION_READINESS"
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$OPENAI_API_KEY"
          test "${#OPENAI_API_KEY}" -gt 20
          echo "FINAL PRODUCTION READINESS: READ-ONLY HUMAN GATE ACCEPTED"

      - name: Prove this workflow contains no production mutation command
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const p=".github/workflows/final-production-readiness.yml";
          const s=fs.readFileSync(p,"utf8");
          const forbidden=[
            /wrangler\s+deploy/i,
            /wrangler\s+secret\s+put/i,
            /wrangler\s+d1\s+migrations\s+apply/i,
            /\bINSERT\s+INTO\b/i,
            /\bUPDATE\s+[A-Za-z_]/i,
            /\bDELETE\s+FROM\b/i,
            /wrangler\s+d1\s+execute[^\n]*--file/i
          ];
          for(const re of forbidden){
            if(re.test(s)) throw new Error("Mutation command forbidden in read-only production readiness workflow: "+re);
          }
          console.log("READ-ONLY WORKFLOW SELF-AUDIT: PASS");
          NODE

      - name: Dependency and runtime contract verification
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          node --check src/index.js
          node --check src/agent-orchestrator.js
          npm run verify
          npm run test:legal-intelligence-engine
          npm run test:agent-orchestrator
          npm run test:macedonian-language
          node --no-warnings --test test/standalone-bot.test.mjs
          echo "LOCAL RELEASE CONTRACTS: PASS"

      - name: Verify exact production target and isolation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const db=c.d1_databases?.[0];
          const preview=c.previews?.d1_databases?.[0];
          if(c.name!=="ai-advokat-github-io") throw new Error("Unexpected production Worker");
          if(!db || db.binding!=="DB" || db.database_name!=="ai-advokat-db") throw new Error("Unexpected production D1 binding");
          if(db.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production D1 ID");
          if(preview?.database_id===db.database_id) throw new Error("Production/preview D1 collision");
          if(c.vars?.OPENAI_MODEL!=="gpt-6.1-sol") throw new Error("Unexpected production model");
          for(const k of ["OPENAI_ORCHESTRATOR_ENABLED","LIOE_RUNTIME_GOVERNANCE_ENABLED","LIOE_POSTFLIGHT_ENABLED","LIOE_RUNTIME_TELEMETRY_ENABLED","LIOE_SPECIALIST_EXECUTION_ENABLED"]){
            if(c.vars?.[k]!=="true") throw new Error(k+" is not armed");
          }
          console.log("EXACT PRODUCTION TARGET + ISOLATION: PASS");
          NODE

      - name: Cloudflare identity
        run: npx wrangler whoami | tee /tmp/final-readiness-whoami.txt

      - name: Read-only production D1 schema probe
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
          SELECT 1 AS ok;
          SELECT name FROM sqlite_master
            WHERE type='table'
              AND name IN (
                'membership_accounts',
                'membership_entitlements',
                'membership_access_keys',
                'membership_usage_monthly',
                'security_rate_limit_windows',
                'lioe_runtime_runs'
              )
            ORDER BY name;
          PRAGMA table_info(membership_accounts);
          PRAGMA table_info(membership_entitlements);
          PRAGMA table_info(membership_access_keys);
          PRAGMA table_info(lioe_runtime_runs);
          " | tee /tmp/final-readiness-d1-schema.txt

          for t in membership_accounts membership_entitlements membership_access_keys membership_usage_monthly security_rate_limit_windows lioe_runtime_runs; do
            grep -q "\"name\": \"$t\"" /tmp/final-readiness-d1-schema.txt
          done
          for col in run_id mission_profile verification_state release_state provider_calls total_tokens elapsed_ms; do
            grep -q "\"name\": \"$col\"" /tmp/final-readiness-d1-schema.txt
          done
          echo "PRODUCTION D1 REQUIRED SCHEMA: PASS"

      - name: Read-only production migration inventory
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/final-readiness-migrations.txt
          echo "PRODUCTION MIGRATION INVENTORY: CAPTURED"

      - name: Verify OpenAI model access and minimal paid quota
        shell: bash
        run: |
          set -euo pipefail
          model_code="$(curl --silent --show-error --output /tmp/final-readiness-openai-model.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            https://api.openai.com/v1/models/gpt-6.1-sol)"
          test "$model_code" = "200"

          response_code="$(curl --silent --show-error --output /tmp/final-readiness-openai-response.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'content-type: application/json' \
            -d '{"model":"gpt-6.1-sol","input":"Reply with only: FINAL_READINESS_OK","reasoning":{"effort":"low"},"max_output_tokens":20,"store":false}' \
            https://api.openai.com/v1/responses)"
          test "$response_code" = "200"
          node <<'NODE'
          const d=require("/tmp/final-readiness-openai-response.json");
          const text=(d.output||[]).flatMap(x=>x.content||[]).filter(x=>x.type==="output_text").map(x=>x.text||"").join("\n");
          if(!text.includes("FINAL_READINESS_OK")) throw new Error("OpenAI paid-quota preflight did not complete");
          console.log("OPENAI MODEL + PAID QUOTA: PASS");
          NODE

      - name: Read-only live production health and capability checks
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"

          curl --fail --retry 5 --retry-delay 2 "$BASE/api/health" -o /tmp/final-readiness-health.json
          curl --fail --retry 5 --retry-delay 2 "$BASE/api/orchestrator" -o /tmp/final-readiness-orchestrator.json
          curl --fail --retry 5 --retry-delay 2 "$BASE/api/capabilities" -o /tmp/final-readiness-capabilities.json

          node <<'NODE'
          const h=require("/tmp/final-readiness-health.json");
          const o=require("/tmp/final-readiness-orchestrator.json");
          const c=require("/tmp/final-readiness-capabilities.json");
          if(!h.ok) throw new Error("Production health endpoint is not ok");
          if(h.database?.reachable!==true) throw new Error("Production database is not reachable");
          if(!o.ok) throw new Error("Production orchestrator is not ready");
          if(o.runtime?.providerExecution!=="configured_for_api_chat_execution") throw new Error("Production provider is not configured");
          if(o.runtime?.lioeRuntimeGovernance!=="enabled") throw new Error("LIOE runtime governance is not enabled");
          if(o.runtime?.lioePostflight!=="enabled") throw new Error("LIOE postflight is not enabled");
          if(c.capabilities?.legalOrchestrator!=="openai_paid_governed_workers_ai_free") throw new Error("Production legal orchestrator capability mismatch");
          if(c.capabilities?.paidChatProvider!=="openai") throw new Error("Production paid chat provider mismatch");
          if(c.capabilities?.paidChatModel!=="gpt-6.1-sol") throw new Error("Production paid chat model mismatch");
          if(c.capabilities?.freeChatProvider!=="workers_ai") throw new Error("Production free chat provider mismatch");
          console.log("LIVE PRODUCTION HEALTH + ORCHESTRATOR + CAPABILITIES: PASS");
          NODE

      - name: Verify unauthenticated bot route remains fail-closed without provider call
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          code="$(curl --silent --show-error --output /tmp/final-readiness-bot-unauth.json --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"q":"Здраво"}' \
            "$BASE/api/bot")"
          test "$code" = "401"
          grep -q 'bot_membership_required' /tmp/final-readiness-bot-unauth.json
          echo "LIVE /api/bot FAIL-CLOSED: PASS"

      - name: Write readiness summary
        shell: bash
        run: |
          cat > /tmp/final-production-readiness-summary.txt <<'EOF'
          AI ADVOKAT 4 — FINAL PRODUCTION READINESS
          Result: PASS
          Mode: READ-ONLY
          Production deployment performed: NO
          Production D1 writes performed: NO
          Production secret changes performed: NO
          Next gate: explicit production Human Gate for deployment
          EOF
          cat /tmp/final-production-readiness-summary.txt

      - name: Upload non-secret readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-production-readiness-evidence
          retention-days: 30
          path: |
            /tmp/final-readiness-whoami.txt
            /tmp/final-readiness-d1-schema.txt
            /tmp/final-readiness-migrations.txt
            /tmp/final-readiness-health.json
            /tmp/final-readiness-orchestrator.json
            /tmp/final-readiness-capabilities.json
            /tmp/final-readiness-bot-unauth.json
            /tmp/final-production-readiness-summary.txt
