name: Paragraf staging compatibility v9

on:
  push:
    branches:
      - paragraf-production-apply-29sep2026
    paths:
      - "migrations/0008_kocani_wpa_journal_issue1.sql"
      - "migrations/0009_kocani_issue1_compat.sql"
      - ".github/workflows/paragraf-staging-compat-v9.yml"

permissions:
  contents: read

jobs:
  staging-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify staging target
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.preview-migrations.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(!d || d.binding!=="PREVIEW_DB" || d.database_name!=="ai-advokat-db-staging" || d.database_id!=="eb560e98-9fc0-408e-9c81-9b823ffde44d") throw new Error("Unexpected staging target");
          NODE
      - name: Verify only v9 pending in staging
        shell: bash
        run: |
          npx wrangler d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc > pending.txt
          cat pending.txt
          grep -q "0009_kocani_issue1_compat.sql" pending.txt
          found="$(grep -Eo '000[0-9]+_[A-Za-z0-9_.-]+\.sql' pending.txt | sort -u)"
          test "$found" = "0009_kocani_issue1_compat.sql"
      - name: Apply v9 to staging
        run: npx wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc
      - name: Verify convergence
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT title, venue, publication_status, human_review_status FROM publications WHERE title='Кочани – „Пулс“: индивидуална кривична, институционална и политичка одговорност';"
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --command "SELECT version, description FROM schema_migrations WHERE version='9';"
