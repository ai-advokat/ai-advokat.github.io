name: Paragraf full migration validation

on:
  pull_request:
    paths:
      - "migration/paragraf/**"
      - "scripts/normalize-paragraf-full-export.mjs"
      - "scripts/validate-paragraf-import.mjs"
      - "scripts/paragraf-full-ndjson-to-sql.mjs"
      - "scripts/paragraf-case-law-bridge.mjs"
      - "scripts/paragraf-case-law-binding-queue.mjs"
      - "scripts/paragraf-parity-audit.mjs"
      - "scripts/paragraf-hetzner-backup-inventory.mjs"
      - "scripts/paragraf-sql-schema-discovery.mjs"
      - "scripts/paragraf-structured-export-profile.mjs"
      - "scripts/case-law-ndjson-to-sql.mjs"
      - "test/paragraf-full-export-normalizer.test.mjs"
      - "test/paragraf-import-validator.test.mjs"
      - "test/paragraf-full-ndjson-to-sql.test.mjs"
      - "test/paragraf-case-law-bridge.test.mjs"
      - "test/paragraf-case-law-binding-queue.test.mjs"
      - "test/paragraf-parity-audit.test.mjs"
      - "test/paragraf-hetzner-backup-inventory.test.mjs"
      - "test/paragraf-sql-schema-discovery.test.mjs"
      - "test/paragraf-structured-export-profile.test.mjs"
      - "test/case-law-import.test.mjs"
      - ".github/workflows/paragraf-full-migration-validation.yml"
  push:
    branches:
      - main
      - "paragraf-full-migration-*"
    paths:
      - "migration/paragraf/**"
      - "scripts/normalize-paragraf-full-export.mjs"
      - "scripts/validate-paragraf-import.mjs"
      - "scripts/paragraf-full-ndjson-to-sql.mjs"
      - "scripts/paragraf-case-law-bridge.mjs"
      - "scripts/paragraf-case-law-binding-queue.mjs"
      - "scripts/paragraf-parity-audit.mjs"
      - "scripts/paragraf-hetzner-backup-inventory.mjs"
      - "scripts/paragraf-sql-schema-discovery.mjs"
      - "scripts/paragraf-structured-export-profile.mjs"
      - "test/paragraf-full-export-normalizer.test.mjs"
      - "test/paragraf-import-validator.test.mjs"
      - "test/paragraf-full-ndjson-to-sql.test.mjs"
      - "test/paragraf-case-law-bridge.test.mjs"
      - "test/paragraf-case-law-binding-queue.test.mjs"
      - "test/paragraf-parity-audit.test.mjs"
      - "test/paragraf-hetzner-backup-inventory.test.mjs"
      - "test/paragraf-sql-schema-discovery.test.mjs"
      - "test/paragraf-structured-export-profile.test.mjs"
      - ".github/workflows/paragraf-full-migration-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check scripts/normalize-paragraf-full-export.mjs
          node --check scripts/validate-paragraf-import.mjs
          node --check scripts/paragraf-full-ndjson-to-sql.mjs
          node --check scripts/paragraf-case-law-bridge.mjs
          node --check scripts/paragraf-case-law-binding-queue.mjs
          node --check scripts/paragraf-parity-audit.mjs
          node --check scripts/paragraf-hetzner-backup-inventory.mjs
          node --check scripts/paragraf-sql-schema-discovery.mjs
          node --check scripts/paragraf-structured-export-profile.mjs
          node --check scripts/case-law-ndjson-to-sql.mjs
      - name: Paragraf full migration tests
        run: |
          node --test test/paragraf-full-export-normalizer.test.mjs
          node --test test/paragraf-import-validator.test.mjs
          node --test test/paragraf-full-ndjson-to-sql.test.mjs
          node --test test/paragraf-case-law-bridge.test.mjs
          node --test test/paragraf-case-law-binding-queue.test.mjs
          node --test test/paragraf-parity-audit.test.mjs
          node --test test/paragraf-hetzner-backup-inventory.test.mjs
          node --test test/paragraf-sql-schema-discovery.test.mjs
          node --test test/paragraf-structured-export-profile.test.mjs
          node --test test/case-law-import.test.mjs
      - name: Existing repository verification
        run: npm run verify
