name: Cloudflare capacity diagnostic

on:
  push:
    branches: ["audit/cloudflare-capacity-diagnostic-2026-11-04"]
    paths:
      - ".github/workflows/cloudflare-capacity-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read sanitized account subscription state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          code="$(curl -sS -o /tmp/subscriptions.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions")"
          echo "SUBSCRIPTIONS_HTTP_STATUS=$code"
          node <<'NODE'
          const fs=require("fs");
          let d={};
          try{d=JSON.parse(fs.readFileSync("/tmp/subscriptions.json","utf8"));}catch{}
          if(Array.isArray(d.result)){
            const safe=d.result.map(x=>({
              ratePlanId:x?.rate_plan?.id||null,
              state:x?.state||null,
              frequency:x?.frequency||null
            }));
            console.log("SANITIZED_SUBSCRIPTIONS="+JSON.stringify(safe));
          }else{
            console.log("SANITIZED_SUBSCRIPTIONS_UNAVAILABLE="+JSON.stringify({
              success:d.success===true,
              errorCodes:Array.isArray(d.errors)?d.errors.map(e=>e?.code).filter(Boolean):[]
            }));
          }
          NODE
