name: One-time production runtime update

# release-trigger: deploy canonical source-preservation hotfix ed7fbe2e2ffd627a5e8022df58f07b594f5dbdf1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-production-once.yml"

permissions:
  contents: read

concurrency:
  group: ai-advokat-production-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

      - name: Run security regression suite
        run: npm run test:security

      - name: Run runtime governance regression suite
        run: npm run test:legal-runtime-governance

      - name: Run GPT production activation regression suite
        run: npm run test:gpt-activation

      - name: Run case-law regression suite
        run: |
          npm run test:case-law-sources
          npm run test:case-law-chat
          node --test test/as-stip-case-law-corpus.test.mjs

      - name: Deploy current main to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live Macedonian V14 canonical-clean runtime contract
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          ok=0
          for attempt in $(seq 1 60); do
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/api/capabilities?deploy_verify=$GITHUB_RUN_ID-$attempt" -o /tmp/v11-capabilities.json || true
            if node <<'NODE'
          const fs=require("fs");
          let d={}; try{d=JSON.parse(fs.readFileSync("/tmp/v11-capabilities.json","utf8"));}catch{}
          const c=d.capabilities||{};
          const pass=d.ok===true
            && c.macedonianLanguageGuard==="MK_ORTHOGRAPHY_2017_RUNTIME_V14_EDITOR_ATTEMPT_CANONICAL_CLEAN_FALLBACK"
            && c.macedonianReleaseGate==="FREE_MK_CANONICAL_RELEASE_V10_EDITOR_ATTEMPT_CANONICAL_CLEAN_FALLBACK"
            && c.freeRuntimePolicy==="FREE_MK_CANONICAL_RELEASE_V12_EDITOR_ATTEMPT_CANONICAL_CLEAN_FALLBACK";
          if(!pass) process.exit(1);
          NODE
            then
              ok=1
              echo "MACEDONIAN V14 CANONICAL-CLEAN LIVE CAPABILITY CONTRACT: PASS on attempt $attempt"
              break
            fi
            echo "Waiting for Macedonian V14 canonical-clean runtime contract (attempt $attempt/60)."
            sleep 3
          done
          test "$ok" = "1"

      - name: Verify exact live main parity and R13 frontend deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"

          expected_home="$(sha256sum index.html | awk '{print $1}')"
          expected_chat="$(sha256sum assets/ai-advokat-chat.js | awk '{print $1}')"
          expected_chat_css="$(sha256sum assets/ai-advokat-chat.css | awk '{print $1}')"
          expected_bot="$(sha256sum bot/index.html | awk '{print $1}')"
          expected_core="$(sha256sum assets/standalone-bot.js | awk '{print $1}')"
          expected_vnext="$(sha256sum assets/standalone-bot-vnext.js | awk '{print $1}')"
          expected_privacy_primary="$(sha256sum assets/chat-privacy-browser.js | awk '{print $1}')"
          expected_privacy_compat="$(sha256sum src/chat-privacy.js | awk '{print $1}')"

          deployed=0
          for attempt in $(seq 1 40); do
            nonce="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/?release=root-r13-parity&deploy_verify=$nonce" -o /tmp/deploy-home.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/ai-advokat-chat.js?v=20261105-root-r13-parity&deploy_verify=$nonce" -o /tmp/deploy-chat.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/ai-advokat-chat.css?v=20261101-root-complete-r12&deploy_verify=$nonce" -o /tmp/deploy-chat.css || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/bot/?release=core-r13&deploy_verify=$nonce" -o /tmp/deploy-bot.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/standalone-bot.js?v=20261101-core-r13&deploy_verify=$nonce" -o /tmp/deploy-core.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/standalone-bot-vnext.js?v=20261105-vnext-r12&deploy_verify=$nonce" -o /tmp/deploy-vnext.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/assets/chat-privacy-browser.js?v=20261101-privacy-r12&deploy_verify=$nonce" -o /tmp/deploy-privacy-primary.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$BASE/src/chat-privacy.js?v=20261101-privacy-compat-r1&deploy_verify=$nonce" -o /tmp/deploy-privacy-compat.js || true

            live_home="$(sha256sum /tmp/deploy-home.html 2>/dev/null | awk '{print $1}' || true)"
            live_chat="$(sha256sum /tmp/deploy-chat.js 2>/dev/null | awk '{print $1}' || true)"
            live_chat_css="$(sha256sum /tmp/deploy-chat.css 2>/dev/null | awk '{print $1}' || true)"
            live_bot="$(sha256sum /tmp/deploy-bot.html 2>/dev/null | awk '{print $1}' || true)"
            live_core="$(sha256sum /tmp/deploy-core.js 2>/dev/null | awk '{print $1}' || true)"
            live_vnext="$(sha256sum /tmp/deploy-vnext.js 2>/dev/null | awk '{print $1}' || true)"
            live_privacy_primary="$(sha256sum /tmp/deploy-privacy-primary.js 2>/dev/null | awk '{print $1}' || true)"
            live_privacy_compat="$(sha256sum /tmp/deploy-privacy-compat.js 2>/dev/null | awk '{print $1}' || true)"

            if [ "$live_home" = "$expected_home" ] \
              && [ "$live_chat" = "$expected_chat" ] \
              && [ "$live_chat_css" = "$expected_chat_css" ] \
              && [ "$live_bot" = "$expected_bot" ] \
              && [ "$live_core" = "$expected_core" ] \
              && [ "$live_vnext" = "$expected_vnext" ] \
              && [ "$live_privacy_primary" = "$expected_privacy_primary" ] \
              && [ "$live_privacy_compat" = "$expected_privacy_compat" ]; then
              deployed=1
              echo "EXTERNAL BOT R13 LIVE BYTE PARITY: PASS · MAIN ROOT-R13-PARITY + VNEXT-R12 on attempt $attempt"
              break
            fi
            echo "Waiting for exact root-r13-parity + R13/vNext-r12 production bytes (attempt $attempt/40)."
            sleep 3
          done
          test "$deployed" = "1"

          legacy_code="$(curl -sS --max-time 30 -o /dev/null -D /tmp/deploy-legacy-headers.txt -w '%{http_code}' "$BASE/bot/?release=core-r10")"
          test "$legacy_code" = "302"
          grep -qi '^location: .*release=core-r13' /tmp/deploy-legacy-headers.txt
          grep -qi '^clear-site-data: "cache"' /tmp/deploy-legacy-headers.txt
          grep -qi '^x-ai-advokat-release: core-r13' /tmp/deploy-legacy-headers.txt
          echo "LEGACY CORE-R10 SELF-HEAL TO R13: PASS"

          legacy_r12_code="$(curl -sS --max-time 30 -o /dev/null -D /tmp/deploy-legacy-r12-headers.txt -w '%{http_code}' "$BASE/bot/?release=core-r12")"
          test "$legacy_r12_code" = "302"
          grep -qi '^location: .*release=core-r13' /tmp/deploy-legacy-r12-headers.txt
          grep -qi '^clear-site-data: "cache"' /tmp/deploy-legacy-r12-headers.txt
          grep -qi '^x-ai-advokat-release: core-r13' /tmp/deploy-legacy-r12-headers.txt
          echo "LEGACY CORE-R12 SELF-HEAL TO R13: PASS"

      - name: Provision ephemeral R13 Professional smoke membership
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT="r13-article-smoke"
          ENT="r13-article-ent"
          KID="r13-article-key"
          KEY="r13smoke_$(openssl rand -hex 24)"
          HASH="$(printf '%s' "$KEY" | sha256sum | awk '{print $1}')"
          PREFIX="${KEY:0:12}"
          echo "::add-mask::$KEY"
          echo "R13_SMOKE_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
          echo "R13_SMOKE_KEY=$KEY" >> "$GITHUB_ENV"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
            DELETE FROM membership_usage_monthly WHERE subject_key='account:$ACCOUNT';
            DELETE FROM security_rate_limit_windows WHERE subject_key='account:$ACCOUNT';
            DELETE FROM membership_access_keys WHERE account_id='$ACCOUNT';
            DELETE FROM membership_entitlements WHERE account_id='$ACCOUNT';
            DELETE FROM membership_accounts WHERE id='$ACCOUNT';
            INSERT INTO membership_accounts(id,display_name,status)
              VALUES ('$ACCOUNT','R13 Exact Article Synthetic Smoke','active');
            INSERT INTO membership_entitlements
              (id,account_id,plan_code,status,billing_cycle,monthly_quota,seat_limit,price_mkd,expires_at)
              VALUES ('$ENT','$ACCOUNT','office','active','manual',3,1,0,datetime('now','+20 minutes'));
            INSERT INTO membership_access_keys
              (id,account_id,key_hash,key_prefix,label,status,expires_at)
              VALUES ('$KID','$ACCOUNT','$HASH','$PREFIX','ephemeral r13 article smoke','active',datetime('now','+20 minutes'));
          " >/tmp/r13-provision.txt
          echo "R13 EPHEMERAL PROFESSIONAL MEMBERSHIP: PROVISIONED"

      - name: Verify live Professional exact Article 12 resilience
        shell: bash
        run: |
          set -euo pipefail
          test -n "${R13_SMOKE_KEY:-}"
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          code=""
          for attempt in 1 2 3; do
            code="$(curl -sS --max-time 180 -o /tmp/r13-article12.json -w '%{http_code}' \
              -H 'content-type: application/json' \
              -H "X-Membership-Key: $R13_SMOKE_KEY" \
              -H 'Origin: https://ai-advokat.github.io' \
              -d '{"q":"Што уредува член 12 од ЗРО и кои услови ги предвидува? Не измислувај членови или содржина. Наведи го точниот извор и важечката верзија.","mode":"auto","webSearch":false,"history":[],"guideIds":[],"guideDocuments":[],"attachments":[]}' \
              "$BASE/api/bot" || true)"
            printf '%s\n' "$code" > /tmp/r13-article12-http.txt
            echo "ARTICLE 12 LIVE HTTP attempt $attempt: $code"
            if [ "$code" = "200" ]; then
              break
            fi
            node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("/tmp/r13-article12.json","utf8"))}catch{}; console.log("ARTICLE 12 NON-200:",JSON.stringify({ok:d.ok??null,error:d.error??null,message:d.message??null,governanceRunId:d.governanceRunId??null,languageReasons:d.languageReasons??null}))'
            sleep 3
          done
          test "$code" = "200"
          node <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/r13-article12.json","utf8"));
          if(!d.ok) throw new Error("Article 12 smoke returned ok=false");
          const answer=String(d.answer||"").trim();
          const sourceGap=d.displayMode==="professional_exact_article_source_gap";
          if(answer.length<40) throw new Error("Article 12 answer is empty/too short");
          if(/AI runtime не успеа безбедно|LIOE-RT-[0-9]/u.test(answer)) throw new Error("Generic LIOE runtime failure resurfaced");
          if(!sourceGap && (!Array.isArray(d.legalSources) || d.legalSources.length<1)) throw new Error("Article 12 source-backed response has no governed legal source");
          if(d.articleCorpus?.instrument?.canonicalKey!=="mk:zro") throw new Error("Wrong instrument routed: "+JSON.stringify(d.articleCorpus?.instrument||null));
          if(sourceGap){
            if(!/SOURCE\/VERSION GAP/u.test(answer)) throw new Error("Controlled source/version gap label missing");
            if(!/не избира произволно една од повеќе верзии/iu.test(answer)) throw new Error("Version-selection safety explanation missing");
            if(d.legalGovernance?.verificationState!=="SOURCE_VERSION_GAP") throw new Error("Source-gap governance state missing");
          }
          if(!sourceGap && d.articleCorpus?.version?.label!=="official-consolidated-snapshot-through-111/2023") throw new Error("Unexpected governed ZRO version: "+JSON.stringify(d.articleCorpus?.version||null));
          const exactSource=Array.isArray(d.legalSources)?d.legalSources.find(s=>String(s?.articleNumber||"").trim()==="12"):null;
          if(!sourceGap && !exactSource) throw new Error("Exact governed Article 12 source missing");
          if(!sourceGap && String(exactSource?.version||"")!=="official-consolidated-snapshot-through-111/2023") throw new Error("Article 12 source version mismatch");
          if(!sourceGap && !["openai","canonical_corpus_no_model"].includes(String(d.provider||""))) throw new Error("Unexpected provider: "+d.provider);
          if(!sourceGap && d.provider==="canonical_corpus_no_model"){
            const sourceFirst=d.providerFallback==null
              && d.sourceMode==="ai_advokat_exact_article_authority_only";
            const providerFailureFallback=d.providerFallback?.from==="openai";
            if(!sourceFirst && !providerFailureFallback) throw new Error("Canonical provider provenance is neither source-first nor governed provider fallback");
            if(sourceFirst){
              if(d.webSearchUsed===true) throw new Error("Source-first exact article unexpectedly used web search");
              if(d.legalGovernance?.engine!=="AI_ADVOKAT_LIOE_v1") throw new Error("LIOE governance missing on source-first path");
              if(d.legalGovernance?.sourceVerificationState!=="VERIFIED") throw new Error("Source-first canonical source is not VERIFIED");
              if(d.legalGovernance?.humanReviewRequired!==true) throw new Error("Current-law Human Gate not required on source-first path");
              if(Number(d.membership?.used||0)!==0) throw new Error("Source-first no-model retrieval consumed AI quota");
              if(!/source-first патека без модел/u.test(answer)) throw new Error("Source-first truth label missing");
            }else{
              if(d.legalGovernance?.verificationState!=="SOURCE_BACKED_PROVIDER_FALLBACK") throw new Error("Canonical fallback governance state missing");
            }
            if(!/не го означува како .важечки текст./u.test(answer)) throw new Error("Current-law truth-label warning missing");
          } else if(!sourceGap) {
            if(d.legalGovernance?.engine!=="AI_ADVOKAT_LIOE_v1") throw new Error("LIOE governance missing on OpenAI path");
            if(d.legalGovernance?.humanReviewRequired!==true) throw new Error("Current-law Human Gate not required");
          }
          const summary={
            ok:d.ok,
            provider:d.provider,
            providerFallback:d.providerFallback||null,
            sourceMode:d.sourceMode||null,
            membershipUsed:Number(d.membership?.used||0),
            legalSourceCount:Array.isArray(d.legalSources)?d.legalSources.length:0,
            governanceRunId:d.governanceRunId||null,
            verificationState:d.legalGovernance?.verificationState||null,
            releaseState:d.legalGovernance?.releaseState||null,
            humanReviewRequired:d.legalGovernance?.humanReviewRequired===true,
            answerNonEmpty:true
          };
          fs.writeFileSync("/tmp/r13-article12-summary.json",JSON.stringify(summary,null,2));
          console.log("LIVE PROFESSIONAL ZRO ARTICLE 12: PASS");
          NODE

      - name: Cleanup ephemeral R13 Professional smoke membership
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${R13_SMOKE_ACCOUNT:-}" ]; then
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
              DELETE FROM membership_usage_monthly WHERE subject_key='account:$R13_SMOKE_ACCOUNT';
              DELETE FROM security_rate_limit_windows WHERE subject_key='account:$R13_SMOKE_ACCOUNT';
              DELETE FROM membership_access_keys WHERE account_id='$R13_SMOKE_ACCOUNT';
              DELETE FROM membership_entitlements WHERE account_id='$R13_SMOKE_ACCOUNT';
              DELETE FROM membership_accounts WHERE id='$R13_SMOKE_ACCOUNT';
            " >/tmp/r13-cleanup.txt
            echo "R13 EPHEMERAL PROFESSIONAL MEMBERSHIP: CLEANED"
          fi

      - name: Upload R13 exact-article release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-advokat-r13-exact-article-release-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/r13-article12-summary.json
            /tmp/r13-article12.json
            /tmp/r13-article12-http.txt
            /tmp/r13-cleanup.txt
            /tmp/deploy-legacy-headers.txt

      - name: Record deployed commit
        run: |
          echo "AI Advokat production runtime update"
          echo "commit=${GITHUB_SHA}"
          echo "worker=ai-advokat-github-io"

# trigger-zro12-source-gap-r14: 2026-11-01

# trigger-exact-article-polish-r15: 2026-11-01

# trigger-r15-live-smoke-copy-contract: 2026-11-01

# trigger-mk-orthography-v10-live-contract: 2026-11-01
