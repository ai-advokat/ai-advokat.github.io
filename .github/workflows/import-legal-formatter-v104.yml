name: Import Legal Formatter v10.4 engine

on:
  push:
    branches:
      - feat/legal-formatter-v104-engine
    paths:
      - ".github/workflows/import-legal-formatter-v104.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/legal-formatter-v104-engine

      - name: Reconstruct exact Legal Formatter v10.4 core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/legal-formatter-v10.4
          cat .tmp/lfcore-v104/part* | base64 -d | gunzip > assets/legal-formatter-v10.4/lfcore.js
          echo "f72b84934ee5adc4fe2f7b94c2bfe42eee32a314144a3b518ea9dfcd0431f5e3  assets/legal-formatter-v10.4/lfcore.js" | sha256sum -c -
          node - <<'NODE'
          const C=require('./assets/legal-formatter-v10.4/lfcore.js');
          const required=[
            'parseBaseLaw','parseAmendments','consolidate','validate',
            'verifyConsolidationFidelity','resolveDuplicates','resolveReferences',
            'buildEditorialFootnotes','buildRenumberPlan','buildResolutionWorkflow',
            'applyResolutionsToLaw','buildPublicationPackage',
            'buildFullAmendmentRegister','buildChangeMap'
          ];
          if(C.version!=='10.4.0') throw new Error('wrong_version_'+C.version);
          for(const k of required){
            if(typeof C[k]!=='function') throw new Error('missing_'+k);
          }
          console.log('LFCORE_V104_EXACT_PASS',C.version);
          NODE

      - name: Commit exact engine and remove staging chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/legal-formatter-v10.4/lfcore.js
          git rm -r .tmp/lfcore-v104
          git commit -m "feat: add exact Legal Formatter v10.4 core engine"
          git push origin HEAD:feat/legal-formatter-v104-engine
