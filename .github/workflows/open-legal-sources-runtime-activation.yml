name: AI Advokat Open Legal Sources runtime activation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/activation/open-legal-sources-runtime-request.json"
      - ".github/workflows/open-legal-sources-runtime-activation.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ACTIVATE_OPEN_LEGAL_SOURCES"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-advokat-open-legal-sources-runtime
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify authorization and exact scope
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync(".github/activation/open-legal-sources-runtime-request.json","utf8"));
          if(d.activation_authorized!==true) throw new Error("Activation not authorized");
          if(d.decision_id!=="AI_ADVOKAT_OPEN_LEGAL_SOURCES_RUNTIME_ACTIVATION_2026-10-12") throw new Error("Unexpected decision");
          if(d.migration!=="0037_open_legal_sources_registry.sql") throw new Error("Unexpected migration");
          if(d.human_gate_preserved!==true) throw new Error("Human Gate must remain preserved");
          console.log("Activation authorization: PASS");
          NODE
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "ACTIVATE_OPEN_LEGAL_SOURCES"
          fi
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify runtime and governance before remote write
        run: |
          node --check src/open-legal-sources-policy.js
          node --check src/agent-orchestrator.js
          node --check src/legal-runtime-governance.js
          node --check src/index.js
          npm run test:open-legal-sources
          npm run test:open-legal-sources-runtime
          npm run test:agent-orchestrator
          npm run test:legal-runtime-governance
          npm run verify

      - name: Prepare isolated migration 0037 for staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ols-migrations
          mkdir -p ols-migrations
          cp migrations/0037_open_legal_sources_registry.sql ols-migrations/0037_open_legal_sources_registry.sql
          cat > wrangler.ols-staging.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "ai-advokat-ols-staging",
            "compatibility_date": "2026-09-26",
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "ai-advokat-db-staging",
                "database_id": "eb560e98-9fc0-408e-9c81-9b823ffde44d",
                "migrations_dir": "ols-migrations"
              }
            ]
          }
          EOF

      - name: Apply isolated migration 0037 to staging
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list ai-advokat-db-staging --remote --config wrangler.ols-staging.jsonc | tee /tmp/ols-staging-pending.txt
          npx wrangler d1 migrations apply ai-advokat-db-staging --remote --config wrangler.ols-staging.jsonc | tee /tmp/ols-staging-apply.txt
          npx wrangler d1 execute ai-advokat-db-staging --remote --config wrangler.ols-staging.jsonc --command "SELECT COUNT(*) AS source_count FROM open_legal_source_rights; SELECT version,description FROM schema_migrations WHERE version='37';" | tee /tmp/ols-staging-verify.txt
          grep -q '"source_count": 15' /tmp/ols-staging-verify.txt
          grep -q '"version": "37"' /tmp/ols-staging-verify.txt

  production:
    needs: staging
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Reverify exact production target and safety
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node <<'NODE'
          const fs=require("fs");
          const cfg=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const db=cfg.d1_databases?.[0];
          const preview=cfg.previews?.d1_databases?.[0];
          if(cfg.name!=="ai-advokat-github-io") throw new Error("Unexpected Worker");
          if(!db || db.binding!=="DB" || db.database_name!=="ai-advokat-db") throw new Error("Unexpected production D1 binding");
          if(db.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production D1 id");
          if(preview?.database_id===db.database_id) throw new Error("Production/staging collision");
          const req=JSON.parse(fs.readFileSync(".github/activation/open-legal-sources-runtime-request.json","utf8"));
          if(req.activation_authorized!==true || req.human_gate_preserved!==true) throw new Error("Authorization invalid");
          console.log("Exact production target and Human Gate: PASS");
          NODE
          npm run test:open-legal-sources
          npm run test:open-legal-sources-runtime
          npm run test:agent-orchestrator
          npm run test:legal-runtime-governance

      - name: Prepare isolated migration 0037 for production
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ols-migrations
          mkdir -p ols-migrations
          cp migrations/0037_open_legal_sources_registry.sql ols-migrations/0037_open_legal_sources_registry.sql
          cat > wrangler.ols-production.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "ai-advokat-ols-production",
            "compatibility_date": "2026-09-26",
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "ai-advokat-db",
                "database_id": "12ece285-74bb-4f27-a025-2dbd1be6c59a",
                "migrations_dir": "ols-migrations"
              }
            ]
          }
          EOF

      - name: Apply isolated migration 0037 to production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list ai-advokat-db --remote --config wrangler.ols-production.jsonc | tee /tmp/ols-production-pending.txt
          npx wrangler d1 migrations apply ai-advokat-db --remote --config wrangler.ols-production.jsonc | tee /tmp/ols-production-apply.txt
          npx wrangler d1 execute ai-advokat-db --remote --config wrangler.ols-production.jsonc --command "SELECT COUNT(*) AS source_count FROM open_legal_source_rights; SELECT version,description FROM schema_migrations WHERE version='37';" | tee /tmp/ols-production-verify.txt
          grep -q '"source_count": 15' /tmp/ols-production-verify.txt
          grep -q '"version": "37"' /tmp/ols-production-verify.txt

      - name: Deploy current Worker runtime
        run: npx wrangler deploy --config wrangler.jsonc | tee /tmp/ols-worker-deploy.txt

      - name: Live source-policy smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$BASE/api/open-legal-sources-policy" -o /tmp/ols-policy.json; then
              if grep -q '"sourceCount":15' /tmp/ols-policy.json && grep -q '"sourceRouter":"enabled"' /tmp/ols-policy.json; then
                ready=1
                break
              fi
            fi
            sleep 3
          done
          test "$ready" = "1"

          curl --fail --silent --show-error "$BASE/api/orchestrator" -o /tmp/ols-orchestrator.json
          grep -q '"openLegalSourcesPolicy":"runtime_wired_1.0.0"' /tmp/ols-orchestrator.json
          grep -q '"id":"regional_comparative"' /tmp/ols-orchestrator.json

          curl --fail --silent --show-error "$BASE/api/capabilities" -o /tmp/ols-capabilities.json
          grep -q '"openLegalSourcesPolicy":"runtime_wired_1.0.0"' /tmp/ols-capabilities.json

          curl --fail --silent --show-error -H 'content-type: application/json' -d '{"q":"Што вели словенечкото право?"}' "$BASE/api/orchestrator/plan" -o /tmp/ols-plan.json
          grep -q '"regional_comparative"' /tmp/ols-plan.json
          echo "OPEN LEGAL SOURCES RUNTIME LIVE SMOKE: PASS"

      - name: Upload non-secret activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: open-legal-sources-runtime-activation
          retention-days: 30
          path: |
            /tmp/ols-production-pending.txt
            /tmp/ols-production-apply.txt
            /tmp/ols-production-verify.txt
            /tmp/ols-worker-deploy.txt
            /tmp/ols-policy.json
            /tmp/ols-orchestrator.json
            /tmp/ols-capabilities.json
            /tmp/ols-plan.json
