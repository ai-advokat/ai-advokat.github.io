name: Live Zoki core trio smoke

on:
  push:
    paths:
      - ".github/workflows/live-zoki-core-trio-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Analyzer Consolidator Predictor live
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            curl -L --fail --silent --show-error --max-time 30               'https://ai-advokat.github.io/assets/standalone-bot-vnext.js' -o /tmp/vnext.js || true
            if grep -q 'data-vnext-action="analyzer"' /tmp/vnext.js               && grep -q 'data-vnext-action="consolidator"' /tmp/vnext.js               && grep -q 'data-vnext-action="predictor"' /tmp/vnext.js               && grep -q 'PREDICTOR MODE' /tmp/vnext.js               && grep -q 'Не давај процент на успех' /tmp/vnext.js               && grep -q 'official consolidated' /tmp/vnext.js; then
              echo "LIVE_ZOKI_CORE_TRIO_PASS"
              exit 0
            fi
            sleep 5
          done
          echo "Live vNext did not converge to Zoki core trio build." >&2
          exit 1
