name: R25 bounded LIVE Cloudflare Preview AI diagnostics

on:
  pull_request:
    branches:
      - release/zoki-unified-rc2-candidate-20261115
    paths:
      - "scripts/zoki-r25-bounded-live-ai.mjs"
      - ".github/workflows/zoki-r25-bounded-live-ai.yml"

permissions:
  contents: read

concurrency:
  group: zoki-r25-bounded-live-ai
  cancel-in-progress: false

jobs:
  exact-preview-real-ai:
    if: github.head_ref == 'feat/zoki-bot-formats-translator-r24-20261115'
    name: One translation + one Whisper + one FREE chat
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PREVIEW_URL: https://feat-zoki-bot-formats-translator-r24-20261-ai-advokat-github-io.aiadvokat16.workers.dev
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MIC_AUDIO_FILE: /tmp/zoki-r25-synthetic-voice.wav
    steps:
      - name: Checkout the exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Hard gate — no live Neurons spent on ordinary CI updates
        id: spend_gate
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if test "$message" = "R25-LIVE-PROBE-ONCE"; then
            echo "allow=true" >> "$GITHUB_OUTPUT"
            echo "Live provider probe explicitly selected for this commit"
          else
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "No AI calls: ordinary source change, only static CI applies"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify live probe script syntax (no AI cost)
        run: node --check scripts/zoki-r25-bounded-live-ai.mjs

      - name: Record honest NOT_TESTED status when real calls are intentionally gated
        if: steps.spend_gate.outputs.allow != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names=['exact_source_byte_parity','capabilities_read_only',
            'one_real_short_translation_MK_to_SQ','one_real_synthetic_WAV_Whisper',
            'one_real_anonymous_internal_FREE_legal_chat','external_bot_training_gate_without_paid_model'];
          const report={
            protocol:'ZOKI_R25_LIVE_DIAGNOSTIC_V1',
            checkedAt:new Date().toISOString(),
            exactCommit:process.env.EXPECTED_HEAD_SHA,
            preview:process.env.PREVIEW_URL,
            execution:'SKIPPED_BY_NO_COST_GATE',
            checks:names.map(name=>({name,status:'NOT_TESTED',details:{reason:'live_model_calls_not_authorised_for_this_commit'}})),
            summary:{passed:0,failed:0,notTested:names.length,realModelsVerified:[],releaseReady:false,legalHumanGate:'HOLD'},
            productionTouched:false,paidFallbackAuthorised:false
          };
          fs.writeFileSync('/tmp/zoki-r25-bounded-live-ai.json',JSON.stringify(report,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### R25 real AI verification: NOT TESTED\\n\\nNo live model calls were authorised for this commit. '+
            'Workflow success means only the source syntax and evidence-recording steps passed. '+
            '**This is not evidence of working chat, translation, or voice.**\\n');
          NODE

      - name: Prepare a synthetic one-second voice, never a client recording
        if: steps.spend_gate.outputs.allow == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v espeak-ng >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq espeak-ng
          fi
          espeak-ng -v en-us -s 180 -w "$MIC_AUDIO_FILE" "AI Advokat test only"
          test -s "$MIC_AUDIO_FILE"
          test "$(stat -c %s "$MIC_AUDIO_FILE")" -lt 1048576

      - name: Exact SHA preview parity then bounded REAL providers
        if: steps.spend_gate.outputs.allow == 'true'
        run: node scripts/zoki-r25-bounded-live-ai.mjs

      - name: Retain redacted PASS/FAIL/NOT_TESTED evidence even when providers fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZOKI-R25-LIVE-PROVIDER-DIAGNOSTIC-NOT-RELEASE
          path: /tmp/zoki-r25-bounded-live-ai.json
          if-no-files-found: error
          retention-days: 7

# WARNING: 3 bounded REAL model calls in total, no retries: M2M100, Whisper
# and anonymous Workers AI text chat. The external greeting is deterministic
# or membership-gated. No OpenAI paid model, D1, production, or legal promotion.
