name: Zoki R24 file formats and translator UAT

on:
  pull_request:
    paths:
      - "src/case-export.js"
      - "src/case-workspace.js"
      - "assets/casepilot-export.js"
      - "assets/ai-advokat-chat.js"
      - "assets/standalone-bot.js"
      - "assets/casepilot-workspace-ui.js"
      - "bot/index.html"
      - "index.html"
      - "test/zoki-bot-file-format-r24.test.mjs"
      - "scripts/zoki-bot-formats-browser-r24.mjs"
      - ".github/workflows/zoki-formats-browser-r24.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-files:
    name: Six real format downloads + quota mock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source syntax and format contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/ai-advokat-chat.js
          node --check assets/standalone-bot.js
          node --check assets/casepilot-export.js
          node --check assets/casepilot-workspace-ui.js
          node --check src/case-workspace.js
          node --check src/case-export.js
          node --check src/index.js
          node --check scripts/zoki-bot-formats-browser-r24.mjs
          node --no-warnings --test test/zoki-bot-file-format-r24.test.mjs test/case-export.test.mjs test/case-workspace.test.mjs
      - name: Prepare Chromium (no model calls)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser"
          echo "BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Generate and check actual browser downloads plus offline 3036 notice
        run: node scripts/zoki-bot-formats-browser-r24.mjs

# No real AI quota, paid API, production promotion, confidential matter or
# autonomous legal action is exercised. Live UAT remains separate.
