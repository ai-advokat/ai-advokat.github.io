name: Materialize approved hero image

on:
  push:
    branches:
      - hero-brand-fix-30sep2026
    paths:
      - ".tmp/hero/**"
      - ".github/workflows/materialize-hero-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify approved hero image
        shell: bash
        run: |
          set -euo pipefail
          test -d .tmp/hero
          test "$(find .tmp/hero -maxdepth 1 -name '*.b64' | wc -l)" -eq 6
          mkdir -p assets
          cat .tmp/hero/*.b64 | tr -d '\n\r' | base64 -d > assets/ai-advokat-hero-brand.webp
          test -s assets/ai-advokat-hero-brand.webp
          SHA="$(sha256sum assets/ai-advokat-hero-brand.webp | cut -d' ' -f1)"
          test "$SHA" = "c96ae51224a5a9c317f2215b65397b1b8b7a3a8a118865f255a4d229e3d2bf9f"
          file assets/ai-advokat-hero-brand.webp | tee /tmp/file.txt
          grep -q 'Web/P image' /tmp/file.txt
          grep -q '400x225' /tmp/file.txt
          rm -rf .tmp/hero
      - name: Commit binary asset and remove staging chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ai-advokat-hero-brand.webp .tmp/hero
          git commit -m "Add approved high-detail AI Advokat hero image"
          git push origin HEAD:hero-brand-fix-30sep2026
