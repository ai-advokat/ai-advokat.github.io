name: AI Advokat production D1 diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-production:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify production target locally
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const cfg = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const prod = cfg.d1_databases?.[0];
          const preview = cfg.previews?.d1_databases?.[0];
          if (!prod) throw new Error("Missing production D1 config.");
          if (prod.binding !== "DB") throw new Error("Unexpected production binding.");
          if (prod.database_name !== "ai-advokat-db") throw new Error("Unexpected production database name.");
          if (prod.database_id !== "12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production database ID.");
          if (preview && preview.database_id === prod.database_id) throw new Error("Production and preview database IDs must differ.");
          console.log("Production target guard: PASS");
          NODE

      - name: Cloudflare identity diagnostic
        run: npx wrangler whoami

      - name: Read-only production D1 probe
        run: npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT 1 AS ok;"

      - name: Read-only production table inventory
        run: npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"

      - name: Read-only production migration inventory
        run: npx wrangler d1 migrations list DB --remote --config wrangler.jsonc

      - name: Read-only production ZPP version windows
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT li.canonical_key, iv.id, iv.version_label, iv.valid_from, iv.application_from, iv.valid_to, iv.is_current, iv.human_review_status, iv.version_class, iv.source_issue_number, iv.source_issue_date FROM instrument_versions iv JOIN legal_instruments li ON li.id=iv.instrument_id WHERE li.canonical_key='mk:zpp' ORDER BY iv.id;"

      - name: Diagnostic result
        run: |
          echo "READ-ONLY PRODUCTION DIAGNOSTICS: PASS"
          echo "No D1 migrations, writes, deployments, or merges were performed."
