name: ZRO staging convergence

on:
  workflow_dispatch:
  push:
    branches:
      - slvesnik-public-corpus-collector-29sep2026
    paths:
      - ".github/workflows/zro-staging-convergence.yml"

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify staging target
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.preview-migrations.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(!d || d.binding!=="PREVIEW_DB" || d.database_name!=="ai-advokat-db-staging" || d.database_id!=="eb560e98-9fc0-408e-9c81-9b823ffde44d") {
            throw new Error("Unexpected staging target");
          }
          console.log("STAGING TARGET OK");
          NODE

      - name: Guard only migration 0016 pending
        shell: bash
        run: |
          npx wrangler d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc | tee /tmp/pending.txt
          found="$(grep -Eo '001[0-9]+_[A-Za-z0-9_.-]+\.sql' /tmp/pending.txt | sort -u)"
          test "$found" = "0016_article_version_candidates.sql"
          echo "Pending migration guard: PASS"

      - name: Verify existing ZRO corpus baseline
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT COUNT(*) AS article_count, SUM(CASE WHEN status='historical' THEN 1 ELSE 0 END) AS historical_count, SUM(CASE WHEN status='current_consolidated' THEN 1 ELSE 0 END) AS current_count, SUM(CASE WHEN human_review_status='pending' THEN 1 ELSE 0 END) AS pending_review_count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro');"             | tee /tmp/before.txt

          grep -q '"article_count": 298' /tmp/before.txt
          grep -q '"historical_count": 298' /tmp/before.txt
          grep -q '"current_count": 0' /tmp/before.txt
          grep -q '"pending_review_count": 298' /tmp/before.txt

          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT current_status,human_review_status FROM legal_instruments WHERE canonical_key='mk:zro';"             | tee /tmp/instrument-before.txt
          grep -q '"current_status": "needs_version_review"' /tmp/instrument-before.txt
          grep -q '"human_review_status": "pending"' /tmp/instrument-before.txt

      - name: Apply migration 0016 only
        run: npx wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc

      - name: Verify Human Gate schema
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT version,description FROM schema_migrations WHERE version='16'; SELECT name FROM sqlite_master WHERE type='table' AND name='legal_article_version_candidates'; SELECT COUNT(*) AS candidate_count FROM legal_article_version_candidates;"             | tee /tmp/v16.txt
          grep -q '"version": "16"' /tmp/v16.txt
          grep -q '"name": "legal_article_version_candidates"' /tmp/v16.txt
          grep -q '"candidate_count": 0' /tmp/v16.txt

      - name: Verify ZRO corpus unchanged after migration
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT COUNT(*) AS article_count, SUM(CASE WHEN status='historical' THEN 1 ELSE 0 END) AS historical_count, SUM(CASE WHEN status='current_consolidated' THEN 1 ELSE 0 END) AS current_count, SUM(CASE WHEN human_review_status='pending' THEN 1 ELSE 0 END) AS pending_review_count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro');"             | tee /tmp/after.txt
          grep -q '"article_count": 298' /tmp/after.txt
          grep -q '"historical_count": 298' /tmp/after.txt
          grep -q '"current_count": 0' /tmp/after.txt
          grep -q '"pending_review_count": 298' /tmp/after.txt

          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT run_key,article_count,warning_count,status FROM corpus_ingest_runs WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') ORDER BY id DESC LIMIT 1;"             | tee /tmp/ingest-run.txt

      - name: Assert production target absent
        run: |
          ! grep -R "12ece285-74bb-4f27-a025-2dbd1be6c59a" /tmp/pending.txt /tmp/before.txt /tmp/after.txt /tmp/v16.txt /tmp/ingest-run.txt
          echo "Production D1 id absent: PASS"

      - name: Upload convergence evidence
        uses: actions/upload-artifact@v4
        with:
          name: zro-staging-convergence-evidence
          retention-days: 14
          path: |
            /tmp/pending.txt
            /tmp/before.txt
            /tmp/after.txt
            /tmp/v16.txt
            /tmp/ingest-run.txt
            /tmp/instrument-before.txt
