name: Gazette open-data 1944-2017 production activation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ACTIVATE_GAZETTE_OPEN_DATA_1944_2017"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/activation/gazette-open-data-1944-2017-production-request.json"
      - ".github/workflows/gazette-open-data-1944-2017-production-activation.yml"
      - "migrations/0047_gazette_issue_metadata_backfill_1944_2017.sql"
      - "scripts/gazette_open_data_backfill.py"
      - "src/gazette-issue-metadata.js"
      - "src/index.js"
      - "sluzben-vesnik/index.html"

permissions:
  contents: read

concurrency:
  group: gazette-open-data-1944-2017-production-activation
  cancel-in-progress: false

jobs:
  activate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SOURCE_URL: "https://data.gov.mk/dataset/05342c32-f4a6-49c3-b8fa-5a555a6df6ff/resource/9a039791-1abb-411f-bc04-bf136776a83a/download/izdanija-sluzben-vesnik-do-2017.xlsx"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify exact Human Gate authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "ACTIVATE_GAZETTE_OPEN_DATA_1944_2017"
          fi
          node <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync(".github/activation/gazette-open-data-1944-2017-production-request.json","utf8"));
          if(d.activation_authorized!==true) throw new Error("Activation not authorized");
          if(d.decision_id!=="AI_ADVOKAT_GAZETTE_OPEN_DATA_1944_2017_METADATA_BACKFILL_2026-10-18") throw new Error("Unexpected decision");
          const expected=["0046_gazette_open_data_1944_2017.sql","0047_gazette_issue_metadata_backfill_1944_2017.sql"];
          if(JSON.stringify(d.migrations)!==JSON.stringify(expected)) throw new Error("Unexpected migration set");
          if(d.target?.worker!=="ai-advokat-github-io") throw new Error("Unexpected Worker target");
          if(d.target?.database!=="ai-advokat-db" || d.target?.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected D1 target");
          for(const key of ["canonical_issue_metadata_backfill","bot_issue_metadata_provenance","public_readonly_issue_index"]){
            if(d.scope?.[key]!==true) throw new Error("Required scope not authorized: "+key);
          }
          for(const key of ["raw_xlsx_backfill","gazette_fulltext_import","legal_corpus_promotion","current_law_promotion","automated_bulk_ingest"]){
            if(d.scope?.[key]!==false) throw new Error("Forbidden scope authorized: "+key);
          }
          if(d.human_gate_required!==true || d.fail_closed!==true) throw new Error("Human Gate/fail-closed contract changed");
          console.log("GAZETTE METADATA HUMAN GATE: PASS");
          NODE

      - name: Verify repository contracts
        run: |
          python3 -m py_compile scripts/gazette_open_data_backfill.py
          node --check src/gazette-issue-metadata.js
          node --check src/index.js
          node --test test/gazette-open-data-1944-2017.test.mjs
          node --test test/gazette-issue-metadata-runtime.test.mjs
          node --test test/gazette-open-data-production-activation.test.mjs
          node --test test/gazette-guides-product.test.mjs
          node --test test/gazette-comprehensive-index.test.mjs
          node --test test/gazette-chunk-runtime.test.mjs
          node --test test/canonical-provenance-gate.test.mjs

      - name: Verify exact production target
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(c.name!=="ai-advokat-github-io") throw new Error("Unexpected Worker name");
          if(!d || d.binding!=="DB" || d.database_name!=="ai-advokat-db" || d.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production D1 target");
          if(c.previews?.d1_databases?.[0]?.database_id===d.database_id) throw new Error("Production/staging collision");
          console.log("EXACT PRODUCTION TARGET: PASS");
          NODE

      - name: Guard exact pending migration state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/gazette-open-data-pending.txt
          found="$(grep -Eo '00[0-9]{2}_[A-Za-z0-9_.-]+\.sql' /tmp/gazette-open-data-pending.txt | sort -u || true)"
          unexpected="$(printf '%s\n' "$found" | grep -Ev '^(0046_gazette_open_data_1944_2017|0047_gazette_issue_metadata_backfill_1944_2017)\.sql$' | sed '/^$/d' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected pending migrations:"
            echo "$unexpected"
            exit 1
          fi
          echo "PENDING MIGRATION GUARD: PASS"

      - name: Apply Gazette metadata migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc | tee /tmp/gazette-open-data-apply.txt

      - name: Download exact official XLSX snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 "$SOURCE_URL" -o /tmp/gazette.xlsx
          echo "4d111eb03ed0b8e877d151e030bf38096831cedc7a26f4a09121d9e6dfac5a18  /tmp/gazette.xlsx" | sha256sum --check
          python3 scripts/gazette_open_data_backfill.py --input /tmp/gazette.xlsx --out-dir /tmp/gazette-batches --batch-size 300 | tee /tmp/gazette-build.txt
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/gazette-batches/summary.json",encoding="utf-8"))
          assert d["source_rows"]==8651,d
          assert d["canonical_unique_rows"]==8638,d
          assert d["exact_duplicate_extra_rows"]==13,d
          assert d["publication_types"]==7,d
          assert d["first_issue_date"]=="1944-01-01",d
          assert d["last_issue_date"]=="2017-12-29",d
          assert d["metadata_only"] is True,d
          assert d["legal_text_authority"] is False,d
          assert d["current_law_authority"] is False,d
          print("OFFICIAL XLSX RECONCILIATION: PASS")
          PY

      - name: Load controlled metadata staging table
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "DELETE FROM gazette_issue_metadata_stage;" | tee /tmp/gazette-stage-clear.txt
          for f in /tmp/gazette-batches/batch_*.sql; do
            echo "Loading $f"
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --file "$f"
          done
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
            SELECT COUNT(*) AS n,
                   MIN(issue_date) AS first_issue_date,
                   MAX(issue_date) AS last_issue_date,
                   COUNT(DISTINCT year) AS year_count,
                   COUNT(DISTINCT publication_type) AS publication_type_count,
                   SUM(source_occurrences) AS source_occurrences,
                   SUM(runtime_eligible) AS runtime_eligible,
                   SUM(legal_text_authority) AS legal_text_authority,
                   SUM(current_law_authority) AS current_law_authority
              FROM gazette_issue_metadata_stage;
          " | tee /tmp/gazette-stage-verify.txt
          grep -q '"n": 8638' /tmp/gazette-stage-verify.txt
          grep -q '"first_issue_date": "1944-01-01"' /tmp/gazette-stage-verify.txt
          grep -q '"last_issue_date": "2017-12-29"' /tmp/gazette-stage-verify.txt
          grep -q '"year_count": 74' /tmp/gazette-stage-verify.txt
          grep -q '"publication_type_count": 7' /tmp/gazette-stage-verify.txt
          grep -q '"source_occurrences": 8651' /tmp/gazette-stage-verify.txt
          grep -q '"runtime_eligible": 0' /tmp/gazette-stage-verify.txt
          grep -q '"legal_text_authority": 0' /tmp/gazette-stage-verify.txt
          grep -q '"current_law_authority": 0' /tmp/gazette-stage-verify.txt

      - name: Promote reconciled metadata index
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/gazette-promote.sql <<'SQL'
          DELETE FROM gazette_issue_metadata;
          INSERT INTO gazette_issue_metadata
            (publication_type,issue_number,issue_date,year,source_row_first,source_occurrences,
             source_authority,dataset_id,resource_id,dataset_url,resource_url,snapshot_sha256,
             source_class,human_review_status,runtime_eligible,legal_text_authority,current_law_authority)
          SELECT publication_type,issue_number,issue_date,year,source_row_first,source_occurrences,
                 source_authority,dataset_id,resource_id,dataset_url,resource_url,snapshot_sha256,
                 source_class,human_review_status,runtime_eligible,legal_text_authority,current_law_authority
            FROM gazette_issue_metadata_stage
           ORDER BY issue_date,publication_type,issue_number;
          DELETE FROM gazette_issue_metadata_stage;
          SQL
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --file /tmp/gazette-promote.sql | tee /tmp/gazette-promote.txt
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
            SELECT COUNT(*) AS n,MIN(issue_date) AS first_issue_date,MAX(issue_date) AS last_issue_date,
                   COUNT(DISTINCT publication_type) AS publication_type_count,
                   SUM(source_occurrences) AS source_occurrences,
                   SUM(runtime_eligible) AS runtime_eligible,
                   SUM(legal_text_authority) AS legal_text_authority,
                   SUM(current_law_authority) AS current_law_authority
              FROM gazette_issue_metadata;
            SELECT COUNT(*) AS duplicate_identity_groups FROM (
              SELECT publication_type,issue_number,issue_date,COUNT(*) AS c
                FROM gazette_issue_metadata
               GROUP BY publication_type,issue_number,issue_date
              HAVING c>1
            );
            SELECT issue_number,issue_date,publication_type
              FROM gazette_issue_metadata
             WHERE issue_number='72' AND year=2016;
          " | tee /tmp/gazette-production-verify.txt
          grep -q '"n": 8638' /tmp/gazette-production-verify.txt
          grep -q '"source_occurrences": 8651' /tmp/gazette-production-verify.txt
          grep -q '"runtime_eligible": 0' /tmp/gazette-production-verify.txt
          grep -q '"legal_text_authority": 0' /tmp/gazette-production-verify.txt
          grep -q '"current_law_authority": 0' /tmp/gazette-production-verify.txt
          grep -q '"duplicate_identity_groups": 0' /tmp/gazette-production-verify.txt
          grep -q '"issue_date": "2016-04-12"' /tmp/gazette-production-verify.txt
          echo "PRODUCTION METADATA PROMOTION: PASS"

      - name: Verify source-policy registration
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
            SELECT version,description FROM schema_migrations WHERE version IN ('46','47') ORDER BY version;
            SELECT title,url,source_type,issuing_body,jurisdiction,source_status
              FROM sources
             WHERE url='https://data.gov.mk/dataset/n3dahnja-ha-cjiyx6eh-bechnk-do-2017';
            SELECT source_key,authority_status,reuse_status,ingest_status,automated_bulk_ingest,human_review_status
              FROM open_legal_source_rights
             WHERE source_key='mk-official-gazette-data-gov-2017';
          " | tee /tmp/gazette-source-policy-verify.txt
          grep -q '"version": "46"' /tmp/gazette-source-policy-verify.txt
          grep -q '"version": "47"' /tmp/gazette-source-policy-verify.txt
          grep -q '"source_type": "official_gazette_issue_metadata"' /tmp/gazette-source-policy-verify.txt
          grep -q '"ingest_status": "metadata_only"' /tmp/gazette-source-policy-verify.txt
          grep -q '"automated_bulk_ingest": 0' /tmp/gazette-source-policy-verify.txt

      - name: Deploy current Worker runtime
        run: npx wrangler deploy --config wrangler.jsonc | tee /tmp/gazette-open-data-deploy.txt

      - name: Live Gazette metadata and bot-lane smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl --fail --retry 6 --retry-delay 3 "$BASE/api/gazette-issue-index?q=72%2F2016&limit=20" -o /tmp/gazette-live-index.json
          curl --fail --retry 6 --retry-delay 3 "$BASE/api/gazette-hybrid-status" -o /tmp/gazette-live-status.json
          curl --fail --retry 6 --retry-delay 3 "$BASE/api/open-legal-sources-policy" -o /tmp/gazette-open-data-live.json
          node <<'NODE'
          const idx=require("/tmp/gazette-live-index.json");
          if(!idx.ok || idx.metadataOnly!==true) throw new Error("Gazette metadata index not ready");
          if(idx.coverage?.total!==8638) throw new Error("Unexpected total: "+idx.coverage?.total);
          if(idx.authority?.legalTextAuthorityCount!==0 || idx.authority?.currentLawAuthorityCount!==0) throw new Error("Metadata authority leak");
          if(!idx.entries.some(x=>String(x.issue_number)==="72" && x.issue_date==="2016-04-12")) throw new Error("72/2016 reconciliation missing");
          const status=require("/tmp/gazette-live-status.json");
          if(!status.ok || status.counts?.officialIssueMetadata!==8638) throw new Error("Hybrid status metadata count mismatch");
          const policy=require("/tmp/gazette-open-data-live.json");
          const s=(policy.sources||[]).find(x=>x.id==="mk-official-gazette-data-gov-2017");
          if(!s || s.ingestStatus!=="metadata_only" || s.automatedBulkIngest!==false) throw new Error("Source policy changed");
          console.log("LIVE GAZETTE METADATA: PASS");
          NODE

      - name: Upload non-secret activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazette-open-data-1944-2017-production-activation
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/gazette-open-data-pending.txt
            /tmp/gazette-open-data-apply.txt
            /tmp/gazette-build.txt
            /tmp/gazette-batches/summary.json
            /tmp/gazette-stage-verify.txt
            /tmp/gazette-promote.txt
            /tmp/gazette-production-verify.txt
            /tmp/gazette-source-policy-verify.txt
            /tmp/gazette-open-data-deploy.txt
            /tmp/gazette-live-index.json
            /tmp/gazette-live-status.json
            /tmp/gazette-open-data-live.json
