name: R13 synthetic membership recovery cleanup

on:
  workflow_run:
    workflows: ["One-time production runtime update"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-advokat-r13-synthetic-membership-cleanup
  cancel-in-progress: false

jobs:
  revoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Revoke any orphaned R13 synthetic access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "
            UPDATE membership_access_keys
               SET status='revoked'
             WHERE account_id='r13-article-smoke'
               AND id='r13-article-key';
            UPDATE membership_entitlements
               SET status='cancelled', updated_at=CURRENT_TIMESTAMP
             WHERE account_id='r13-article-smoke'
               AND id='r13-article-ent';
            UPDATE membership_accounts
               SET status='cancelled', updated_at=CURRENT_TIMESTAMP
             WHERE id='r13-article-smoke';
          " >/tmp/r13-recovery-cleanup.txt
          echo "R13 SYNTHETIC ACCESS RECOVERY: PASS"
