name: STAGING legacy version binding activation

on:
  push:
    branches:
      - main
    paths:
      - ".github/activation/staging-legacy-version-binding-2026-10-11.json"
      - ".github/workflows/staging-legacy-version-binding.yml"
  pull_request:
    paths:
      - ".github/activation/staging-legacy-version-binding-2026-10-11.json"
      - ".github/workflows/staging-legacy-version-binding.yml"
      - "migrations/0024_zi_legacy_version_backfill.sql"
      - "migrations/0025_zro_legacy_version_backfill.sql"
      - "migrations/0026_zkp_legacy_version_backfill.sql"
      - "test/legacy-backfill.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-legacy-version-binding-2026-10-11
  cancel-in-progress: false

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Legacy backfill regression tests
        run: npm run test:legacy-backfill
      - name: Corpus safety regression tests
        run: npm run test:corpus-safety

  staging-activation:
    if: github.event_name != 'pull_request'
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate activation request and D1 identities
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node <<'NODE'
          const fs=require("fs");
          const req=JSON.parse(fs.readFileSync(".github/activation/staging-legacy-version-binding-2026-10-11.json","utf8"));
          const strip=(s)=>s.replace(/\/\*[\s\S]*?\*\//g,"").replace(/^\s*\/\/.*$/gm,"");
          const prod=JSON.parse(strip(fs.readFileSync("wrangler.jsonc","utf8"))).d1_databases?.[0];
          const stg=JSON.parse(strip(fs.readFileSync("wrangler.preview-migrations.jsonc","utf8"))).d1_databases?.[0];
          const exact=[
            req.request_id==="staging-legacy-version-binding-2026-10-11",
            req.target==="ai-advokat-db-staging",
            req.target_database_id==="eb560e98-9fc0-408e-9c81-9b823ffde44d",
            req.production_database_id==="12ece285-74bb-4f27-a025-2dbd1be6c59a",
            req.production_allowed===false,
            req.current_law_promotion===false,
            req.human_gate_promotion===false,
            JSON.stringify(req.scope)===JSON.stringify(["mk:zi","mk:zro","mk:zkp"]),
            JSON.stringify(req.migrations)===JSON.stringify([
              "0024_zi_legacy_version_backfill.sql",
              "0025_zro_legacy_version_backfill.sql",
              "0026_zkp_legacy_version_backfill.sql"
            ])
          ];
          if(exact.some(x=>!x)) throw new Error("Activation request mismatch");
          if(!stg || stg.binding!=="PREVIEW_DB" || stg.database_name!=="ai-advokat-db-staging" || stg.database_id!==req.target_database_id) throw new Error("Unexpected staging identity");
          if(!prod || prod.database_id!==req.production_database_id) throw new Error("Unexpected production identity");
          if(stg.database_id===prod.database_id) throw new Error("Staging/production collision");
          console.log("ACTIVATION + D1 IDENTITY GATE: PASS");
          NODE

      - name: Preflight migration state
        shell: bash
        run: |
          set -euo pipefail
          APPLIED="$(npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --json --command "SELECT GROUP_CONCAT(version, ',') AS v FROM schema_migrations WHERE version IN ('24','25','26');" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].results[0].v||"")})')"
          V23="$(npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --json --command "SELECT COUNT(*) AS c FROM schema_migrations WHERE version='23';" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].results[0].c)})')"
          test "$APPLIED" = ""
          test "$V23" = "1"
          echo "MIGRATION STATE GATE: PASS"

      - name: Preflight exact legacy snapshots
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT li.canonical_key,
                      COUNT(lav.id) AS article_count,
                      SUM(CASE WHEN lav.instrument_version_id IS NULL AND lav.id IS NOT NULL THEN 1 ELSE 0 END) AS null_count,
                      COUNT(DISTINCT lav.instrument_version_id) AS bound_versions,
                      COUNT(DISTINCT lav.source_url) AS url_count,
                      MIN(lav.source_url) AS source_url,
                      COUNT(DISTINCT lav.source_sha256) AS hash_count,
                      MIN(lav.source_sha256) AS source_sha256
                 FROM legal_instruments li
                 LEFT JOIN legal_article_versions lav ON lav.instrument_id=li.id
                WHERE li.canonical_key IN ('mk:zi','mk:zro','mk:zkp')
                GROUP BY li.canonical_key ORDER BY li.canonical_key;"
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --json --command "$SQL" > /tmp/pre.json
          node <<'NODE'
          const fs=require("fs");
          const rows=JSON.parse(fs.readFileSync("/tmp/pre.json","utf8"))[0].results;
          const by=new Map(rows.map(r=>[r.canonical_key,r]));
          const e={
            "mk:zi":[258,"https://portal.mdt.gov.mk/post-body-files/zakoni-izvrsuvanje-file-zhwP.pdf","15d8b0961d1beb1b5bc7de8f43d4b6ff4c1d79cdc46b241e829530039eefaa55"],
            "mk:zro":[298,"https://portal.mdt.gov.mk/post-body-files/zakoni-met-file-LaRm.pdf","f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655"],
            "mk:zkp":[570,"https://glasprotivnasilstvo.org.mk/wp-content/uploads/2020/10/ZAKON-ZA-KRIVICHNATA-POSTAPKA.pdf","e6bf4588833752695a9b776b473ed9d504264effdfcd7917b8d6655bcfacaf45"]
          };
          for(const [k,[count,url,sha]] of Object.entries(e)){
            const r=by.get(k);
            if(!r) throw new Error(k+" missing");
            if(Number(r.article_count)!==count || Number(r.null_count)!==count || Number(r.bound_versions)!==0) throw new Error(k+" row/binding mismatch");
            if(Number(r.url_count)!==1 || r.source_url!==url) throw new Error(k+" source URL drift");
            if(Number(r.hash_count)!==1 || r.source_sha256!==sha) throw new Error(k+" source hash drift");
          }
          console.log("EXACT LEGACY SNAPSHOT GATE: PASS");
          NODE

      - name: Apply migration 0024 to STAGING only
        run: npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --file migrations/0024_zi_legacy_version_backfill.sql

      - name: Verify ZI binding before continuing
        shell: bash
        run: |
          C="$(npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --json --command "SELECT COUNT(*) AS c FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zi') AND instrument_version_id=(SELECT id FROM instrument_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zi') AND version_label='official-editorial-consolidated-through-154/2023');" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].results[0].c)})')"
          N="$(npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --json --command "SELECT COUNT(*) AS c FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zi') AND instrument_version_id IS NULL;" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].results[0].c)})')"
          test "$C" = "258"
          test "$N" = "0"

      - name: Apply migration 0025 to STAGING only
        run: npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --file migrations/0025_zro_legacy_version_backfill.sql

      - name: Verify ZRO binding before continuing
        shell: bash
        run: |
          C="$(npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --json --command "SELECT COUNT(*) AS c FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') AND instrument_version_id=(SELECT id FROM instrument_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') AND version_label='official-consolidated-snapshot-through-111/2023');" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].results[0].c)})')"
          N="$(npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --json --command "SELECT COUNT(*) AS c FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') AND instrument_version_id IS NULL;" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].results[0].c)})')"
          test "$C" = "298"
          test "$N" = "0"

      - name: Apply migration 0026 to STAGING only
        run: npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --file migrations/0026_zkp_legacy_version_backfill.sql

      - name: Final staging postflight
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --json --command "SELECT li.canonical_key,
            COUNT(lav.id) AS article_count,
            SUM(CASE WHEN lav.instrument_version_id IS NULL AND lav.id IS NOT NULL THEN 1 ELSE 0 END) AS null_count,
            COUNT(DISTINCT lav.instrument_version_id) AS bound_versions,
            MAX(COALESCE(v.is_current,0)) AS max_current,
            SUM(CASE WHEN v.human_review_status='approved' THEN 1 ELSE 0 END) AS approved_rows,
            SUM(CASE WHEN lav.status='current_consolidated' THEN 1 ELSE 0 END) AS current_consolidated_rows,
            MIN(v.version_class) AS version_class
          FROM legal_instruments li
          LEFT JOIN legal_article_versions lav ON lav.instrument_id=li.id
          LEFT JOIN instrument_versions v ON v.id=lav.instrument_version_id
          WHERE li.canonical_key IN ('mk:zi','mk:zro','mk:zkp')
          GROUP BY li.canonical_key ORDER BY li.canonical_key;" > /tmp/post.json

          node <<'NODE'
          const fs=require("fs");
          const rows=JSON.parse(fs.readFileSync("/tmp/post.json","utf8"))[0].results;
          const expected={
            "mk:zi":{n:258,cls:"dated_snapshot"},
            "mk:zro":{n:298,cls:"dated_snapshot"},
            "mk:zkp":{n:570,cls:"reference_consolidation"}
          };
          for(const r of rows){
            const e=expected[r.canonical_key];
            if(!e) continue;
            if(Number(r.article_count)!==e.n || Number(r.null_count)!==0 || Number(r.bound_versions)!==1) throw new Error(r.canonical_key+" binding postflight failed");
            if(Number(r.max_current)!==0 || Number(r.approved_rows)!==0 || Number(r.current_consolidated_rows)!==0) throw new Error(r.canonical_key+" legal-status promotion detected");
            if(r.version_class!==e.cls) throw new Error(r.canonical_key+" version class mismatch");
          }
          if(rows.length!==3) throw new Error("Expected exactly three target corpus rows");
          console.log("STAGING VERSION BINDING POSTFLIGHT: PASS");
          NODE

          M="$(npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --json --command "SELECT COUNT(*) AS c FROM schema_migrations WHERE version IN ('24','25','26');" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].results[0].c)})')"
          test "$M" = "3"
          echo "MIGRATIONS 24-26 RECORDED: PASS"
          echo "PRODUCTION DATABASE WAS NOT TARGETED."
