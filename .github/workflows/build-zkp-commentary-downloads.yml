name: Build ZKP commentary downloads

on:
  push:
    paths:
      - "scripts/build-zkp-commentary-downloads.py"
      - ".github/workflows/build-zkp-commentary-downloads.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document tools
        run: |
          python -m pip install --disable-pip-version-check python-docx
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer
          fi

      - name: Build DOCX
        run: python scripts/build-zkp-commentary-downloads.py

      - name: Build PDF
        run: |
          mkdir -p guides/zkp-commentary-usage/downloads
          libreoffice --headless --convert-to pdf --outdir guides/zkp-commentary-usage/downloads guides/zkp-commentary-usage/downloads/*.docx
          test "$(find guides/zkp-commentary-usage/downloads -maxdepth 1 -name '*.docx' | wc -l)" -eq 4
          test "$(find guides/zkp-commentary-usage/downloads -maxdepth 1 -name '*.pdf' | wc -l)" -eq 4
          find guides/zkp-commentary-usage/downloads -maxdepth 1 -type f -size +10k -print

      - name: Commit downloads
        run: |
          git config user.name "ai-advokat-doc-builder"
          git config user.email "aiadvokat16@gmail.com"
          git add guides/zkp-commentary-usage/downloads
          if git diff --cached --quiet; then
            echo "No document changes."
            exit 0
          fi
          git commit -m "Publish ZKP commentary PDF and DOCX downloads"
          git push
