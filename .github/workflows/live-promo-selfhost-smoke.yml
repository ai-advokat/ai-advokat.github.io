name: Live promo self-host smoke

on:
  push:
    paths:
      - ".github/workflows/live-promo-selfhost-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live page uses self-hosted promo
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -L --fail --silent --show-error --max-time 30 \
              'https://ai-advokat.github.io/' -o /tmp/index.html; then
              if grep -q '/assets/ai-advokat-official-promo.mp4' /tmp/index.html \
                && ! grep -q 'share.descript.com/view/Qa1ysVFxdFJ' /tmp/index.html; then
                break
              fi
            fi
            if [ "$i" -eq 12 ]; then
              echo "Live page did not converge to the self-hosted promo build." >&2
              exit 1
            fi
            sleep 5
          done

          curl -L --fail --silent --show-error --max-time 30 \
            --range 0-2047 \
            'https://ai-advokat.github.io/assets/ai-advokat-official-promo.mp4' \
            -o /tmp/promo-head.bin
          test -s /tmp/promo-head.bin
          echo "LIVE_PROMO_SELFHOST_PASS"
