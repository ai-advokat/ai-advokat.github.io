name: ZKP staging preflight

on:
  push:
    branches:
      - zkp-corpus-v1-30sep2026
    paths:
      - ".github/workflows/zkp-staging-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read-only staging migration state
        shell: bash
        run: |
          npx wrangler d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc | tee /tmp/pending.txt
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE '%migration%' OR name='d1_migrations') ORDER BY name; SELECT version,description FROM schema_migrations WHERE CAST(version AS INTEGER)>=14 ORDER BY CAST(version AS INTEGER); SELECT canonical_key,title,current_status,human_review_status FROM legal_instruments WHERE canonical_key IN ('mk:zro','mk:zkp') ORDER BY canonical_key;"             | tee /tmp/state.txt
          echo "PREFLIGHT COMPLETE"
      - uses: actions/upload-artifact@v4
        with:
          name: zkp-staging-preflight
          retention-days: 14
          path: |
            /tmp/pending.txt
            /tmp/state.txt
