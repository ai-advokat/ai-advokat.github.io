        uses: actions/upload-artifact@v4
        with:
          name: zkp-staging-import-evidence
          retention-days: 14
          path: |
            /tmp/pending.txt
            /tmp/zkp-instrument.txt
            /tmp/zkp-pdfinfo.txt
            /tmp/zkp.sha256
            /tmp/zkp-clean-report.json
            /tmp/zkp-manifest.json
            /tmp/zkp-readback.txt
            /tmp/article-count.txt
