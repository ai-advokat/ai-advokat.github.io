name: Zoran standalone bot production runtime deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_ZORAN_BOT_RUNTIME"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-advokat-zoran-bot-runtime-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Block production deploy on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify explicit bounded deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY_ZORAN_BOT_RUNTIME"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "BOUNDED ZORAN BOT RUNTIME DEPLOY: AUTHORIZED BY MANUAL DISPATCH + PRODUCTION HUMAN GATE"

      - name: Verify standalone bot runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check assets/standalone-bot.js
          node --test test/standalone-bot.test.mjs
          node <<'NODE'
          const fs=require("fs");
          const source=fs.readFileSync("src/index.js","utf8");
          if(!source.includes('"/api/bot"')) throw new Error("/api/bot route is missing");
          if(!source.includes("bot_membership_required")) throw new Error("membership fail-closed contract is missing");
          const cfg=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const db=cfg.d1_databases?.[0];
          if(cfg.name!=="ai-advokat-github-io") throw new Error("Unexpected Worker name");
          if(!db || db.binding!=="DB" || db.database_name!=="ai-advokat-db" || db.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production DB target");
          console.log("ZORAN BOT RUNTIME CONTRACT: PASS");
          NODE

      - name: Deploy current Worker runtime only
        run: npx wrangler deploy --config wrangler.jsonc | tee /tmp/zoran-bot-runtime-deploy.txt

      - name: Verify live health and fail-closed bot route without provider call
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl --fail --retry 5 --retry-delay 2 "$BASE/api/health" | tee /tmp/zoran-bot-health.json
          grep -q '"ok": true' /tmp/zoran-bot-health.json

          code="$(curl --silent --show-error --output /tmp/zoran-bot-unauth.json --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"q":"Здраво"}' \
            "$BASE/api/bot")"
          test "$code" = "401"
          grep -q 'bot_membership_required' /tmp/zoran-bot-unauth.json
          echo "LIVE /api/bot ROUTE: PRESENT · MEMBERSHIP FAIL-CLOSED · PROVIDER NOT CALLED"

      - name: Upload non-secret deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoran-bot-runtime-production-evidence
          retention-days: 14
          path: |
            /tmp/zoran-bot-runtime-deploy.txt
            /tmp/zoran-bot-health.json
            /tmp/zoran-bot-unauth.json
