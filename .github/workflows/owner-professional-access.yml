name: AI Advokat owner professional access

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/provision-owner-professional-access.sql"
      - ".github/workflows/owner-professional-access.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-advokat-owner-professional-access
  cancel-in-progress: false

jobs:
  provision:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Fail closed if production credentials are missing
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Verify exact production D1 target
        run: |
          node <<'NODE'
          const fs=require("fs");
          const cfg=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const db=cfg.d1_databases?.[0];
          if(cfg.name!=="ai-advokat-github-io") throw new Error("Unexpected Worker");
          if(!db || db.binding!=="DB" || db.database_name!=="ai-advokat-db") throw new Error("Unexpected D1 target");
          if(db.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production DB ID");
          NODE
      - name: Verify membership schema exists
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('membership_accounts','membership_entitlements','membership_access_keys','membership_usage_monthly') ORDER BY name;" | tee /tmp/membership-schema.txt
          for t in membership_accounts membership_entitlements membership_access_keys membership_usage_monthly; do grep -q "\"name\": \"$t\"" /tmp/membership-schema.txt; done
      - name: Provision owner professional entitlement
        run: npx wrangler d1 execute DB --remote --config wrangler.jsonc --file scripts/provision-owner-professional-access.sql
      - name: Verify non-secret entitlement state
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT a.id,a.status,e.plan_code,e.status AS entitlement_status,e.monthly_quota,e.seat_limit,k.key_prefix,k.status AS key_status FROM membership_accounts a JOIN membership_entitlements e ON e.account_id=a.id JOIN membership_access_keys k ON k.account_id=a.id WHERE a.id='owner-professional' AND k.id='key-owner-professional-primary';" | tee /tmp/owner-access.txt
          grep -q '"plan_code": "office"' /tmp/owner-access.txt
          grep -q '"monthly_quota": 1000000' /tmp/owner-access.txt
          grep -q '"key_status": "active"' /tmp/owner-access.txt
      - name: Upload non-secret evidence
        uses: actions/upload-artifact@v4
        with:
          name: owner-professional-access-evidence
          retention-days: 14
          path: |
            /tmp/membership-schema.txt
            /tmp/owner-access.txt
