name: Dependency security audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies without scripts
        run: npm install --ignore-scripts --no-fund

      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high
