name: Supreme Court case-law intake

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum public decisions in this run"
        required: true
        default: "50"
        type: choice
        options:
          - "50"
          - "100"
      mode:
        description: "Discovery only, or bounded retrieval + metadata staging"
        required: true
        default: "discovery"
        type: choice
        options:
          - discovery
          - policy-evidence
          - execute

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use Python 3
        if: inputs.mode == 'execute'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic document extractors
        if: inputs.mode == 'execute'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils antiword unrtf
          pdftotext -v
          antiword -h >/dev/null 2>&1 || true
          unrtf --version

      - name: Validate requested limit
        shell: bash
        run: |
          case "${{ inputs.limit }}" in
            50|100) ;;
            *) echo "Unsupported limit"; exit 2 ;;
          esac

      - name: Discovery
        if: inputs.mode == 'discovery'
        run: node scripts/collect-and-stage-mk-supreme-decisions.mjs --limit "${{ inputs.limit }}" --dry-run

      - name: Capture rights and robots evidence
        if: inputs.mode == 'policy-evidence'
        run: node scripts/capture-mk-supreme-rights-evidence.mjs

      - name: Verify Human Gate retrieval approval
        if: inputs.mode == 'execute'
        shell: bash
        run: |
          test -f data/mk-supreme-rights-review.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("data/mk-supreme-rights-review.json","utf8"));if(x.source_id!=="mk-supreme-court"||x.approved_for_bounded_automated_retrieval!==true||!x.reviewed_on||!x.reviewed_by||!x.basis){process.exit(2)}'

      - name: Bounded retrieval and metadata staging
        if: inputs.mode == 'execute'
        run: node scripts/collect-and-stage-mk-supreme-decisions.mjs --limit "${{ inputs.limit }}" --execute --rights-review data/mk-supreme-rights-review.json

      - name: Verify staged outputs remain fail-closed
        if: inputs.mode == 'execute'
        shell: bash
        run: |
          test -n "$(find work/mk-supreme-decisions -name case-law-review.ndjson -print -quit)"
          node -e 'const fs=require("fs"),path=require("path");function walk(d){for(const n of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,n.name);if(n.isDirectory())walk(p);else if(n.name==="case-law-review.ndjson"){for(const line of fs.readFileSync(p,"utf8").trim().split(/\n/)){const r=JSON.parse(line);if(r.type==="case_law_case"&&(r.production_eligible!==false||r.human_gate_required!==true||r.official_binding_verified!==false))process.exit(2)}}}}walk("work/mk-supreme-decisions");'

      - name: Upload intake artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk-supreme-case-law-intake-${{ github.run_id }}
          path: |
            work/mk-supreme-decisions/
            work/mk-supreme-rights/
          if-no-files-found: warn
          retention-days: 14
