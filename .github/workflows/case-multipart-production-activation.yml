name: AI Advokat protected large case upload activation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ACTIVATE_CASE_MULTIPART_500MB"
        required: true
        type: string
  push:
    branches: ["main"]
    paths:
      - ".github/activation/case-multipart-500mb-production-request.json"
      - ".github/workflows/case-multipart-production-activation.yml"

permissions:
  contents: read

concurrency:
  group: ai-advokat-case-multipart-production
  cancel-in-progress: false

jobs:
  activate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify bounded activation authorization
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "ACTIVATE_CASE_MULTIPART_500MB"
          fi
          node <<'NODE'
          const fs=require("fs");
          const crypto=require("crypto");
          const p=".github/activation/case-multipart-500mb-production-request.json";
          const raw=fs.readFileSync(p);
          const sha=crypto.createHash("sha256").update(raw).digest("hex");
          const expected="eb2937b4f734cc1ff76c8103d7e37f57f5c6d96dd39512b3417276fb5fcb1ff4";
          if(sha!==expected) throw new Error("Activation request fingerprint changed: "+sha);
          const d=JSON.parse(raw);
          if(d.activation_authorized!==true) throw new Error("Activation not authorised");
          if(d.decision_id!=="AI_ADVOKAT_CASE_MULTIPART_500MB_V1_2026-10-14") throw new Error("Unexpected decision id");
          if(d.runtime_version!=="case-multipart-500mb-1.0.0") throw new Error("Unexpected runtime version");
          if(d.migration!=="0044_case_multipart_uploads.sql") throw new Error("Unexpected migration");
          if(d.max_file_bytes!==524288000 || d.part_size_bytes!==8388608 || d.max_parts!==64) throw new Error("Unexpected multipart bounds");
          if(d.private_case_only!==true || d.human_gate_required!==true) throw new Error("Private/Human Gate boundary missing");
          if(d.public_corpus_promotion_authorized!==false) throw new Error("Corpus promotion must remain forbidden");
          if(d.autonomous_legal_action_authorized!==false) throw new Error("Autonomous legal action must remain forbidden");
          const gates=new Set(d.authorized_gates||[]);
          for(const g of ["github_merge","production_schema_migration","production_runtime_deploy"]){
            if(!gates.has(g)) throw new Error("Missing authorised gate: "+g);
          }
          console.log("Bounded 500 MB activation artifact: PASS");
          NODE
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify repository contracts
        run: |
          node --check src/index.js
          node --check src/case-workspace.js
          node --check assets/casepilot-workspace-ui.js
          npm run test:casepilot-private-storage
          npm run test:casepilot-workspace-ui
          npm run test:case-workspace

      - name: Verify exact production target
        run: |
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(c.name!=="ai-advokat-github-io") throw new Error("Unexpected Worker");
          if(!d || d.binding!=="DB" || d.database_name!=="ai-advokat-db" || d.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production D1");
          if(c.previews?.d1_databases?.[0]?.database_id===d.database_id) throw new Error("Production/staging collision");
          NODE

      - name: Inspect pending production migrations
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/case-multipart-pending.txt
          found="$(grep -Eo '00[0-9]{2}_[A-Za-z0-9_.-]+\.sql' /tmp/case-multipart-pending.txt | sort -u || true)"
          unexpected="$(printf '%s\n' "$found" | grep -v '^0044_case_multipart_uploads\.sql$' | sed '/^$/d' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected pending migrations:"
            echo "$unexpected"
            exit 1
          fi
          grep -q '0044_case_multipart_uploads.sql' /tmp/case-multipart-pending.txt

      - name: Apply reviewed migration 0044
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Verify multipart schema
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT version,description FROM schema_migrations WHERE version='44'; PRAGMA table_info(case_multipart_uploads); PRAGMA table_info(case_multipart_parts);" | tee /tmp/case-multipart-schema.txt
          grep -q '"version": "44"' /tmp/case-multipart-schema.txt
          for col in expected_size part_size total_parts integrity_manifest_sha256 expires_at; do grep -q "\"name\": \"$col\"" /tmp/case-multipart-schema.txt; done
          for forbidden in document_bytes file_bytes extracted_text document_text ocr_text; do
            if grep -q "\"name\": \"$forbidden\"" /tmp/case-multipart-schema.txt; then
              echo "Forbidden private-content column in D1: $forbidden"
              exit 1
            fi
          done

      - name: Deploy Worker with protected multipart runtime
        run: npx wrangler deploy --config wrangler.jsonc | tee /tmp/case-multipart-deploy.txt

      - name: Verify live public boundary
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl --fail --silent --show-error "$BASE/api/capabilities" -o /tmp/capabilities.json
          code="$(curl --silent --show-error --output /tmp/unauth.json --write-out '%{http_code}' "$BASE/api/cases")"
          test "$code" = "401"
          node <<'NODE'
          const u=require("/tmp/unauth.json");
          if(u.error!=="case_workspace_membership_required") throw new Error("Case isolation failed");
          console.log("PROTECTED LARGE CASE UPLOAD BOUNDARY: PASS");
          NODE

      - name: Upload activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-advokat-case-multipart-500mb-activation
          retention-days: 30
          path: |
            /tmp/case-multipart-pending.txt
            /tmp/case-multipart-schema.txt
            /tmp/case-multipart-deploy.txt
            /tmp/capabilities.json
            /tmp/unauth.json
