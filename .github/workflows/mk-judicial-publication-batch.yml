name: MK judicial publication batch review

on:
  push:
    branches:
      - main
    paths:
      - "data/case-law/mk-judicial-publications-batch-2026-10-31/**"
      - "data/case-law/mk-appellate-publications-batch-2026-10-31-b2/**"
      - "data/case-law/mk-judicial-reference-batch-2026-10-31-b3/**"
      - "data/case-law/mk-historical-direct-case-law-2026-10-31-b4/**"
      - "data/case-law/mk-historical-direct-case-law-2026-10-31-b5/**"
      - "data/case-law/mk-historical-direct-case-law-2026-10-31-b6/**"
      - "data/case-law/mk-historical-direct-case-law-2026-10-31-b7/**"
      - "data/case-law/mk-historical-direct-case-law-2026-10-31-b8/**"
      - "data/case-law/mk-historical-direct-case-law-2026-10-31-b9/**"
      - "data/case-law/mk-historical-direct-case-law-2026-10-31-b10/**"
      - "data/case-law/mk-historical-direct-case-law-2026-10-31-b11/**"
      - "data/case-law/mk-historical-direct-case-law-2026-10-31-b12/**"
      - "data/case-law/mk-historical-direct-case-law-2026-10-31-b13/**"
      - "data/case-law-source-registry-2026.json"
      - "scripts/validate-mk-judicial-publication-batch.mjs"
      - "scripts/validate-mk-appellate-publication-batch.mjs"
      - "scripts/validate-mk-judicial-reference-batch.mjs"
      - "scripts/validate-mk-historical-direct-case-law-b4.mjs"
      - "scripts/validate-mk-historical-direct-case-law-b5.mjs"
      - "scripts/validate-mk-historical-direct-case-law-b6.mjs"
      - "scripts/validate-mk-historical-direct-case-law-b7.mjs"
      - "scripts/validate-mk-historical-direct-case-law-b8.mjs"
      - "scripts/validate-mk-historical-direct-case-law-b9.mjs"
      - "scripts/validate-mk-historical-direct-case-law-b10.mjs"
      - "scripts/validate-mk-historical-direct-case-law-b11.mjs"
      - "scripts/validate-mk-historical-direct-case-law-b12.mjs"
      - "scripts/validate-mk-historical-direct-case-law-b13.mjs"
      - ".github/workflows/mk-judicial-publication-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed judicial publication batch
        run: node scripts/validate-mk-judicial-publication-batch.mjs data/case-law/mk-judicial-publications-batch-2026-10-31
      - name: Validate governed appellate publication batch B2
        run: node scripts/validate-mk-appellate-publication-batch.mjs data/case-law/mk-appellate-publications-batch-2026-10-31-b2
      - name: Validate governed judicial reference batch B3
        run: node scripts/validate-mk-judicial-reference-batch.mjs data/case-law/mk-judicial-reference-batch-2026-10-31-b3
      - name: Validate historical direct case-law batch B4
        run: node scripts/validate-mk-historical-direct-case-law-b4.mjs data/case-law/mk-historical-direct-case-law-2026-10-31-b4
      - name: Validate historical direct case-law batch B5
        run: node scripts/validate-mk-historical-direct-case-law-b5.mjs data/case-law/mk-historical-direct-case-law-2026-10-31-b5
      - name: Validate historical direct case-law batch B6
        run: node scripts/validate-mk-historical-direct-case-law-b6.mjs data/case-law/mk-historical-direct-case-law-2026-10-31-b6
      - name: Validate historical direct case-law batch B7
        run: node scripts/validate-mk-historical-direct-case-law-b7.mjs data/case-law/mk-historical-direct-case-law-2026-10-31-b7
      - name: Validate historical direct case-law batch B8
        run: node scripts/validate-mk-historical-direct-case-law-b8.mjs data/case-law/mk-historical-direct-case-law-2026-10-31-b8
      - name: Validate historical direct case-law batch B9
        run: node scripts/validate-mk-historical-direct-case-law-b9.mjs data/case-law/mk-historical-direct-case-law-2026-10-31-b9
      - name: Validate historical direct case-law batch B10
        run: node scripts/validate-mk-historical-direct-case-law-b10.mjs data/case-law/mk-historical-direct-case-law-2026-10-31-b10
      - name: Validate historical direct case-law batch B11
        run: node scripts/validate-mk-historical-direct-case-law-b11.mjs data/case-law/mk-historical-direct-case-law-2026-10-31-b11
      - name: Validate historical direct case-law batch B12
        run: node scripts/validate-mk-historical-direct-case-law-b12.mjs data/case-law/mk-historical-direct-case-law-2026-10-31-b12
      - name: Validate historical direct case-law batch B13
        run: node scripts/validate-mk-historical-direct-case-law-b13.mjs data/case-law/mk-historical-direct-case-law-2026-10-31-b13
      - name: Existing case-law source registry regression
        run: node --test test/case-law-source-registry.test.mjs
      - name: Existing case-law chat gate regression
        run: node --test test/case-law-chat-context.test.mjs
      - name: Human Gate metadata artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mk-judicial-publications-2026-10-31
          path: |
            data/case-law/mk-judicial-publications-batch-2026-10-31/**
            data/case-law/mk-appellate-publications-batch-2026-10-31-b2/**
            data/case-law/mk-judicial-reference-batch-2026-10-31-b3/**
            data/case-law/mk-historical-direct-case-law-2026-10-31-b4/**
            data/case-law/mk-historical-direct-case-law-2026-10-31-b5/**
            data/case-law/mk-historical-direct-case-law-2026-10-31-b6/**
            data/case-law/mk-historical-direct-case-law-2026-10-31-b7/**
            data/case-law/mk-historical-direct-case-law-2026-10-31-b8/**
            data/case-law/mk-historical-direct-case-law-2026-10-31-b9/**
            data/case-law/mk-historical-direct-case-law-2026-10-31-b10/**
            data/case-law/mk-historical-direct-case-law-2026-10-31-b11/**
            data/case-law/mk-historical-direct-case-law-2026-10-31-b12/**
            data/case-law/mk-historical-direct-case-law-2026-10-31-b13/**
          retention-days: 30
