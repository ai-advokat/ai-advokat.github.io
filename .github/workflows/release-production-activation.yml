name: AI Advokat release production activation

on:
  push:
    branches:
      - release-zro-membership-app-30sep2026
    paths:
      - ".github/workflows/release-production-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-advokat-release-production-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Fail closed if Cloudflare credentials are missing
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify release and exact production target
        shell: bash
        run: |
          node --check src/index.js
          npm run verify
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(c.name!=="ai-advokat-github-io") throw new Error("Unexpected Worker name");
          if(!d || d.binding!=="DB" || d.database_name!=="ai-advokat-db" || d.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") {
            throw new Error("Unexpected production D1 target");
          }
          const preview=c.previews?.d1_databases?.[0];
          if(preview?.database_id===d.database_id) throw new Error("Production/staging collision");
          console.log("EXACT PRODUCTION TARGET: PASS");
          NODE

      - name: Guard exact partial production state
        shell: bash
        run: |
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/pending.txt
          found="$(grep -Eo '001[0-9]+_[A-Za-z0-9_.-]+\.sql' /tmp/pending.txt | sort -u)"
          expected="$(printf '%s\n' \
            0014_stable_instrument_keys.sql \
            0015_amendment_event_provenance.sql \
            0016_article_version_candidates.sql \
            0017_membership_v1.sql)"
          test "$found" = "$expected"

          npx wrangler d1 execute DB --remote --config wrangler.jsonc \
            --command "PRAGMA table_info(legal_instruments); SELECT COUNT(*) AS zro_title_count FROM legal_instruments WHERE title='Закон за работните односи'; SELECT COUNT(*) AS article_count FROM legal_article_versions;" \
            | tee /tmp/prestate.txt

          ! grep -q '"name": "canonical_key"' /tmp/prestate.txt
          grep -q '"zro_title_count": 0' /tmp/prestate.txt
          grep -q '"article_count": 0' /tmp/prestate.txt
          echo "PARTIAL PRODUCTION STATE: PASS"

      - name: Apply migrations 0014 through 0017
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Verify production schema and membership tables
        shell: bash
        run: |
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/pending-after.txt
          if grep -Eq '001[4-7]_[A-Za-z0-9_.-]+\.sql' /tmp/pending-after.txt; then
            echo "Unexpected pending release migration"
            exit 1
          fi

          npx wrangler d1 execute DB --remote --config wrangler.jsonc \
            --command "SELECT version,description FROM schema_migrations WHERE CAST(version AS INTEGER) BETWEEN 14 AND 17 ORDER BY CAST(version AS INTEGER); SELECT id,canonical_key,title,current_status,human_review_status FROM legal_instruments WHERE canonical_key='mk:zro'; SELECT name FROM sqlite_master WHERE type='table' AND name IN ('legal_article_versions','legal_article_version_candidates','membership_accounts','membership_entitlements','membership_access_keys','membership_usage_monthly','membership_requests','membership_payments') ORDER BY name;" \
            | tee /tmp/schema-verify.txt

          for v in 14 15 16 17; do grep -q "\"version\": \"$v\"" /tmp/schema-verify.txt; done
          grep -q '"canonical_key": "mk:zro"' /tmp/schema-verify.txt
          for t in legal_article_versions legal_article_version_candidates membership_accounts membership_entitlements membership_access_keys membership_usage_monthly membership_requests membership_payments; do
            grep -q "\"name\": \"$t\"" /tmp/schema-verify.txt
          done
          echo "RELEASE SCHEMA: PASS"

      - name: Download and verify official ZRO snapshot
        shell: bash
        run: |
          set -euo pipefail
          URL="https://portal.mdt.gov.mk/post-body-files/zakoni-met-file-LaRm.pdf"
          curl --fail --location --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 120 \
            --user-agent "AI-Advokat-Official-Source-Audit/1.0" \
            "$URL" -o /tmp/zro-2023.pdf
          test -s /tmp/zro-2023.pdf
          head -c 5 /tmp/zro-2023.pdf | grep -q "%PDF-"
          pdfinfo /tmp/zro-2023.pdf | tee /tmp/zro-pdfinfo.txt
          grep -Eq "^Pages:[[:space:]]+108$" /tmp/zro-pdfinfo.txt
          SHA="$(sha256sum /tmp/zro-2023.pdf | cut -d' ' -f1)"
          test "$SHA" = "f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655"
          echo "$SHA" > /tmp/zro.sha256
          echo "OFFICIAL ZRO PDF: PASS"

      - name: Extract and parse 298 ZRO articles
        shell: bash
        run: |
          pdftotext -layout /tmp/zro-2023.pdf /tmp/zro-raw.txt
          node scripts/clean-official-legal-pdf-text.mjs \
            /tmp/zro-raw.txt /tmp/zro-clean.txt /tmp/zro-extraction-report.json

          cat > /tmp/zro-meta.json <<'EOF'
          {
            "instrument_key": "mk:zro",
            "instrument_title": "Закон за работните односи",
            "version_id": "official-consolidated-snapshot-2023-111",
            "source_url": "https://portal.mdt.gov.mk/post-body-files/zakoni-met-file-LaRm.pdf",
            "source_sha256": "f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655",
            "source_issue_number": "through-111/2023",
            "source_issue_date": "2023-05-30",
            "status": "historical",
            "extraction_method": "pdftotext_layout_plus_cleaner",
            "human_review_status": "pending"
          }
          EOF

          node scripts/parse-mk-legal-text.mjs /tmp/zro-clean.txt /tmp/zro-meta.json /tmp/zro.ndjson
          head -n 1 /tmp/zro.ndjson > /tmp/zro-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("/tmp/zro-manifest.json").read_text())
          assert m["article_count"] == 298, m
          assert m["warning_count"] == 0, m
          assert m["source_sha256"] == "f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655", m
          print("ZRO MANIFEST: PASS")
          PY

          node scripts/legal-ndjson-to-sql.mjs /tmp/zro.ndjson /tmp/zro-production.sql
          test -s /tmp/zro-production.sql

      - name: Import verified historical ZRO snapshot to production
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --file /tmp/zro-production.sql
          npx wrangler d1 execute DB --remote --config wrangler.jsonc \
            --command "UPDATE legal_instruments SET current_status='needs_version_review', human_review_status='pending', updated_at=CURRENT_TIMESTAMP WHERE canonical_key='mk:zro';"

      - name: Read-back verify ZRO and membership state
        shell: bash
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc \
            --command "SELECT current_status,human_review_status FROM legal_instruments WHERE canonical_key='mk:zro'; SELECT COUNT(*) AS article_count, SUM(CASE WHEN status='historical' THEN 1 ELSE 0 END) AS historical_count, SUM(CASE WHEN status='current_consolidated' THEN 1 ELSE 0 END) AS current_count, SUM(CASE WHEN human_review_status='pending' THEN 1 ELSE 0 END) AS pending_review_count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro'); SELECT article_number,article_number_normalized,status,human_review_status FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') AND article_number_normalized IN ('1','25-а','298') ORDER BY id; SELECT run_key,article_count,warning_count,status FROM corpus_ingest_runs WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro') ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS membership_request_count FROM membership_requests;" \
            | tee /tmp/readback.txt

          grep -q '"current_status": "needs_version_review"' /tmp/readback.txt
          grep -q '"article_count": 298' /tmp/readback.txt
          grep -q '"historical_count": 298' /tmp/readback.txt
          grep -q '"current_count": 0' /tmp/readback.txt
          grep -q '"pending_review_count": 298' /tmp/readback.txt
          grep -q '"warning_count": 0' /tmp/readback.txt
          grep -q '"status": "validated"' /tmp/readback.txt
          echo "PRODUCTION ZRO READ-BACK: PASS"

      - name: Deploy production Worker and static app assets
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Live production smoke tests
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"

          curl --fail --retry 5 --retry-delay 3 "$BASE/api/health" | tee /tmp/live-health.json
          grep -q '"ok": true' /tmp/live-health.json

          curl --fail --retry 5 --retry-delay 3 "$BASE/api/articles?instrument=mk%3Azro&limit=1" | tee /tmp/live-articles.json
          grep -q '"canonicalKey": "mk:zro"' /tmp/live-articles.json
          grep -q '"total": 298' /tmp/live-articles.json

          curl --fail --retry 5 --retry-delay 3 \
            -H 'content-type: application/json' \
            -d '{"q":"Што предвидува член 1?","instrument":"mk:zro"}' \
            "$BASE/api/assistant" | tee /tmp/live-assistant.json
          grep -q '"ok": true' /tmp/live-assistant.json
          grep -q '"articleNumber": "1"' /tmp/live-assistant.json

          curl --fail --retry 5 --retry-delay 3 "$BASE/api/membership/plans" | tee /tmp/live-membership.json
          grep -q '"monthlyPriceMkd": 199' /tmp/live-membership.json
          grep -q '"monthlyPriceMkd": 399' /tmp/live-membership.json
          grep -q '"monthlyPriceMkd": 999' /tmp/live-membership.json

          curl --fail --retry 5 --retry-delay 3 "$BASE/manifest.webmanifest" | tee /tmp/live-manifest.json
          grep -q '"name": "AI Advokat"' /tmp/live-manifest.json

          echo "LIVE PRODUCTION SMOKE TESTS: PASS"

      - name: Upload production activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-advokat-release-production-activation
          retention-days: 30
          path: |
            /tmp/pending.txt
            /tmp/prestate.txt
            /tmp/pending-after.txt
            /tmp/schema-verify.txt
            /tmp/zro-pdfinfo.txt
            /tmp/zro.sha256
            /tmp/zro-manifest.json
            /tmp/zro-extraction-report.json
            /tmp/readback.txt
            /tmp/live-health.json
            /tmp/live-articles.json
            /tmp/live-assistant.json
            /tmp/live-membership.json
            /tmp/live-manifest.json
