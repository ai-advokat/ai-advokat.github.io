name: Zoki R26 isolated translator hotfix acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - src/index.js
      - translator.html
      - assets/zoki-translator-direct-r26.js
      - bot/index.html
      - index.html
      - test/ui-translation-runtime-r7.test.mjs
      - test/zoki-r26-isolated-hotfix.test.mjs
      - scripts/zoki-r26-translator-browser.mjs
      - .github/workflows/zoki-r26-isolated-translator.yml
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Focused Worker contract with real code and synthetic provider
        run: node --no-warnings --test test/ui-translation-runtime-r7.test.mjs test/zoki-r26-isolated-hotfix.test.mjs
      - name: Install Chromium controller
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          chrome="$(command -v google-chrome || command -v chromium || command -v google-chrome-stable || true)"
          test -n "$chrome"
          echo "BROWSER_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
      - name: Real browser MK-to-EN / EN-to-MK, error and no unpaid call tests
        run: node scripts/zoki-r26-translator-browser.mjs
