name: ZRO production schema convergence

on:
  workflow_dispatch:
  push:
    branches:
      - slvesnik-public-corpus-collector-29sep2026
    paths:
      - ".github/workflows/zro-production-schema-convergence.yml"

permissions:
  contents: read

concurrency:
  group: zro-production-schema-convergence
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify exact production target
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(!d || d.binding!=="DB" || d.database_name!=="ai-advokat-db" || d.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a"){
            throw new Error("Unexpected production target");
          }
          const preview=c.previews?.d1_databases?.[0];
          if(preview?.database_id===d.database_id) throw new Error("Production/staging collision");
          console.log("PRODUCTION TARGET: PASS");
          NODE

      - name: Guard exact pending migration set 0010-0016
        shell: bash
        run: |
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/pending.txt
          found="$(grep -Eo '001[0-9]+_[A-Za-z0-9_.-]+\.sql' /tmp/pending.txt | sort -u)"
          expected="$(printf '%s\n'             0010_macedonian_legal_source_registry.sql             0011_article_level_legal_corpus.sql             0012_case_law_authority.sql             0013_judicial_and_official_source_graph.sql             0014_stable_instrument_keys.sql             0015_amendment_event_provenance.sql             0016_article_version_candidates.sql)"
          test "$found" = "$expected"
          echo "EXACT PENDING SET: PASS"

      - name: Guard pre-migration corpus state
        shell: bash
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT COUNT(*) AS zro_title_count FROM legal_instruments WHERE title='Закон за работните односи';"             | tee /tmp/pre-zro.txt
          grep -q '"zro_title_count": 0' /tmp/pre-zro.txt

      - name: Apply migrations 0010-0016 to production
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Verify schema convergence
        shell: bash
        run: |
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/pending-after.txt
          if grep -Eq '001[0-9]+_[A-Za-z0-9_.-]+\.sql' /tmp/pending-after.txt; then
            echo "Unexpected pending 001x migration after apply"
            exit 1
          fi

          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT version,description FROM schema_migrations WHERE CAST(version AS INTEGER) BETWEEN 10 AND 16 ORDER BY CAST(version AS INTEGER); SELECT id,canonical_key,title,current_status,human_review_status FROM legal_instruments WHERE canonical_key='mk:zro'; SELECT name FROM sqlite_master WHERE type='table' AND name IN ('legal_article_versions','legal_amendment_events','legal_article_version_candidates') ORDER BY name;"             | tee /tmp/verify.txt

          for v in 10 11 12 13 14 15 16; do grep -q "\"version\": \"$v\"" /tmp/verify.txt; done
          grep -q '"canonical_key": "mk:zro"' /tmp/verify.txt
          grep -q '"current_status": "needs_version_review"' /tmp/verify.txt
          grep -q '"name": "legal_article_versions"' /tmp/verify.txt
          grep -q '"name": "legal_amendment_events"' /tmp/verify.txt
          grep -q '"name": "legal_article_version_candidates"' /tmp/verify.txt

      - name: Verify ZRO article corpus still empty
        shell: bash
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT COUNT(*) AS article_count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro'); SELECT COUNT(*) AS event_count FROM legal_amendment_events WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro');"             | tee /tmp/corpus-empty.txt
          grep -q '"article_count": 0' /tmp/corpus-empty.txt
          grep -q '"event_count": 0' /tmp/corpus-empty.txt

      - name: Assert staging target absent
        run: |
          ! grep -R "eb560e98-9fc0-408e-9c81-9b823ffde44d" /tmp/pending.txt /tmp/pre-zro.txt /tmp/verify.txt /tmp/corpus-empty.txt
          echo "STAGING TARGET ABSENT: PASS"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: zro-production-schema-convergence
          retention-days: 14
          path: |
            /tmp/pending.txt
            /tmp/pending-after.txt
            /tmp/pre-zro.txt
            /tmp/verify.txt
            /tmp/corpus-empty.txt
