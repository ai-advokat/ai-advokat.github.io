name: ZRO production resume preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify exact production target
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(!d || d.binding!=="DB" || d.database_name!=="ai-advokat-db" || d.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production target");
          console.log("PRODUCTION TARGET VERIFIED");
          NODE

      - name: Read-only pending migrations
        run: npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/pending.txt

      - name: Read-only legal_instruments columns
        run: npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "PRAGMA table_info(legal_instruments);" | tee /tmp/columns.txt

      - name: Read-only corpus tables and rows
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('legal_article_versions','legal_amendment_events','legal_article_version_candidates') ORDER BY name;"             | tee /tmp/tables.txt
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT COUNT(*) AS zro_title_count FROM legal_instruments WHERE title='Закон за работните односи'; SELECT COUNT(*) AS article_count FROM legal_article_versions;"             | tee /tmp/counts.txt

      - name: Guard expected partial state
        shell: bash
        run: |
          found="$(grep -Eo '001[0-9]+_[A-Za-z0-9_.-]+\.sql' /tmp/pending.txt | sort -u)"
          expected="$(printf '%s\n'             0014_stable_instrument_keys.sql             0015_amendment_event_provenance.sql             0016_article_version_candidates.sql)"
          test "$found" = "$expected"
          ! grep -q '"name": "canonical_key"' /tmp/columns.txt
          grep -q '"zro_title_count": 0' /tmp/counts.txt
          grep -q '"article_count": 0' /tmp/counts.txt
          echo "PARTIAL PRODUCTION STATE VERIFIED"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: zro-production-resume-preflight
          retention-days: 14
          path: |
            /tmp/pending.txt
            /tmp/columns.txt
            /tmp/tables.txt
            /tmp/counts.txt
