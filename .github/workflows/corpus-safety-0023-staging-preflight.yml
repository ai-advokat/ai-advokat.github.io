name: Corpus Safety 0023 staging preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify staging target
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const c = JSON.parse(fs.readFileSync("wrangler.preview-migrations.jsonc","utf8"));
          const d = c.d1_databases?.[0];
          if (!d) throw new Error("Missing staging D1 config");
          if (d.binding !== "PREVIEW_DB") throw new Error("Unexpected staging binding");
          if (d.database_name !== "ai-advokat-db-staging") throw new Error("Unexpected staging database");
          if (d.database_id !== "eb560e98-9fc0-408e-9c81-9b823ffde44d") throw new Error("Unexpected staging database id");
          console.log("STAGING TARGET: PASS");
          NODE

      - name: Read migration ledger
        shell: bash
        run: |
          npx wrangler d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc | tee migration-list.txt
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc \
            --command "SELECT version,description FROM schema_migrations ORDER BY CAST(version AS INTEGER);" | tee schema-versions.txt

      - name: Read duplicate article-version preflight
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc \
            --command "SELECT instrument_version_id, article_number_normalized, COUNT(*) AS duplicate_count FROM legal_article_versions WHERE instrument_version_id IS NOT NULL GROUP BY instrument_version_id, article_number_normalized HAVING COUNT(*) > 1 ORDER BY duplicate_count DESC;" | tee duplicate-version-articles.txt
          python3 - <<'PY'
          import re
          s=open("duplicate-version-articles.txt",encoding="utf-8").read()
          rows=[line for line in s.splitlines() if re.search(r'\bduplicate_count\b',line)]
          # Wrangler output formatting varies; authoritative numeric assertion is done below with COUNT wrapper.
          print("Duplicate detail query captured.")
          PY
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc \
            --command "SELECT COUNT(*) AS blocker_count FROM (SELECT 1 FROM legal_article_versions WHERE instrument_version_id IS NOT NULL GROUP BY instrument_version_id, article_number_normalized HAVING COUNT(*) > 1);" | tee duplicate-blocker-count.txt
          grep -Eq '"blocker_count"[[:space:]]*:[[:space:]]*0|blocker_count[[:space:]]*│[[:space:]]*0|blocker_count[[:space:]]+0' duplicate-blocker-count.txt

      - name: Read legacy unversioned state
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc \
            --command "SELECT i.canonical_key, i.short_title, COUNT(*) AS unversioned_articles FROM legal_article_versions a JOIN legal_instruments i ON i.id=a.instrument_id WHERE a.instrument_version_id IS NULL GROUP BY i.id,i.canonical_key,i.short_title ORDER BY unversioned_articles DESC;" | tee legacy-unversioned.txt

      - name: Read alias collision state
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc \
            --command "SELECT lower(alias) AS alias_key, COUNT(DISTINCT instrument_id) AS instrument_count, GROUP_CONCAT(DISTINCT instrument_id) AS instrument_ids FROM legal_instrument_aliases GROUP BY lower(alias) HAVING COUNT(DISTINCT instrument_id) > 1 ORDER BY alias_key;" | tee alias-collisions.txt

      - name: Confirm migration 0023 is not yet applied
        shell: bash
        run: |
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc \
            --command "SELECT COUNT(*) AS migration_23_count FROM schema_migrations WHERE CAST(version AS INTEGER)=23;" | tee migration-23-state.txt
          grep -Eq '"migration_23_count"[[:space:]]*:[[:space:]]*0|migration_23_count[[:space:]]*│[[:space:]]*0|migration_23_count[[:space:]]+0' migration-23-state.txt

      - name: Assert production target absent
        shell: bash
        run: |
          ! grep -R "12ece285-74bb-4f27-a025-2dbd1be6c59a" migration-list.txt schema-versions.txt duplicate-version-articles.txt duplicate-blocker-count.txt legacy-unversioned.txt alias-collisions.txt migration-23-state.txt
          echo "PRODUCTION TARGET ABSENT: PASS"

      - name: Upload read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: corpus-safety-0023-staging-preflight
          retention-days: 14
          path: |
            migration-list.txt
            schema-versions.txt
            duplicate-version-articles.txt
            duplicate-blocker-count.txt
            legacy-unversioned.txt
            alias-collisions.txt
            migration-23-state.txt

      - name: Result
        run: |
          echo "READ-ONLY STAGING PREFLIGHT 0023: PASS"
          echo "No migration apply, D1 write, deploy, law import, or production operation was performed."
