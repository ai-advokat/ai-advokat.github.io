name: AI Advokat security tests

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "membership.html"
      - "scholar/**"
      - "guides/**"
      - "data/guides.json"
      - "docs/guides/**"
      - "docs/standards/**"
      - "data/publication-governance.json"
      - "data/professional-legal-corpus-2026.json"
      - "data/legal-evidence-cards.json"
      - "data/citation-authority-engine.json"
      - "data/response-provenance-contract.json"
      - "data/human-gate-decision-ledger.json"
      - "data/audit-trail-decision-history.json"
      - "*.html"
      - "assets/**"
      - "sitemap.*"
      - "robots.txt"
      - "migrations/**"
      - "test/**"
      - "scripts/**"
      - "wrangler*.jsonc"
      - "package.json"
      - ".github/workflows/security-tests.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker syntax
        run: node --check src/index.js && node --check src/security.js && node --check src/corpus-versions.js && node --check src/agent-orchestrator.js && node --check src/casepilot.js
      - name: Structural verification
        run: npm run verify
      - name: GPT orchestrator foundation tests
        run: npm run test:agent-orchestrator
      - name: CasePilot foundation tests
        run: npm run test:casepilot
      - name: Zoran practical guides governance tests
        run: npm run test:guides
      - name: Professional publication governance tests
        run: npm run test:publication-governance
      - name: Professional Legal Corpus 2026 tests
        run: npm run test:professional-legal-corpus
      - name: Legal Evidence Card governance tests
        run: npm run test:legal-evidence-cards
      - name: Citation and Authority Engine tests
        run: npm run test:citation-authority-engine
      - name: Legal Claim Validator tests
        run: npm run test:legal-claim-validator
      - name: Response Provenance Contract tests
        run: npm run test:response-provenance
      - name: Human Gate Decision Ledger tests
        run: npm run test:human-gate-ledger
      - name: Audit Trail Decision History tests
        run: npm run test:audit-trail-history
      - name: Security, quota, routing and truth-labelling tests
        run: npm run test:security
      - name: Legal parser regression tests
        run: npm run test:legal-parser
      - name: Corpus safety foundation tests (parser v0.3, QA validator, migration 0023, version-aware retrieval)
        run: npm run test:corpus-safety
      - name: Corpus foundation v1.1 tests (multi-source validator, amendment engine)
        run: node --check scripts/apply-amendments.mjs && npm run test:corpus-foundation
      - name: Public layer tests (front-end/API contract, publication status, links, accessibility)
        run: npm run test:public-layer
      - name: Legal Base public layer tests (capability states, official sources, version labels, citation audit)
        run: node --check assets/legal-base.js && npm run test:legal-base
      - name: ZPP version timeline tests (official metadata, conservative status, staleness)
        run: node --check assets/zpp-timeline.js && npm run test:zpp-timeline
