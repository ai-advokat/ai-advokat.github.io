name: AI Advokat security tests

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "membership.html"
      - "scholar/**"
      - "*.html"
      - "assets/**"
      - "sitemap.*"
      - "robots.txt"
      - "migrations/**"
      - "test/**"
      - "scripts/**"
      - "wrangler*.jsonc"
      - "package.json"
      - ".github/workflows/security-tests.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker syntax
        run: node --check src/index.js && node --check src/security.js && node --check src/corpus-versions.js
      - name: Structural verification
        run: npm run verify
      - name: Security, quota, routing and truth-labelling tests
        run: npm run test:security
      - name: Legal parser regression tests
        run: npm run test:legal-parser
      - name: Corpus safety foundation tests (parser v0.3, QA validator, migration 0023, version-aware retrieval)
        run: npm run test:corpus-safety
      - name: Corpus foundation v1.1 tests (multi-source validator, amendment engine)
        run: node --check scripts/apply-amendments.mjs && npm run test:corpus-foundation
      - name: Public layer tests (front-end/API contract, publication status, links, accessibility)
        run: npm run test:public-layer
