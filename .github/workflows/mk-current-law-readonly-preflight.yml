name: MK current-law read-only preflight

on:
  pull_request:
    paths:
      - "data/mk-current-law-readiness-2026.json"
      - "architecture/MK_CURRENT_LAW_READINESS_GATE.md"
      - "test/mk-current-law-readiness.test.mjs"
      - ".github/workflows/mk-current-law-readonly-preflight.yml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "data/mk-current-law-readiness-2026.json"
      - "architecture/MK_CURRENT_LAW_READINESS_GATE.md"
      - "test/mk-current-law-readiness.test.mjs"
      - ".github/workflows/mk-current-law-readonly-preflight.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Current-law readiness gate
        run: npm run test:current-law-readiness

  remote-readonly:
    if: github.event_name != 'pull_request'
    needs: offline-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fail closed if Cloudflare secrets are missing
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify production and staging identities
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const strip=(s)=>s.replace(/\/\*[\s\S]*?\*\//g,"").replace(/^\s*\/\/.*$/gm,"");
          const prod=JSON.parse(strip(fs.readFileSync("wrangler.jsonc","utf8")));
          const preview=JSON.parse(strip(fs.readFileSync("wrangler.preview-migrations.jsonc","utf8")));
          const p=prod.d1_databases?.[0];
          const s=preview.d1_databases?.[0];
          if(!p || p.database_name!=="ai-advokat-db" || p.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production D1 identity");
          if(!s || s.binding!=="PREVIEW_DB" || s.database_name!=="ai-advokat-db-staging" || s.database_id!=="eb560e98-9fc0-408e-9c81-9b823ffde44d") throw new Error("Unexpected staging D1 identity");
          if(p.database_id===s.database_id) throw new Error("Production and staging must be different databases");
          console.log("D1 TARGET IDENTITIES: PASS");
          NODE

      - name: Read-only snapshot state query
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT li.canonical_key,
                      COUNT(lav.id) AS article_count,
                      SUM(CASE WHEN lav.instrument_version_id IS NULL AND lav.id IS NOT NULL THEN 1 ELSE 0 END) AS null_version_count,
                      COUNT(DISTINCT lav.instrument_version_id) AS distinct_bound_versions,
                      COUNT(DISTINCT lav.source_url) AS source_url_count,
                      MIN(lav.source_url) AS source_url,
                      COUNT(DISTINCT lav.source_sha256) AS source_hash_count,
                      MIN(lav.source_sha256) AS source_sha256,
                      COUNT(DISTINCT v.version_label) AS version_label_count,
                      MIN(v.version_label) AS version_label,
                      MAX(COALESCE(v.is_current,0)) AS max_is_current,
                      SUM(CASE WHEN v.human_review_status='approved' THEN 1 ELSE 0 END) AS approved_bound_rows
                 FROM legal_instruments li
                 LEFT JOIN legal_article_versions lav ON lav.instrument_id=li.id
                 LEFT JOIN instrument_versions v ON v.id=lav.instrument_version_id
                WHERE li.canonical_key IN ('mk:zi','mk:zro','mk:zkp')
                GROUP BY li.canonical_key
                ORDER BY li.canonical_key;"

          npx wrangler d1 execute ai-advokat-db --remote --json --command "$SQL" > /tmp/current-law-production.json
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc --json --command "$SQL" > /tmp/current-law-staging.json

      - name: Assert exact snapshot states
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const expected={
            "mk:zi":{
              rows:258,
              url:"https://portal.mdt.gov.mk/post-body-files/zakoni-izvrsuvanje-file-zhwP.pdf",
              sha:"15d8b0961d1beb1b5bc7de8f43d4b6ff4c1d79cdc46b241e829530039eefaa55",
              label:"official-editorial-consolidated-through-154/2023"
            },
            "mk:zro":{
              rows:298,
              url:"https://portal.mdt.gov.mk/post-body-files/zakoni-met-file-LaRm.pdf",
              sha:"f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655",
              label:"official-consolidated-snapshot-through-111/2023"
            },
            "mk:zkp":{
              rows:570,
              url:"https://glasprotivnasilstvo.org.mk/wp-content/uploads/2020/10/ZAKON-ZA-KRIVICHNATA-POSTAPKA.pdf",
              sha:"e6bf4588833752695a9b776b473ed9d504264effdfcd7917b8d6655bcfacaf45",
              label:"consolidated-reference-through-198/2018-and-CC-193/2016"
            }
          };

          function rows(path){
            const j=JSON.parse(fs.readFileSync(path,"utf8"));
            return j?.[0]?.results ?? [];
          }

          function classify(target,row,e){
            const n=Number(row?.article_count||0);
            const nulls=Number(row?.null_version_count||0);
            if(n===0) return "absent";
            if(n!==e.rows) throw new Error(`${target} ${row.canonical_key}: unexpected article count ${n}; expected ${e.rows}`);
            if(Number(row.source_url_count)!==1 || row.source_url!==e.url) throw new Error(`${target} ${row.canonical_key}: source URL drift`);
            if(Number(row.source_hash_count)!==1 || row.source_sha256!==e.sha) throw new Error(`${target} ${row.canonical_key}: source SHA-256 drift`);

            if(nulls===e.rows){
              if(Number(row.distinct_bound_versions)!==0) throw new Error(`${target} ${row.canonical_key}: mixed unbound/bound state`);
              return "legacy_unbound_exact_snapshot";
            }

            if(nulls===0){
              if(Number(row.distinct_bound_versions)!==1) throw new Error(`${target} ${row.canonical_key}: expected exactly one bound version`);
              if(Number(row.version_label_count)!==1 || row.version_label!==e.label) throw new Error(`${target} ${row.canonical_key}: unexpected version label`);
              if(Number(row.max_is_current)!==0) throw new Error(`${target} ${row.canonical_key}: snapshot was promoted to current`);
              if(Number(row.approved_bound_rows)!==0) throw new Error(`${target} ${row.canonical_key}: snapshot was Human-Gate approved unexpectedly`);
              return "bound_exact_snapshot";
            }

            throw new Error(`${target} ${row.canonical_key}: partial version binding (${nulls}/${e.rows} NULL)`);
          }

          for(const [target,path] of [["production","/tmp/current-law-production.json"],["staging","/tmp/current-law-staging.json"]]){
            const byKey=new Map(rows(path).map(r=>[r.canonical_key,r]));
            const state={};
            for(const [key,e] of Object.entries(expected)){
              const row=byKey.get(key) ?? {canonical_key:key,article_count:0,null_version_count:0};
              state[key]=classify(target,row,e);
            }
            console.log(target.toUpperCase(),JSON.stringify(state));
          }
          console.log("CURRENT-LAW READ-ONLY D1 PREFLIGHT: PASS");
          NODE
