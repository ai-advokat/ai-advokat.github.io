name: MK current-law read-only preflight

on:
  pull_request:
    paths:
      - "data/mk-current-law-readiness-2026.json"
      - "architecture/MK_CURRENT_LAW_READINESS_GATE.md"
      - "test/mk-current-law-readiness.test.mjs"
      - ".github/workflows/mk-current-law-readonly-preflight.yml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "data/mk-current-law-readiness-2026.json"
      - "architecture/MK_CURRENT_LAW_READINESS_GATE.md"
      - "test/mk-current-law-readiness.test.mjs"
      - ".github/workflows/mk-current-law-readonly-preflight.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Current-law readiness gate
        run: npm run test:current-law-readiness


  identity-isolation-gate:
    needs: offline-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify production identity and dedicated staging isolation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const strip=(s)=>s.replace(/\/\*[\s\S]*?\*\//g,"").replace(/^\s*\/\/.*$/gm,"");
          const p=JSON.parse(strip(fs.readFileSync("wrangler.jsonc","utf8"))).d1_databases?.[0];
          const staging=JSON.parse(strip(fs.readFileSync("wrangler.staging.jsonc","utf8")));
          const d=staging.d1_databases?.[0];
          const m=JSON.parse(strip(fs.readFileSync("wrangler.preview-migrations.jsonc","utf8"))).d1_databases?.[0];
          if(!p || p.database_name!=="ai-advokat-db" || p.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a") throw new Error("Unexpected production D1");
          if(!d || d.binding!=="DB" || d.database_name!=="ai-advokat-staging-db" || d.database_id!=="309f72b8-8711-47fc-bea7-fbd1d649561d") throw new Error("Unexpected dedicated staging D1");
          if(!m || m.binding!=="PREVIEW_DB" || m.database_name!==d.database_name || m.database_id!==d.database_id) throw new Error("Local migration target mismatch");
          if(p.database_id===d.database_id) throw new Error("D1 identity collision");
          if(staging.workers_dev!==false || staging.preview_urls!==false) throw new Error("Dedicated staging exposure must remain disabled");
          if(Object.prototype.hasOwnProperty.call(staging,"ai")) throw new Error("Workers AI binding must remain absent before HG2-C");
          console.log("DEDICATED STAGING IDENTITY / ISOLATION: PASS");
          NODE

  production-readonly:
    if: github.event_name != 'pull_request'
    needs: [offline-readiness, identity-isolation-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fail closed if production read-only credentials are missing
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Read-only production snapshot state query
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT li.canonical_key,
                      COUNT(lav.id) AS article_count,
                      SUM(CASE WHEN lav.instrument_version_id IS NULL AND lav.id IS NOT NULL THEN 1 ELSE 0 END) AS null_version_count,
                      COUNT(DISTINCT lav.instrument_version_id) AS distinct_bound_versions,
                      COUNT(DISTINCT lav.source_url) AS source_url_count,
                      MIN(lav.source_url) AS source_url,
                      COUNT(DISTINCT lav.source_sha256) AS source_hash_count,
                      MIN(lav.source_sha256) AS source_sha256,
                      COUNT(DISTINCT v.version_label) AS version_label_count,
                      MIN(v.version_label) AS version_label,
                      MAX(COALESCE(v.is_current,0)) AS max_is_current,
                      SUM(CASE WHEN v.human_review_status='approved' THEN 1 ELSE 0 END) AS approved_bound_rows
                 FROM legal_instruments li
                 LEFT JOIN legal_article_versions lav ON lav.instrument_id=li.id
                 LEFT JOIN instrument_versions v ON v.id=lav.instrument_version_id
                WHERE li.canonical_key IN ('mk:zi','mk:zro','mk:zkp')
                GROUP BY li.canonical_key
                ORDER BY li.canonical_key;"

          npx wrangler d1 execute ai-advokat-db --remote --json --command "$SQL" > /tmp/current-law-production.json

      - name: Assert exact production snapshot states
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const expected={
            "mk:zi":{
              rows:258,
              url:"https://portal.mdt.gov.mk/post-body-files/zakoni-izvrsuvanje-file-zhwP.pdf",
              sha:"15d8b0961d1beb1b5bc7de8f43d4b6ff4c1d79cdc46b241e829530039eefaa55",
              label:"official-editorial-consolidated-through-154/2023"
            },
            "mk:zro":{
              rows:298,
              url:"https://portal.mdt.gov.mk/post-body-files/zakoni-met-file-LaRm.pdf",
              sha:"f0b178227052c960ef9d86218a98b005654550c1b78633858b9fc1a6ccf5d655",
              label:"official-consolidated-snapshot-through-111/2023"
            },
            "mk:zkp":{
              rows:570,
              url:"https://glasprotivnasilstvo.org.mk/wp-content/uploads/2020/10/ZAKON-ZA-KRIVICHNATA-POSTAPKA.pdf",
              sha:"e6bf4588833752695a9b776b473ed9d504264effdfcd7917b8d6655bcfacaf45",
              label:"consolidated-reference-through-198/2018-and-CC-193/2016"
            }
          };

          const j=JSON.parse(fs.readFileSync("/tmp/current-law-production.json","utf8"));
          const byKey=new Map((j?.[0]?.results ?? []).map(r=>[r.canonical_key,r]));

          function classify(row,e){
            const n=Number(row?.article_count||0);
            const nulls=Number(row?.null_version_count||0);
            if(n===0) return "absent";
            if(n!==e.rows) throw new Error(`${row.canonical_key}: unexpected article count ${n}; expected ${e.rows}`);
            if(Number(row.source_url_count)!==1 || row.source_url!==e.url) throw new Error(`${row.canonical_key}: source URL drift`);
            if(Number(row.source_hash_count)!==1 || row.source_sha256!==e.sha) throw new Error(`${row.canonical_key}: source SHA-256 drift`);
            if(nulls===e.rows){
              if(Number(row.distinct_bound_versions)!==0) throw new Error(`${row.canonical_key}: mixed unbound/bound state`);
              return "legacy_unbound_exact_snapshot";
            }
            if(nulls===0){
              if(Number(row.distinct_bound_versions)!==1) throw new Error(`${row.canonical_key}: expected exactly one bound version`);
              if(Number(row.version_label_count)!==1 || row.version_label!==e.label) throw new Error(`${row.canonical_key}: unexpected version label`);
              if(Number(row.max_is_current)!==0) throw new Error(`${row.canonical_key}: snapshot was promoted to current`);
              if(Number(row.approved_bound_rows)!==0) throw new Error(`${row.canonical_key}: snapshot was Human-Gate approved unexpectedly`);
              return "bound_exact_snapshot";
            }
            throw new Error(`${row.canonical_key}: partial version binding (${nulls}/${e.rows} NULL)`);
          }

          const state={};
          for(const [key,e] of Object.entries(expected)){
            const row=byKey.get(key) ?? {canonical_key:key,article_count:0,null_version_count:0};
            state[key]=classify(row,e);
          }
          console.log("PRODUCTION",JSON.stringify(state));
          console.log("STAGING","REMOTE CHECK DEFERRED UNTIL HG2-C");
          console.log("CURRENT-LAW READ-ONLY D1 PREFLIGHT: PASS");
          NODE
