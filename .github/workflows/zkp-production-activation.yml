name: ZKP production activation

on:
  push:
    branches:
      - zkp-corpus-v1-30sep2026
    paths:
      - ".github/workflows/zkp-production-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-advokat-zkp-production-activation
  cancel-in-progress: false

jobs:
  activate-zkp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tooling
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Fail closed if Cloudflare credentials are missing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify release and exact production target
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          npm run verify
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          const p=c.previews?.d1_databases?.[0];
          if(c.name!=="ai-advokat-github-io") throw new Error("Unexpected Worker");
          if(!d || d.binding!=="DB" || d.database_name!=="ai-advokat-db" || d.database_id!=="12ece285-74bb-4f27-a025-2dbd1be6c59a"){
            throw new Error("Unexpected production D1");
          }
          if(p?.database_id===d.database_id) throw new Error("Production/staging collision");
          console.log("EXACT PRODUCTION TARGET: PASS");
          NODE

      - name: Guard exact production pre-state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/pending.txt
          found="$(grep -Eo '0018_zkp_instrument_metadata\.sql' /tmp/pending.txt | sort -u || true)"
          test "$found" = "0018_zkp_instrument_metadata.sql"
          unexpected="$(grep -Eo '001[0-9]+_[A-Za-z0-9_.-]+\.sql' /tmp/pending.txt | grep -v '^0018_zkp_instrument_metadata\.sql$' || true)"
          test -z "$unexpected"

          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT COUNT(*) AS zkp_before FROM legal_instruments WHERE canonical_key='mk:zkp'; SELECT COUNT(*) AS zkp_articles_before FROM legal_article_versions WHERE instrument_id IN (SELECT id FROM legal_instruments WHERE canonical_key='mk:zkp'); SELECT COUNT(*) AS zro_articles FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro');"             | tee /tmp/prestate.txt
          grep -q '"zkp_before": 0' /tmp/prestate.txt
          grep -q '"zkp_articles_before": 0' /tmp/prestate.txt
          grep -q '"zro_articles": 298' /tmp/prestate.txt
          echo "PRODUCTION PRE-STATE: PASS"

      - name: Apply migration 18 only
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Verify and reconcile ZKP metadata
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT version,description FROM schema_migrations WHERE version='18'; SELECT canonical_key,title,short_title,gazette_reference,current_status,human_review_status FROM legal_instruments WHERE canonical_key='mk:zkp';"             | tee /tmp/zkp-instrument.txt
          grep -q '"version": "18"' /tmp/zkp-instrument.txt
          grep -q '"canonical_key": "mk:zkp"' /tmp/zkp-instrument.txt
          grep -q '"current_status": "pending"' /tmp/zkp-instrument.txt
          grep -q '"human_review_status": "pending"' /tmp/zkp-instrument.txt

          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "INSERT OR IGNORE INTO sources (title,url,source_type,issuing_body,jurisdiction,source_status,notes) VALUES ('ZKP consolidated reference snapshot through 198/2018','https://glasprotivnasilstvo.org.mk/wp-content/uploads/2020/10/ZAKON-ZA-KRIVICHNATA-POSTAPKA.pdf','secondary_consolidated_reference','Public legal-resource consolidated reference','MK','verified','Article-level reference snapshot; official LDBIS/Gazette lineage remains controlling.'); UPDATE instrument_versions SET source_url='https://glasprotivnasilstvo.org.mk/wp-content/uploads/2020/10/ZAKON-ZA-KRIVICHNATA-POSTAPKA.pdf' WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zkp') AND version_label='consolidated-reference-through-198/2018-and-CC-193/2016';"             | tee /tmp/reconcile.txt

      - name: Download and verify ZKP reference snapshot
        shell: bash
        run: |
          set -euo pipefail
          URL="https://glasprotivnasilstvo.org.mk/wp-content/uploads/2020/10/ZAKON-ZA-KRIVICHNATA-POSTAPKA.pdf"
          curl --fail --location --retry 4 --retry-delay 2             --connect-timeout 20 --max-time 180             --user-agent "AI-Advokat-ZKP-Audit/1.0"             "$URL" -o /tmp/zkp.pdf
          test -s /tmp/zkp.pdf
          head -c 5 /tmp/zkp.pdf | grep -q "%PDF-"
          pdfinfo /tmp/zkp.pdf | tee /tmp/zkp-pdfinfo.txt
          grep -Eq "^Pages:[[:space:]]+195$" /tmp/zkp-pdfinfo.txt
          SHA="$(sha256sum /tmp/zkp.pdf | cut -d' ' -f1)"
          test "$SHA" = "e6bf4588833752695a9b776b473ed9d504264effdfcd7917b8d6655bcfacaf45"
          echo "$SHA" | tee /tmp/zkp.sha256
          echo "ZKP REFERENCE SNAPSHOT: PASS"

      - name: Extract and parse exactly 570 article records
        shell: bash
        run: |
          set -euo pipefail
          pdftotext -layout /tmp/zkp.pdf /tmp/zkp-raw.txt
          node scripts/clean-official-legal-pdf-text.mjs             /tmp/zkp-raw.txt /tmp/zkp-clean.txt /tmp/zkp-clean-report.json 568

          cat > /tmp/zkp-meta.json <<'EOF'
          {
            "instrument_key": "mk:zkp",
            "instrument_title": "Закон за кривичната постапка",
            "version_id": "consolidated-reference-through-198-2018-and-cc-193-2016",
            "source_url": "https://glasprotivnasilstvo.org.mk/wp-content/uploads/2020/10/ZAKON-ZA-KRIVICHNATA-POSTAPKA.pdf",
            "source_sha256": "e6bf4588833752695a9b776b473ed9d504264effdfcd7917b8d6655bcfacaf45",
            "source_issue_number": "150/2010; 100/2012; 142/2016; 193/2016; 198/2018",
            "source_issue_date": "2018-10-31",
            "status": "needs_version_review",
            "extraction_method": "pdftotext_layout_plus_cleaner",
            "human_review_status": "pending"
          }
          EOF

          node scripts/parse-mk-legal-text.mjs             /tmp/zkp-clean.txt /tmp/zkp-meta.json /tmp/zkp.ndjson
          head -n 1 /tmp/zkp.ndjson | tee /tmp/zkp-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path("/tmp/zkp.ndjson").read_text().splitlines() if x.strip()]
          manifest=rows[0]
          articles=[x for x in rows if x.get("type")=="article"]
          assert len(articles)==570, len(articles)
          assert int(manifest.get("warning_count") or 0)==0, manifest
          numbers={a.get("article_number_normalized") for a in articles}
          assert "1" in numbers and "568" in numbers
          assert "567-а" in numbers or "567-a" in numbers
          print("ZKP PARSE GATE: PASS")
          PY

      - name: Import ZKP article corpus
        shell: bash
        run: |
          set -euo pipefail
          node scripts/legal-ndjson-to-sql.mjs /tmp/zkp.ndjson /tmp/zkp-production.sql
          test -s /tmp/zkp-production.sql
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --file /tmp/zkp-production.sql
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "UPDATE instrument_versions SET checksum_sha256='e6bf4588833752695a9b776b473ed9d504264effdfcd7917b8d6655bcfacaf45', source_url='https://glasprotivnasilstvo.org.mk/wp-content/uploads/2020/10/ZAKON-ZA-KRIVICHNATA-POSTAPKA.pdf' WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zkp') AND version_label='consolidated-reference-through-198/2018-and-CC-193/2016';"

      - name: Read-back verify ZKP and ZRO
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc             --command "SELECT COUNT(*) AS article_count, SUM(CASE WHEN status='needs_version_review' THEN 1 ELSE 0 END) AS review_count, SUM(CASE WHEN human_review_status='pending' THEN 1 ELSE 0 END) AS pending_count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zkp'); SELECT article_number,article_number_normalized,status,human_review_status FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zkp') AND article_number_normalized IN ('1','12','567','567-а','568') ORDER BY id; SELECT run_key,article_count,warning_count,status FROM corpus_ingest_runs WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zkp') ORDER BY id DESC LIMIT 1; SELECT COUNT(*) AS zro_article_count FROM legal_article_versions WHERE instrument_id=(SELECT id FROM legal_instruments WHERE canonical_key='mk:zro');"             | tee /tmp/readback.txt
          grep -q '"article_count": 570' /tmp/readback.txt
          grep -q '"review_count": 570' /tmp/readback.txt
          grep -q '"pending_count": 570' /tmp/readback.txt
          grep -q '"article_number_normalized": "568"' /tmp/readback.txt
          grep -Eq '"article_number_normalized": "567-(а|a)"' /tmp/readback.txt
          grep -q '"warning_count": 0' /tmp/readback.txt
          grep -q '"status": "validated"' /tmp/readback.txt
          grep -q '"zro_article_count": 298' /tmp/readback.txt
          echo "PRODUCTION CORPUS READ-BACK: PASS"

      - name: Deploy production Worker and app assets
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Live production smoke tests
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"

          curl --fail --retry 6 --retry-delay 3 "$BASE/api/health" -o /tmp/live-health.json
          curl --fail --retry 6 --retry-delay 3 "$BASE/api/instruments" -o /tmp/live-instruments.json
          curl --fail --retry 6 --retry-delay 3 "$BASE/api/articles?instrument=mk%3Azkp&article=1" -o /tmp/live-zkp-1.json
          curl --fail --retry 6 --retry-delay 3 "$BASE/api/articles?instrument=mk%3Azkp&article=568" -o /tmp/live-zkp-568.json
          curl --fail --retry 6 --retry-delay 3 "$BASE/api/articles?instrument=mk%3Azro&limit=1" -o /tmp/live-zro.json
          curl --fail --retry 6 --retry-delay 3             -H 'content-type: application/json'             -d '{"q":"Што предвидува член 12 од ЗКП?","instrument":"mk:zkp"}'             "$BASE/api/assistant" -o /tmp/live-assistant.json
          curl --fail --retry 6 --retry-delay 3 "$BASE/api/membership/plans" -o /tmp/live-membership.json

          node <<'NODE'
          const fs=require("fs");
          const read=p=>JSON.parse(fs.readFileSync(p,"utf8"));
          const health=read("/tmp/live-health.json");
          const inst=read("/tmp/live-instruments.json");
          const a1=read("/tmp/live-zkp-1.json");
          const a568=read("/tmp/live-zkp-568.json");
          const zro=read("/tmp/live-zro.json");
          const ai=read("/tmp/live-assistant.json");
          const membership=read("/tmp/live-membership.json");

          if(!health.ok) throw new Error("health failed");
          const keys=new Set((inst.instruments||[]).map(x=>x.canonicalKey));
          if(!keys.has("mk:zro") || !keys.has("mk:zkp")) throw new Error("instrument registry incomplete");
          const zkp=inst.instruments.find(x=>x.canonicalKey==="mk:zkp");
          if(Number(zkp?.articleCount)!==570) throw new Error("ZKP registry count mismatch");
          if(a1.total!==570 || a1.filteredCount<1 || a1.articles?.[0]?.articleNumberNormalized!=="1") throw new Error("ZKP article 1 failed");
          if(a568.articles?.[0]?.articleNumberNormalized!=="568") throw new Error("ZKP article 568 failed");
          if(zro.total!==298) throw new Error("ZRO regression");
          if(!ai.ok || ai.instrument?.canonicalKey!=="mk:zkp") throw new Error("ZKP assistant failed");
          if(!(ai.citations||[]).some(c=>String(c.articleNumber)==="12")) throw new Error("ZKP citation 12 missing");
          if(!ai.legalStatusWarning) throw new Error("ZKP legal status warning missing");
          const prices=(membership.plans||[]).map(x=>x.monthlyPriceMkd);
          for(const n of [199,399,999]) if(!prices.includes(n)) throw new Error("membership regression");
          console.log("LIVE ZKP + ZRO + MEMBERSHIP: PASS");
          NODE

      - name: Upload production activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: zkp-production-activation-evidence
          retention-days: 30
          path: |
            /tmp/pending.txt
            /tmp/prestate.txt
            /tmp/zkp-instrument.txt
            /tmp/reconcile.txt
            /tmp/zkp-pdfinfo.txt
            /tmp/zkp.sha256
            /tmp/zkp-clean-report.json
            /tmp/zkp-manifest.json
            /tmp/readback.txt
            /tmp/live-health.json
            /tmp/live-instruments.json
            /tmp/live-zkp-1.json
            /tmp/live-zkp-568.json
            /tmp/live-zro.json
            /tmp/live-assistant.json
            /tmp/live-membership.json
