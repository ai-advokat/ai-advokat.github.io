name: AI Advokat root reliability live smoke

on:
  workflow_run:
    workflows: ["Sync AI Advokat frontend runtime to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ai-advokat-root-reliability-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify release source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check assets/ai-advokat-chat.js
          node --check assets/professional-tools.js
          node --check assets/casepilot-workspace-ui.js
          node --check assets/ai-advokat-voice.mjs
          node --check assets/standalone-bot-vnext.js
          node --check assets/standalone-bot-toolkit.js
          node --check assets/frontend-runtime-guard.js
          grep -q 'frontend-runtime-guard.js?v=20261101-root-r1' index.html
          grep -q 'ai-advokat-chat.js?v=20261109-root-r15-voice-r4-runtime' index.html
          grep -q 'ai-advokat-chat.css?v=20261106-root-r15-voice' index.html
          grep -q 'frontend-runtime-guard.js?v=20261101-root-r1' bot/index.html
          grep -q 'standalone-bot.js?v=20261109-core-r15-voice-r4' bot/index.html
          grep -q 'standalone-bot-vnext.js?v=20261107-hybrid-r2-lawyer-view' bot/index.html
          grep -q 'standalone-bot-toolkit.js?v=20261106-toolkit-r14' bot/index.html
          grep -q 'standalone-bot-toolkit.css?v=20261106-toolkit-r14' bot/index.html
          grep -q 'AI_ADVOCAT_VOICE_R4' assets/ai-advokat-voice.mjs
          grep -q 'Hybrid Legal Intelligence R2' hybrid-legal-intelligence.html
          grep -q 'AI_ADVOCAT_HYBRID_CONTROL_R3' hybrid-legal-intelligence.html
          grep -q '/api/hybrid/instruments' hybrid-legal-intelligence.html
          test -f professional-tools.html
          grep -q 'Batch Review · до 100 документи' professional-tools.html
          test -f casepilot-workspace.html
          grep -q 'XLS · XLSX' casepilot-workspace.html
          grep -q 'buildReviewTable' assets/professional-tools.js
          test -f gold-set-review-gate.html
          grep -q 'Gold Set Review Gate v2.1' gold-set-review-gate.html
          grep -q 'reviewed_authority_promoted:false' gold-set-review-gate.html
          test -f echr-crosswalk.html
          grep -q 'F0-FAST-27 · ECHR ↔ Domestic Case-Law Crosswalk' echr-crosswalk.html
          grep -q 'PRODUCTION NO-GO' echr-crosswalk.html
          grep -q 'getUserMedia' assets/ai-advokat-voice.mjs
          grep -q 'microphonePermissionErrorMessage' assets/ai-advokat-voice.mjs
          echo "RELEASE SOURCE CONTRACT: PASS"

      - name: Verify GitHub Pages serves R14 dual-bot toolkit parity bundles
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 120); do
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/?root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-home.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/bot/?root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-bot.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/hybrid-legal-intelligence.html?root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-hybrid.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/professional-tools.html?root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-professional-tools.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/assets/professional-tools.js?root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-professional-tools.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/casepilot-workspace.html?root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-casepilot.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/assets/casepilot-workspace-ui.js?root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-casepilot-ui.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/gold-set-review-gate.html?root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-gold.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/echr-crosswalk.html?root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-echr.html || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/assets/ai-advokat-voice.mjs?v=20261109-voice-r4&root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-voice.mjs || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://ai-advokat.github.io/pages-release.txt?root_smoke=$GITHUB_RUN_ID-$i" -o /tmp/pages-release.txt || true
            if grep -q 'frontend-runtime-guard.js?v=20261101-root-r1' /tmp/pages-home.html 2>/dev/null \
              && grep -q 'ai-advokat-chat.js?v=20261109-root-r15-voice-r4-runtime' /tmp/pages-home.html 2>/dev/null \
              && grep -q 'ai-advokat-chat.css?v=20261106-root-r15-voice' /tmp/pages-home.html 2>/dev/null \
              && grep -q 'frontend-runtime-guard.js?v=20261101-root-r1' /tmp/pages-bot.html 2>/dev/null \
              && grep -q 'standalone-bot.js?v=20261109-core-r15-voice-r4' /tmp/pages-bot.html 2>/dev/null \
              && grep -q 'standalone-bot-vnext.js?v=20261107-hybrid-r2-lawyer-view' /tmp/pages-bot.html 2>/dev/null \
              && grep -q 'standalone-bot-toolkit.js?v=20261106-toolkit-r14' /tmp/pages-bot.html 2>/dev/null \
              && grep -q 'standalone-bot-toolkit.css?v=20261106-toolkit-r14' /tmp/pages-bot.html 2>/dev/null \
              && grep -q 'Водилка · Како да ги користиш новите функции во надворешниот AI Advokat' /tmp/pages-bot.html 2>/dev/null \
              && grep -q '09 · Gold Review Gate' /tmp/pages-bot.html 2>/dev/null \
              && grep -q '10 · ECHR Crosswalk' /tmp/pages-bot.html 2>/dev/null \
              && grep -q 'Hybrid Legal Intelligence R2' /tmp/pages-hybrid.html 2>/dev/null \
              && grep -q 'Lawyer View' /tmp/pages-hybrid.html 2>/dev/null \
              && grep -q 'AI_ADVOCAT_HYBRID_CONTROL_R3' /tmp/pages-hybrid.html 2>/dev/null \
              && grep -q 'Batch Review · до 100 документи' /tmp/pages-professional-tools.html 2>/dev/null \
              && grep -q 'buildReviewTable' /tmp/pages-professional-tools.js 2>/dev/null \
              && grep -q 'XLS · XLSX' /tmp/pages-casepilot.html 2>/dev/null \
              && grep -q 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' /tmp/pages-casepilot-ui.js 2>/dev/null \
              && grep -q 'Gold Set Review Gate v2.1' /tmp/pages-gold.html 2>/dev/null \
              && grep -q 'reviewed_authority_promoted:false' /tmp/pages-gold.html 2>/dev/null \
              && grep -q 'F0-FAST-27 · ECHR ↔ Domestic Case-Law Crosswalk' /tmp/pages-echr.html 2>/dev/null \
              && grep -q 'PRODUCTION NO-GO' /tmp/pages-echr.html 2>/dev/null \
              && grep -q 'AI_ADVOCAT_VOICE_R4' /tmp/pages-voice.mjs 2>/dev/null \
              && grep -q 'getUserMedia' /tmp/pages-voice.mjs 2>/dev/null \
              && grep -q 'microphonePermissionErrorMessage' /tmp/pages-voice.mjs 2>/dev/null \
              && grep -qx "source_main_sha=$EXPECTED_RELEASE_SHA" /tmp/pages-release.txt 2>/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "GITHUB PAGES VOICE R2 + R14 TOOLKIT PARITY ASSETS: PASS"

      - name: Verify Worker static assets and runtime health
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl -fsSL --retry 5 --retry-delay 2 --max-time 30 "$BASE/" -o /tmp/worker-home.html
          curl -fsSL --retry 5 --retry-delay 2 --max-time 30 "$BASE/bot/" -o /tmp/worker-bot.html
          curl -fsSL --retry 5 --retry-delay 2 --max-time 30 "$BASE/assets/ai-advokat-voice.mjs?v=20261109-voice-r4" -o /tmp/worker-voice.mjs
          grep -q 'AI_ADVOCAT_VOICE_R4' /tmp/worker-voice.mjs
          grep -q 'getUserMedia' /tmp/worker-voice.mjs
          grep -q 'microphonePermissionErrorMessage' /tmp/worker-voice.mjs
          echo "WORKER VOICE R2 STATIC ASSET: PASS"
          # Exact frontend release identity is asserted on GitHub Pages above.
          # Worker HTML may lag the Pages bundle because Worker is the API/runtime plane.
          test -s /tmp/worker-home.html
          test -s /tmp/worker-bot.html
          curl -fsSL --retry 5 --retry-delay 2 --max-time 30 "$BASE/assets/chat-privacy-browser.js?v=20261101-privacy-r12" -o /tmp/privacy-primary.js
          curl -fsSL --retry 5 --retry-delay 2 --max-time 30 "$BASE/src/chat-privacy.js?v=20261101-privacy-compat-r1" -o /tmp/privacy-compat.js
          grep -q 'detectConfidentialCasePrompt' /tmp/privacy-primary.js
          grep -q 'redactConfidentialCasePrompt' /tmp/privacy-primary.js
          grep -q 'detectConfidentialCasePrompt' /tmp/privacy-compat.js
          grep -q 'redactConfidentialCasePrompt' /tmp/privacy-compat.js
          echo "PRIVACY RUNTIME STATIC ASSETS: PASS"

          curl -fsSL --retry 5 --retry-delay 2 --max-time 30 "$BASE/api/health" -o /tmp/root-health.json
          curl -fsSL --retry 5 --retry-delay 2 --max-time 30 "$BASE/api/orchestrator" -o /tmp/root-orchestrator.json
          node <<'NODE'
          const h=require("/tmp/root-health.json");
          const o=require("/tmp/root-orchestrator.json");
          if(!h.ok) throw new Error("health_not_ok");
          if(h.database?.reachable!==true || h.database?.schemaReady!==true) throw new Error("database_not_ready");
          if(!o.ok) throw new Error("orchestrator_not_ok");
          if(o.runtime?.providerExecution!=="configured_for_api_chat_execution") throw new Error("paid_provider_not_ready");
          if(o.runtime?.lioeRuntimeGovernance!=="enabled") throw new Error("lioe_governance_not_enabled");
          if(o.runtime?.lioePostflight!=="enabled") throw new Error("lioe_postflight_not_enabled");
          if(o.runtime?.lioeSpecialistExecution!=="enabled") throw new Error("lioe_specialists_not_enabled");
          console.log("WORKER RUNTIME/API HEALTH + ORCHESTRATOR: PASS");
          NODE

      - name: Verify browser CORS and main AI chat live response
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl -sS --fail -D /tmp/root-cors.txt -o /dev/null \
            -X OPTIONS \
            -H 'Origin: https://ai-advokat.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$BASE/api/chat"
          grep -qi '^access-control-allow-origin: https://ai-advokat.github.io' /tmp/root-cors.txt

          chat_code="$(curl -sS --max-time 90 \
            -o /tmp/root-chat.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'Origin: https://ai-advokat.github.io' \
            -d '{"q":"Одговори кратко и вклучи ја ознаката ROOT_SMOKE_OK.","mode":"auto","webSearch":false,"history":[],"guideIds":[],"guideDocuments":[],"attachments":[]}' \
            "$BASE/api/chat")"
          echo "MAIN CHAT HTTP: $chat_code"

          node - "$chat_code" <<'NODE'
          const fs=require("fs");
          const status=Number(process.argv[2]||0);
          const raw=fs.readFileSync("/tmp/root-chat.json","utf8");
          let d={};try{d=JSON.parse(raw);}catch{throw new Error("main_chat_invalid_json_http_"+status+": "+raw.slice(0,500));}
          if(status!==200){
            const capacity=d?.providerCapacity?.state==="exhausted"
              || d?.error==="workers_ai_daily_capacity_exhausted"
              || d?.providerRecovery?.direction==="workers_ai_to_openai";
            console.error("MAIN CHAT NON-200",JSON.stringify({
              status,error:d?.error||null,providerCapacity:d?.providerCapacity||null,
              providerRecovery:d?.providerRecovery||null,fallbackProviderFailure:d?.fallbackProviderFailure||null
            }));
            if(capacity) throw new Error("main_chat_provider_capacity_blocked");
            throw new Error("main_chat_http_"+status+":"+(d?.error||"unknown"));
          }
          if(!d.ok) throw new Error("main_chat_not_ok: "+JSON.stringify(d));
          if(!String(d.answer||"").trim()) throw new Error("main_chat_empty_answer");
          if(!String(d.answer||"").includes("ROOT_SMOKE_OK")) throw new Error("main_chat_marker_missing");
          console.log("MAIN AI ADVOKAT LIVE CHAT: PASS");
          NODE

      - name: Verify professional bot route is live and membership fail-closed
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          code="$(curl -sS --max-time 30 -o /tmp/root-bot-unauth.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'Origin: https://ai-advokat.github.io' \
            -d '{"q":"Здраво"}' \
            "$BASE/api/bot")"
          test "$code" = "401"
          grep -q 'bot_membership_required' /tmp/root-bot-unauth.json
          echo "PROFESSIONAL /api/bot LIVE + FAIL-CLOSED: PASS"

      - name: Write release evidence summary
        shell: bash
        run: |
          cat > /tmp/root-live-smoke-summary.txt <<EOF
          AI ADVOKAT ROOT RELIABILITY LIVE SMOKE
          Commit: $GITHUB_SHA
          GitHub Pages Voice R2 + R14 toolkit parity assets: PASS
          Worker runtime/API plane reachable: PASS
          Production health/database: PASS
          Orchestrator/OpenAI/LIOE readiness: PASS
          Browser CORS: PASS
          Main AI Advokat live chat: PASS
          Professional /api/bot route: PASS (unauthenticated fail-closed)
          Membership mutation performed: NO
          D1 write performed by this smoke: NO
          Secret mutation performed: NO
          EOF
          cat /tmp/root-live-smoke-summary.txt

      - name: Upload non-secret smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-advokat-root-reliability-live-smoke
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/pages-home.html
            /tmp/pages-bot.html
            /tmp/pages-hybrid.html
            /tmp/pages-professional-tools.html
            /tmp/pages-professional-tools.js
            /tmp/pages-casepilot.html
            /tmp/pages-casepilot-ui.js
            /tmp/pages-gold.html
            /tmp/pages-echr.html
            /tmp/pages-voice.mjs
            /tmp/worker-home.html
            /tmp/worker-bot.html
            /tmp/worker-voice.mjs
            /tmp/root-health.json
            /tmp/root-orchestrator.json
            /tmp/root-cors.txt
            /tmp/root-chat.json
            /tmp/root-bot-unauth.json
            /tmp/root-live-smoke-summary.txt
