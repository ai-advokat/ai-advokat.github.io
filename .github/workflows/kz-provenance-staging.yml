name: KZ provenance correction staging

on:
  push:
    branches:
      - law-intake-batch-1-30sep2026
    paths:
      - ".github/workflows/kz-provenance-staging.yml"
      - "migrations/0020_kz_2026_correction_provenance.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply migration 20 to staging
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc | tee /tmp/pending.txt
          if grep -q '0020_kz_2026_correction_provenance.sql' /tmp/pending.txt; then
            npx wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc
          fi
          npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc             --command "SELECT version,description FROM schema_migrations WHERE version='20'; SELECT canonical_key,gazette_reference,notes FROM legal_instruments WHERE canonical_key='mk:kz'; SELECT url,source_status FROM sources WHERE url IN ('https://ldbis.pravda.gov.mk/PregledNaZakon.aspx?id=72834','https://ldbis.pravda.gov.mk/PregledNaZakon.aspx?id=72841') ORDER BY url;"             | tee /tmp/state.txt
          grep -q '"version": "20"' /tmp/state.txt
          grep -q 'correction 17/2026' /tmp/state.txt
          grep -q 'id=72841' /tmp/state.txt
          echo "KZ PROVENANCE STAGING: PASS"
