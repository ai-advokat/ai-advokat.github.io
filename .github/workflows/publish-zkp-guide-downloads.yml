name: Publish ZKP guide downloads

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_zkp_usage_downloads.py"
      - ".github/workflows/publish-zkp-guide-downloads.yml"
      - "guides/zkp-commentary-usage/index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document dependencies
        run: python -m pip install --disable-pip-version-check python-docx reportlab

      - name: Generate PDF and DOCX editions
        run: python scripts/generate_zkp_usage_downloads.py

      - name: Verify generated assets
        run: |
          test -s downloads/zkp-commentary-usage/VODIC_ZA_KORISTENJE_NA_KOMENTAROT_ZKP_I_BAZATA_v2_FINAL.pdf
          test -s downloads/zkp-commentary-usage/VODIC_ZA_KORISTENJE_NA_KOMENTAROT_ZKP_I_BAZATA_v2_FINAL.docx
          test -s downloads/zkp-commentary-usage/ZKP_QUICK_START_v2.pdf
          test -s downloads/zkp-commentary-usage/ZKP_QUICK_START_v2.docx
          sha256sum downloads/zkp-commentary-usage/*

      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="zkp-guide-v2.0"
          TITLE="AI Advokat · ZKP Commentary Usage Guide v2.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" downloads/zkp-commentary-usage/* --clobber
          else
            gh release create "$TAG" downloads/zkp-commentary-usage/* --title "$TITLE" --notes "Canonical v2.0 download editions: full ZKP Commentary usage guide and one-page Quick Start, PDF and DOCX."
          fi
