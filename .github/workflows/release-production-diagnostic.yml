name: AI Advokat release production diagnostic
# post-import-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read-only production state
        run: |
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/pending.txt
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "PRAGMA table_info(legal_instruments); PRAGMA table_info(instrument_versions); SELECT COUNT(*) AS zro_title_count FROM legal_instruments WHERE title='Закон за работните односи'; SELECT COUNT(*) AS article_count FROM legal_article_versions;" | tee /tmp/state.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-production-diagnostic
          retention-days: 7
          path: |
            /tmp/pending.txt
            /tmp/state.txt
