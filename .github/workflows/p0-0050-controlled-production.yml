name: AI Advokat P0 0050 post-activation verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-advokat-p0-0050-post-activation-verification
  cancel-in-progress: false

jobs:
  verify:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANDIDATE_SHA: "1d65b251343cab4b1329d8cc8478e8948d363750"
      DB_ID: "12ece285-74bb-4f27-a025-2dbd1be6c59a"
      EXPECTED_WORKER_VERSION_ID: "3049f3a5-1620-44d6-8c5e-838fc53797af"

    steps:
      - name: Checkout verification control commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize exact deployed candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p0candidate
          mkdir -p /tmp/p0candidate
          git archive "$CANDIDATE_SHA" | tar -x -C /tmp/p0candidate
          cd /tmp/p0candidate
          npm install --ignore-scripts --no-audit --no-fund
          node --check src/index.js
          node --check src/agent-orchestrator.js
          node --check src/legal-runtime-governance.js
          node <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const d=c.d1_databases?.[0];
          if(c.name!=="ai-advokat-github-io") throw new Error("Unexpected Worker");
          if(!d || d.binding!=="DB" || d.database_name!=="ai-advokat-db" || d.database_id!==process.env.DB_ID) throw new Error("Unexpected production D1");
          if(c.vars?.OPENAI_MODEL!=="gpt-6.1-sol") throw new Error("Professional model policy changed");
          console.log("EXACT DEPLOYED CANDIDATE CONTRACT: PASS");
          NODE

      - name: Read-only D1 post-0050 convergence check
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p0candidate
          npx wrangler d1 migrations list DB --remote --config wrangler.jsonc | tee /tmp/p0-pending-post-activation.txt
          after="$(grep -Eo '00[0-9]{2}_[A-Za-z0-9_.-]+\.sql' /tmp/p0-pending-post-activation.txt | sort -u || true)"
          expected_after="$(printf '%s\n' \
            0045_case_private_d1_object_store.sql \
            0048_zkp_commentary_v6_secondary_layer.sql \
            0049_case_law_binding_extraction_audit.sql)"
          if [ "$after" != "$expected_after" ]; then
            echo "Unexpected pending migration set after 0050."
            exit 1
          fi
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT version,description FROM schema_migrations WHERE version='50'; PRAGMA table_info(lioe_runtime_runs);" | tee /tmp/p0-schema-post-activation.txt
          grep -q '"version": "50"' /tmp/p0-schema-post-activation.txt
          grep -q 'LIOE privacy-safe provider failure diagnostics' /tmp/p0-schema-post-activation.txt
          for col in error_code http_status response_status incomplete_reason provider_request_id provider_response_id provider_timeout_ms provider_attempts_json; do
            grep -q "\"name\": \"$col\"" /tmp/p0-schema-post-activation.txt
          done
          echo "POST-0050 D1 CONVERGENCE: PASS · 0045/0048/0049 remain pending"

      - name: Verify live governed runtime and membership fail-closed
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl --fail --retry 6 --retry-delay 2 "$BASE/api/health" -o /tmp/p0-health.json
          curl --fail --retry 6 --retry-delay 2 "$BASE/api/orchestrator" -o /tmp/p0-orchestrator.json
          curl --fail --retry 6 --retry-delay 2 "$BASE/api/capabilities" -o /tmp/p0-capabilities.json
          node <<'NODE'
          const h=require("/tmp/p0-health.json");
          const o=require("/tmp/p0-orchestrator.json");
          const c=require("/tmp/p0-capabilities.json");
          if(!h.ok || h.database?.reachable!==true || h.database?.schemaReady!==true || String(h.database?.schemaVersion)!=="50") throw new Error("Health/schema not ready");
          if(!o.ok || o.runtime?.lioeRuntimeTelemetry!=="ready" || o.runtime?.lioePostflight!=="enabled" || o.runtime?.lioeSpecialistExecution!=="enabled") throw new Error("Governed orchestrator not ready");
          if(c.capabilities?.legalOrchestrator!=="openai_paid_governed_workers_ai_free" || c.capabilities?.lioeRuntimeTelemetry!=="ready") {
            throw new Error("Capabilities mismatch: "+JSON.stringify({
              legalOrchestrator:c.capabilities?.legalOrchestrator,
              lioeRuntimeTelemetry:c.capabilities?.lioeRuntimeTelemetry
            }));
          }
          console.log("LIVE GOVERNED RUNTIME: PASS");
          NODE
          code="$(curl --silent --show-error --output /tmp/p0-bot-unauth.json --write-out '%{http_code}' -H 'content-type: application/json' -d '{"q":"Здраво"}' "$BASE/api/bot")"
          test "$code" = "401"
          grep -q 'bot_membership_required' /tmp/p0-bot-unauth.json
          echo "PROFESSIONAL MEMBERSHIP FAIL-CLOSED: PASS · PROVIDER NOT CALLED"

      - name: Limited paid AI smoke - revision and mandatory postflight
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl --fail --retry 2 --retry-delay 2 \
            -H 'content-type: application/json' \
            -H 'Origin: https://ai-advokat.github.io' \
            -d '{"q":"Спореди две можни толкувања на условите за дозволеност на ревизија во граѓанска постапка, со процесни ризици и ограничувања. Не измислувај важечки праг или рок ако не е потврден.","mode":"auto","webSearch":false,"history":[],"guideIds":[],"guideDocuments":[],"attachments":[]}' \
            "$BASE/api/chat" -o /tmp/p0-revision-smoke.json
          node <<'NODE'
          const d=require("/tmp/p0-revision-smoke.json");
          if(!d.ok) throw new Error("Revision smoke failed: "+JSON.stringify(d).slice(0,1600));
          if(d.provider!=="openai" || d.model!=="gpt-6.1-sol") throw new Error("Unexpected Professional provider/model");
          if(d.legalGovernance?.engine!=="AI_ADVOKAT_LIOE_v1" || d.legalGovernance?.postflightRequired!==true) throw new Error("Revision governance missing");
          if(d.runtimeTelemetry!=="recorded" || !d.governanceRunId) throw new Error("Revision telemetry not recorded");
          require("fs").writeFileSync("/tmp/p0-revision-run-id.txt",d.governanceRunId);
          console.log("REVISION LEGAL SMOKE: PASS");
          NODE

      - name: Limited paid AI smoke - labour draft and mandatory postflight
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-advokat-github-io.aiadvokat16.workers.dev"
          curl --fail --retry 2 --retry-delay 2 \
            -H 'content-type: application/json' \
            -H 'Origin: https://ai-advokat.github.io' \
            -d '{"q":"Направи ми тужба за враќање на работник на работа.","mode":"auto","webSearch":false,"history":[],"guideIds":[],"guideDocuments":[],"attachments":[]}' \
            "$BASE/api/chat" -o /tmp/p0-labour-smoke.json
          node <<'NODE'
          const d=require("/tmp/p0-labour-smoke.json");
          if(!d.ok) throw new Error("Labour draft smoke failed: "+JSON.stringify(d).slice(0,1600));
          if(d.provider!=="openai" || d.model!=="gpt-6.1-sol") throw new Error("Unexpected Professional provider/model");
          if(d.legalGovernance?.engine!=="AI_ADVOKAT_LIOE_v1" || d.legalGovernance?.postflightRequired!==true) throw new Error("Labour governance missing");
          if(d.runtimeTelemetry!=="recorded" || !d.governanceRunId) throw new Error("Labour telemetry not recorded");
          require("fs").writeFileSync("/tmp/p0-labour-run-id.txt",d.governanceRunId);
          console.log("LABOUR DRAFT SMOKE: PASS");
          NODE

      - name: Read back LIOE telemetry for both paid smokes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p0candidate
          R1="$(cat /tmp/p0-revision-run-id.txt)"
          R2="$(cat /tmp/p0-labour-run-id.txt)"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT run_id,mission_profile,verification_state,release_state,postflight_required,provider_calls,total_tokens,error_code,http_status,response_status,incomplete_reason,provider_timeout_ms,telemetry_schema_version FROM lioe_runtime_runs WHERE run_id IN ('$R1','$R2') ORDER BY run_id;" | tee /tmp/p0-telemetry-readback.txt
          grep -q "\"run_id\": \"$R1\"" /tmp/p0-telemetry-readback.txt
          grep -q "\"run_id\": \"$R2\"" /tmp/p0-telemetry-readback.txt
          grep -q '"telemetry_schema_version": "1.1"' /tmp/p0-telemetry-readback.txt
          echo "LIOE TELEMETRY READBACK: PASS"

      - name: Upload non-secret post-activation verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-0050-post-activation-verification-evidence
          retention-days: 30
          path: |
            /tmp/p0-pending-post-activation.txt
            /tmp/p0-schema-post-activation.txt
            /tmp/p0-health.json
            /tmp/p0-orchestrator.json
            /tmp/p0-capabilities.json
            /tmp/p0-bot-unauth.json
            /tmp/p0-telemetry-readback.txt
          if-no-files-found: error

      - name: Post-activation verification result
        run: |
          echo "P0 0050 POST-ACTIVATION VERIFICATION: PASS"
          echo "Deployed Worker Version ID from activation run #3: $EXPECTED_WORKER_VERSION_ID"
          echo "Migration 0050 remains converged; 0045/0048/0049 remain pending."
          echo "Governed runtime, membership fail-closed, legal smokes and telemetry readback verified."
